# CI incremental audit — static only, fail on critical
audit:
  projectPath: frontend/
  include:
    - lib/**/*.dart
  exclude:
    - lib/generated/**
    - lib/**/*.g.dart
    - lib/**/*.freezed.dart
    - test/**
  categories:
    - spacing
    - typography
    - accessibility
  minimumSeverity: medium
  runtime:
    enabled: false
  output:
    formats: [json, markdown]
    directory: .kiro/audit-reports/
  thresholds:
    failOnCritical: true
    failOnHigh: true

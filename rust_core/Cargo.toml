[workspace]
members = [
  "crates/openflow_core_bridge",
  "crates/media_timeline",
  "crates/media_image_doc",
  "crates/media_workflow",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "LicenseRef-OpenFlow-Proprietary"
license-file = "../LICENSE"
version = "0.1.0"
authors = ["Openflow"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[profile.dev]
incremental = false
debug = 1
codegen-units = 256

[profile.test]
incremental = false
debug = 0
codegen-units = 64

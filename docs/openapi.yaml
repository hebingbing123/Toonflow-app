  /api/v1/jobs:
    get:
      tags: [jobs]
      summary: List generation jobs for the current user
      operationId: listJobsV1
      description: |
        Returns `app_generation_job` rows for `owner_user_id = JWT sub`, newest first.
        Optional **`limit`** (default **100**, max **100**) and **`offset`** (default **0**, must be **>= 0**) control pagination; invalid values → **400**.
        Optional query **`kind`** and **`status`**: when set (non-empty after trim), rows must match **exactly** (AND). Omitted or blank → no filter on that dimension.
        **`status`** is normalized to ASCII lowercase and must be one of **`queued`**, **`running`**, **`succeeded`**, **`failed`**, **`cancelled`**; otherwise **400**.
        Requires `DATABASE_URL` on the server.
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
          description: Exact `kind` filter
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [queued, running, succeeded, failed, cancelled]
          description: Exact `status` filter
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 100
            default: 100
          description: Page size (1–100). Omitted → 100.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
          description: Rows to skip. Omitted → 0.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobRow"
        "400":
          description: Invalid `status`, `limit`, or `offset` query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      tags: [jobs]
      summary: Create a queued generation job
      operationId: createJobV1
      description: |
        Inserts a row with `status: queued`. Worker processing is not part of this endpoint.
        Optional header **`Idempotency-Key`**: when set (max 200 chars after trim), the first successful insert is stored per owner; retries with the same key return the **same row** (HTTP 200) without creating a duplicate.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 200
          description: Optional; dedupe create per `owner_user_id` when replayed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobBody"
      responses:
        "200":
          description: Created row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRow"
        "400":
          description: Empty `kind`, malformed JSON, unknown properties in body (only `kind` and `payload`), or JSON that fails deserialization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"


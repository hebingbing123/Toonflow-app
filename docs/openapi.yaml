          nullable: true
        subscription_status:
          type: string
          nullable: true
          description: Normalized subscription status from profile (`active`, `past_due`, etc.)
        subscription_current_period_end_at:
          type: string
          format: date-time
          nullable: true
          description: Current paid subscription period end (when known)
        daily_job_quota:
          type: integer
          format: int64
          nullable: true
          description: |
            Effective daily generation-job cap for this user (UTC natural day).
            `null` = unlimited (enterprise tier or per-user override set to unlimited).
            Derived from `plan_tier` defaults or `app_user_profile.daily_job_quota` override.
            Absent when `DATABASE_URL` is unset (falls back to free-tier default in that case).
        jobs_today:
          type: integer
          format: int64
          nullable: true
          description: |
            Number of generation jobs created today (UTC midnight to now).
            Absent when `DATABASE_URL` is unset.
        memory_config:
          $ref: "#/components/schemas/MemoryConfig"
          nullable: true
          description: |
            User memory/RAG configuration from `app_user_profile.memory_config`.
            Present when row exists and has non-null JSON; absent when unset.
            When DATABASE_URL is unset, falls back to server defaults (same as `GET /api/v1/settings/memory-config`).

    MemoryConfig:
      type: object
      required: [messagesPerSummary, shortTermLimit, summaryMaxLength, summaryLimit, ragLimit, deepRetrieveSummaryLimit, modelOnnxFile, modelDtype]
      properties:
        messagesPerSummary:
          type: integer
          format: int64
          description: Number of messages before triggering a summary
        shortTermLimit:
          type: integer
          format: int64
          description: Short-term memory window size
        summaryMaxLength:
          type: integer
          format: int64
          description: Maximum tokens per summary
        summaryLimit:
          type: integer
          format: int64
          description: Maximum number of summaries to retain
        ragLimit:
          type: integer
          format: int64
          description: Top-K retrieved chunks for RAG context
        deepRetrieveSummaryLimit:
          type: integer
          format: int64
          description: Top-K summaries for deep retrieval
        modelOnnxFile:
          type: array
          items:
            type: string
          description: Path segments to ONNX embedding model
        modelDtype:
          type: string
          description: ONNX model data type (fp16/fp32)

    UsageSummaryResponse:
      type: object
      required: [events_last_24h, events_last_7d, event_counts_last_7d, jobs_today, daily_job_quota]
      properties:
        events_last_24h:
          type: integer
          format: int64
          description: Rows in `app_usage_event` in the rolling last 24 hours
        events_last_7d:
          type: integer
          format: int64
          description: Rows in `app_usage_event` in the rolling last 7 days
        event_counts_last_7d:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Per `event_type` counts in the rolling last 7 days (empty object when no rows)
        jobs_today:
          type: integer
          format: int64
          description: Generation jobs created today (UTC natural day) — same counter used by quota enforcement
        daily_job_quota:
          type: integer
          format: int64
          nullable: true
          description: Effective daily job cap for this user (`null` = unlimited, e.g. enterprise tier)
        quota_remaining:
          type: integer
          format: int64
          nullable: true
          description: |
            Remaining jobs allowed today (`null` = unlimited). `0` means quota is exhausted.
            Absent when `daily_job_quota` is `null`.


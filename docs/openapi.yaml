            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/jobs/{id}/cancel:
    post:
      tags: [jobs]
      summary: Cancel a queued or running job
      operationId: cancelJobV1
      description: |
        Sets `status` to `cancelled` when the job is **`queued`** or **`running`**. The worker finishes cooperatively (it does not overwrite `cancelled` when completing). Terminal states **`succeeded`**, **`failed`**, **`cancelled`** → HTTP 409.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job row after cancellation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRow"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: Job is not `queued` or `running` (already terminal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/jobs/{id}/retry:
    post:
      tags: [jobs]
      summary: Re-queue a failed job
      operationId: retryJobV1
      description: |
        Sets `status` to **`queued`**, clears `error_message` and `result`, for jobs in **`failed`** only. The worker will pick the row up again. Other statuses → HTTP 409.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job row after re-queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRow"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: Job is not `failed`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/jobs/{id}:
    get:
      tags: [jobs]
      summary: Get one job by id (must be owned by caller)
      operationId: getJobV1
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRow"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase-issued access token (`Authorization: Bearer <jwt>`).
        Rust validates signature/claims per Supabase project settings (see architecture plan §4.2).

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: toonflow-server

    PingResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true

    VersionResponse:
      type: object
      required: [service, version]
      properties:
        service:
          type: string
          example: toonflow-server
        version:
          type: string
          description: Rust crate / binary version (`CARGO_PKG_VERSION`)
        git_sha:
          type: string
          description: |
            Optional. Embedded at **compile time** when `TOONFLOW_GIT_SHA` was set for `cargo build` / `cargo test` (not read from runtime `.env`).

    ModelListEntry:
      type: object
      required: [id, label, value, type, name]
      description: Legacy-shaped row; `id` is vendor id, `name` is vendor name, `value` is API model id string
      properties:
        id:
          type: integer
          format: int32
        label:
          type: string
          description: Human-readable model label
        value:
          type: string
          description: Provider model id (e.g. `gpt-4o-mini`)
        type:
          type: string
          enum: [text, image, video]
        name:
          type: string
          description: Vendor display name

    ModelDetailResponse:
      type: object
      required: [vendor_id, vendor_name, name, model_name, type]
      properties:
        vendor_id:
          type: integer
          format: int32
        vendor_name:
          type: string
        name:
          type: string
          description: Human-readable model label
        model_name:
          type: string
        type:
          type: string
          enum: [text, image, video]

    TextModelDefaultResponse:
      type: object
      required: [legacy_placeholder, default_model_id]
      properties:
        legacy_placeholder:
          type: string
          description: Same as legacy **`getTextModel`** **`data`** field (stub).
          example: "123"
        default_model_id:

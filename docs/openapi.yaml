  /api/v1/webhooks/billing/events:
    get:
      tags: [webhooks]
      summary: List ingested billing webhook events (audit)
      operationId: listBillingWebhookEventsV1
      description: |
        Bearer JWT required. Returns recent rows from `app_billing_webhook_event` for audit/debug.
        Supports optional filters by `informational_event`, `provider`, created-at window
        (`created_from` / `created_to`, RFC3339), `raw_event_id` / `raw_event_id_prefix`,
        `event_type`, `provider_event_id_prefix`, `event_created_from` / `event_created_to`,
        row id range (`id_min` / `id_max`, inclusive; `id_min` must be `<= id_max` when both set),
        plus basic pagination (`limit` + `offset`).
      security:
        - bearerAuth: []
      parameters:
        - name: informational_event
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by informational whitelist classification.
        - name: provider
          in: query
          required: false
          schema:
            type: string
          description: Provider filter (normalized lowercase; e.g. `stripe`, `alipay`, `paddle`).
        - name: raw_event_id
          in: query
          required: false
          schema:
            type: string
          description: Exact raw event id filter (non-empty string), e.g. `evt_123`.
        - name: raw_event_id_prefix
          in: query
          required: false
          schema:
            type: string
          description: Prefix match on raw event id (non-empty string), e.g. `evt_`.
        - name: event_type
          in: query
          required: false
          schema:
            type: string
          description: Exact event type filter (non-empty string), e.g. `invoice.payment_failed`.
        - name: provider_event_id_prefix
          in: query
          required: false
          schema:
            type: string
          description: Prefix match on dedupe key `provider_event_id` (non-empty), e.g. `stripe:evt_`.
        - name: provider_event_id
          in: query
          required: false
          schema:
            type: string
          description: Exact match on dedupe key `provider_event_id` (non-empty), e.g. `stripe:evt_123`.
        - name: event_created_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include rows with `event_created_at >= event_created_from` (RFC3339).
        - name: event_created_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include rows with `event_created_at <= event_created_to` (RFC3339).
        - name: created_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include rows with `created_at >= created_from` (RFC3339).
        - name: created_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include rows with `created_at <= created_to` (RFC3339).
        - name: id_min
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Include rows with `id >= id_min` (inclusive).
        - name: id_max
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Include rows with `id <= id_max` (inclusive). When both `id_min` and `id_max` are set, `id_min` must be `<= id_max`.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [id_desc, id_asc]
            default: id_desc
          description: Sort order by row id.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingWebhookEventsResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Database not configured/reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"


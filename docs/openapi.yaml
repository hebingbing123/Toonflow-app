  /api/v1/scripts/extract-state/poll:
    post:
      tags: [scripts]
      summary: Poll script asset-extract state (legacy `pollScriptAssets` parity)
      operationId: pollScriptExtractStateV1
      description: |
        Returns **`legacy_id`**, **`extract_state`**, **`error_reason`** for owned scripts whose **`extract_state` is not `0`**.
        **`0`** means *extracting in progress* (legacy batch flow); those rows are **excluded** so clients poll until completion/failure.
        At most **2000** ids per request.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptExtractStatePollBody"
      responses:
        "200":
          description: OK (may be empty if all requested ids are still extracting or unknown)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScriptExtractStatePollRow"
        "400":
          description: Invalid body or too many ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":

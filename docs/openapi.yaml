  /api/v1/scripts/extract-state/poll:
    post:
      tags: [scripts]
      summary: Poll script asset-extract state (Electron `pollScriptAssets` parity)
      operationId: pollScriptExtractStateV1
      description: |
        Returns **`numeric_id`**, **`extract_state`**, **`error_reason`** for owned scripts whose **`extract_state` is not `0`**.
        **`0`** means *extracting in progress* (Electron-era batch flow); those rows are **excluded** so clients poll until completion/failure.
        At most **2000** ids per request.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScriptExtractStatePollBody"
      responses:
        "200":
          description: OK (may be empty if all requested ids are still extracting or unknown)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScriptExtractStatePollRow"
        "400":
          description: Invalid body or too many ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/scripts/extract-assets:
    post:
      tags: [scripts]
      summary: Start async script asset extraction (Electron `extractAssets` parity)
      operationId: startScriptAssetExtractV1
      description: |
        Marks selected scripts **`extract_state = 2`** then **`0`** while processing, then **`1`** on success or **`-1`** on failure (same integers as SQLite).
        Work runs in a **background task** after **`200`** — response body is only **`{ "status": "accepted", "message": "…" }`** (Electron-era returned success text then continued in-process).

        **Requires** **`DATABASE_URL`**, **`OPENAI_API_KEY`** / **`LLM_API_KEY`**, and migrated tables **`app_asset`** / **`app_script_asset`**.

        System prompt: bundled default under `backend/data/prompts/script_asset_extraction.default.txt`, or override with env **`SCRIPT_ASSET_EXTRACT_PROMPT_PATH`** (absolute or cwd-relative file).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractAssetsStartBody"
      responses:
        "200":
          description: Job accepted (processing continues asynchronously)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractAssetsAcceptedResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Database unset, auth unset, or LLM not configured (`llm_not_configured`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"


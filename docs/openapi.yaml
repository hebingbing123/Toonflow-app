        **`history_images`** lists **`app_asset_image`** rows for that asset with **`state = '已完成'`** (legacy
        **`o_image`** completed rows), ordered by **`sort_index`** then **`created_at`**. **`metadata`** on each
        item is the parent **`app_asset`** JSON snapshot (e.g. **`imageId`**).

openapi: 3.1.0
externalDocs:
  description: WebSocket `/api/v1/ws` — JSON envelope, events, Harness `harness.tool.invoke` / `harness.tool.result`
  url: ./websocket-events.md
info:
  title: Toonflow API
  version: 1.0.0
  description: |
    HTTP surface for the Rust backend (`backend/`). All versioned routes live under `/api/v1`.
    WebSocket: `GET /api/v1/ws` (Upgrade) — JSON envelope protocol in **`docs/websocket-events.md`** (also linked from `externalDocs` above); optional query `access_token`.

    **Harness tools (MVP):** Tool **catalog** and metadata are exposed over HTTP at **`GET /api/v1/harness/tools`**. **Execution** uses the WebSocket types **`harness.tool.invoke`** / **`harness.tool.result`** (e.g. `echo`, `isolated.echo` — process-isolated echo — `skills.read` with `arguments.path`) — see the WebSocket doc for payloads and `error.occurred` codes.

    **Billing webhook (MVP):** `POST /api/v1/webhooks/billing` — verify **`X-Toonflow-Signature: sha256=<hex>`** as HMAC-SHA256(raw body, `BILLING_WEBHOOK_SECRET`). Body must be JSON with string **`id`** (dedupe key). Returns **`received`** + **`duplicate`** when replayed. **Not** JWT-authenticated; configure secret in production. **Not** in the per-IP rate-limit bucket (same as `/health`).

    **Rate limiting (MVP):** Per client IP on all routes except unversioned `/health`, `/api/v1/health`, `/api/v1/version`, `/api/v1/ready`, and **`POST /api/v1/webhooks/billing`**.
    Default key is **TCP peer** IP; set **`RATE_LIMIT_TRUST_FORWARDED_HEADERS=1`** only behind a **trusted** proxy to use `Forwarded` / `X-Forwarded-For` / `X-Real-Ip` (spoofing risk if untrusted).
    Exceeding the limit returns **429** with **`Retry-After`** (seconds) and **`x-ratelimit-*`** headers.
    Tune with `RATE_LIMIT_REFILL_MS` (default `20`) and `RATE_LIMIT_BURST` (default `100`).

    **Request correlation:** Responses include **`X-Request-Id`** (echo client value or server-generated UUID).
    JSON error bodies (`code`, `message`) also include **`request_id`** when applicable. Clients may send **`X-Request-Id`** on requests (optional).

    **Usage (MVP):** Successful generation jobs append **`app_usage_event`** (`generation_job.succeeded`). **`GET /api/v1/usage/summary`** returns per-user counts (24h / 7d) for fair-use dashboards.

servers:
  - url: http://127.0.0.1:8666
    description: Local dev (default `PORT`; override with env)

tags:
  - name: system
    description: Health and probes
  - name: session
    description: Auth probe (Supabase JWT)
  - name: projects
    description: User-owned projects (Postgres + RLS)
  - name: scripts
    description: Scripts under owned projects (Postgres + RLS)
  - name: storyboards
    description: Storyboards under owned scripts (Postgres + RLS)
  - name: skills
    description: Read-only Markdown skills from `backend/data/skills`
  - name: harness
    description: Harness tool catalog over HTTP; tool execution over WebSocket (`harness.tool.invoke` — see `externalDocs`)
  - name: jobs
    description: Long-running generation jobs (`app_generation_job`; Postgres + RLS)
  - name: usage
    description: Per-user usage counts (`app_usage_event`; Postgres + RLS)
  - name: agents
    description: Per-user agent memory (`app_agent_memory`; Postgres + RLS); legacy `/api/agents/getMemory` / `clearMemory` parity
  - name: webhooks
    description: Server-to-server billing webhooks (HMAC); not browser CORS flows

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness (unversioned)
      operationId: healthRoot
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/health:
    get:
      tags: [system]
      summary: Liveness (versioned)
      operationId: healthV1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/version:
    get:
      tags: [system]
      summary: Server semantic version (from Cargo package)
      operationId: versionV1
      description: |
        Public, no auth. Aligns with legacy **`/api/other/getVersion`** use cases for client compatibility checks.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /api/v1/ready:
    get:
      tags: [system]
      summary: Readiness (optional database ping)
      operationId: readyV1
      description: |
        If `DATABASE_URL` is set, runs `SELECT 1`. Otherwise returns `database: not_configured` (HTTP 200).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/webhooks/billing:
    post:
      tags: [webhooks]
      summary: Ingest signed billing webhook (idempotent by JSON `id`)
      operationId: postBillingWebhookV1
      description: |
        Verifies **HMAC-SHA256** of the **raw request body** using `BILLING_WEBHOOK_SECRET`.
        Header **`X-Toonflow-Signature`** must be `sha256=` followed by lowercase hex (64 chars).
        Persists to `app_billing_webhook_event` when `id` is new; replays return `duplicate: true` (HTTP 200).
        On **first** receipt only, if **`user_id`** (UUID string) and **`plan_tier`** (non-empty string) are present, upserts **`app_user_profile`** (`billing_currency` / `billing_provider` optional).
        Returns **503** if `BILLING_WEBHOOK_SECRET` is unset or `DATABASE_URL` is not configured.
      security: []
      parameters:
        - name: X-Toonflow-Signature
          in: header
          required: true
          schema:
            type: string
          description: Format `sha256=<hex>` (HMAC-SHA256 of raw body).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              additionalProperties: true
              properties:
                id:
                  type: string
                  description: Provider event id; used as deduplication key.
                user_id:
                  type: string
                  format: uuid
                  description: Optional; when set with `plan_tier`, updates `app_user_profile` on first receipt only.
                plan_tier:
                  type: string
                  description: Optional; e.g. `free`, `pro` (see plan §12).
                billing_currency:
                  type: string
                  description: Optional; e.g. `CNY`.
                billing_provider:
                  type: string
                  description: Optional provider name for audit.
      responses:
        "200":
          description: Accepted (or duplicate replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingWebhookResponse"
        "400":
          description: Invalid JSON or missing non-empty `id`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing/bad signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Secret or database not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/me:
    get:
      tags: [session]
      summary: Current user from JWT plus SaaS profile when database is configured
      operationId: meV1
      description: |
        Always returns JWT `sub` (and `email` when present in claims). When **`DATABASE_URL`** is set, loads **`plan_tier`** / billing fields from **`app_user_profile`** (defaults to **`plan_tier: free`** when no row).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: "`SUPABASE_JWT_SECRET` not configured, or database error when loading profile"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/usage/summary:
    get:
      tags: [usage]
      summary: Usage event counts for the current user
      operationId: usageSummaryV1
      description: |
        Counts rows in **`app_usage_event`** for **`user_id = JWT sub`**: last 24 hours and last 7 days.
        Events are appended by the job worker when a generation job reaches **`succeeded`**.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummaryResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/agents/memory/query:
    post:
      tags: [agents]
      summary: List agent message memories for a legacy project scope
      operationId: queryAgentMemoryV1
      description: |
        Returns **`message`** rows for **`owner_user_id` + `projectId` + `agentType` + `episodesId`** (omit or null `episodesId` for the non-episode scope).
        Response shape matches legacy **`/api/agents/getMemory`** `data` array (camelCase, markdown content blocks).
        Requires an **`app_project`** row owned by the user with **`legacy_id = projectId`**.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryAgentMemoryBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemoryHistoryItem"
        "400":
          description: Invalid body or unknown `agentType`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No owned project with that legacy id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/agents/memory/clear:
    post:
      tags: [agents]
      summary: Clear agent memories for a legacy project scope
      operationId: clearAgentMemoryV1
      description: |
        Same semantics as legacy **`/api/agents/clearMemory`**: `all` deletes all rows; `message` deletes messages and summaries; `summary` clears summary rows and resets `summarized` on messages.
        Send **`type`** (legacy) or **`clearType`** with values **`all`**, **`message`**, or **`summary`** (default **`all`**).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClearAgentMemoryBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearAgentMemoryResponse"
        "400":
          description: Invalid body or unknown `agentType` / clear kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No owned project with that legacy id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/agents/memory/append:
    post:
      tags: [agents]
      summary: Append a single message memory (no auto-summary)
      operationId: appendAgentMemoryV1
      description: |
        Inserts one **`message`** row (`summarized = 0`, optional `embedding` left null). Does **not** run legacy auto-summary compaction (that required LLM + embeddings in Node).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendAgentMemoryBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppendAgentMemoryResponse"
        "400":
          description: Invalid body, empty `content`, or unknown `agentType`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No owned project with that legacy id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/projects:
    get:
      tags: [projects]
      summary: List projects for the current user
      operationId: listProjectsV1
      description: |
        Returns `app_project` rows where `owner_user_id` matches the JWT `sub`.
        Requires `DATABASE_URL` on the server (otherwise 503).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectRow"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/projects/legacy/{legacy_id}:
    get:
      tags: [projects]
      summary: Project detail by legacy integer id
      operationId: getProjectByLegacyIdV1
      description: |
        Resolves `app_project` by `legacy_id` and current user; includes child `app_script` rows.
      security:
        - bearerAuth: []
      parameters:
        - name: legacy_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetailResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No project with that legacy id for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    patch:
      tags: [projects]
      summary: Partially update project by legacy id
      operationId: patchProjectByLegacyIdV1
      description: |
        JSON merge patch for text columns on `app_project`. Omit a key to leave that column unchanged;
        `null` or empty string clears the column. At least one listed property must appear in the body.
      security:
        - bearerAuth: []
      parameters:
        - name: legacy_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchProjectBody"
      responses:
        "200":
          description: Updated project row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRow"
        "400":
          description: Invalid body, no fields to apply, unknown properties, or malformed JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No project with that legacy id for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      tags: [projects]
      summary: Delete project by legacy id
      operationId: deleteProjectByLegacyIdV1
      description: |
        Deletes the row in **`app_project`** for the current user. Child **`app_script`** / **`app_storyboard`** rows cascade (FK **`ON DELETE CASCADE`**).
        Also deletes **`app_agent_memory`** for the same **`legacy_project_id`** and user (not FK-linked to the project).
      security:
        - bearerAuth: []
      parameters:
        - name: legacy_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "204":
          description: Deleted
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No project with that legacy id for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/scripts/legacy/{legacy_id}:
    get:
      tags: [scripts]
      summary: Script by legacy integer id (owner must own parent project)
      operationId: getScriptByLegacyIdV1
      security:
        - bearerAuth: []
      parameters:
        - name: legacy_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptRow"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Script not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    patch:
      tags: [scripts]
      summary: Partially update script by legacy id
      operationId: patchScriptByLegacyIdV1
      description: |
        Merge patch for `name`, `content`, `extract_state`. Omit a key to leave unchanged;
        `null` or `""` clears text fields; `null` clears `extract_state`. At least one key required.
      security:
        - bearerAuth: []
      parameters:
        - name: legacy_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchScriptBody"
      responses:
        "200":
          description: Updated script row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptRow"
        "400":
          description: Invalid body, no fields to apply, unknown properties (only `name`, `content`, `extract_state`), or malformed JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Script not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      tags: [scripts]
      summary: Delete script by legacy id
      operationId: deleteScriptByLegacyIdV1
      description: |
        Deletes **`app_script`** when the row belongs to a project owned by the caller.
        Child **`app_storyboard`** rows cascade (**`ON DELETE CASCADE`**).
      security:
        - bearerAuth: []
      parameters:
        - name: legacy_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "204":
          description: Deleted
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Script not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/scripts/legacy/{script_legacy_id}/storyboards:
    get:
      tags: [storyboards]
      summary: List storyboards for a script (by script legacy id)
      operationId: listStoryboardsByScriptLegacyIdV1
      security:
        - bearerAuth: []
      parameters:
        - name: script_legacy_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoryboardRow"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/storyboards/legacy/{legacy_id}:
    get:
      tags: [storyboards]
      summary: Storyboard by legacy integer id
      operationId: getStoryboardByLegacyIdV1
      security:
        - bearerAuth: []
      parameters:
        - name: legacy_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryboardRow"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    patch:
      tags: [storyboards]
      summary: Partially update storyboard by legacy id
      operationId: patchStoryboardByLegacyIdV1
      description: |
        Merge patch; omit keys to leave unchanged; `null` or `""` clears text fields; `null` clears integers.
        At least one key required.
      security:
        - bearerAuth: []
      parameters:
        - name: legacy_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchStoryboardBody"
      responses:
        "200":
          description: Updated row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryboardRow"
        "400":
          description: Invalid body, no fields to apply, unknown properties (only keys on `PatchStoryboardBody`), or malformed JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/skills:
    get:
      tags: [skills]
      summary: List Markdown skills (relative paths under `data/skills`)
      operationId: listSkillsV1
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillFileMeta"
        "400":
          description: Skills directory missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/skills/content:
    get:
      tags: [skills]
      summary: Read one skill file (UTF-8 text)
      operationId: getSkillContentV1
      security:
        - bearerAuth: []
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Relative path, e.g. `script_execution_script.md`
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillContentResponse"
        "400":
          description: Path unsafe or file too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/harness/tools:
    get:
      tags: [harness]
      summary: List registered Harness tools (name and description; dispatch still WIP)
      operationId: listHarnessToolsV1
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessToolsResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/jobs:
    get:
      tags: [jobs]
      summary: List generation jobs for the current user
      operationId: listJobsV1
      description: |
        Returns up to 100 `app_generation_job` rows for `owner_user_id = JWT sub`, newest first.
        Requires `DATABASE_URL` on the server.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobRow"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      tags: [jobs]
      summary: Create a queued generation job
      operationId: createJobV1
      description: |
        Inserts a row with `status: queued`. Worker processing is not part of this endpoint.
        Optional header **`Idempotency-Key`**: when set (max 200 chars after trim), the first successful insert is stored per owner; retries with the same key return the **same row** (HTTP 200) without creating a duplicate.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 200
          description: Optional; dedupe create per `owner_user_id` when replayed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobBody"
      responses:
        "200":
          description: Created row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRow"
        "400":
          description: Empty `kind`, malformed JSON, unknown properties in body (only `kind` and `payload`), or JSON that fails deserialization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/jobs/{id}/cancel:
    post:
      tags: [jobs]
      summary: Cancel a queued or running job
      operationId: cancelJobV1
      description: |
        Sets `status` to `cancelled` when the job is **`queued`** or **`running`**. The worker finishes cooperatively (it does not overwrite `cancelled` when completing). Terminal states **`succeeded`**, **`failed`**, **`cancelled`** → HTTP 409.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job row after cancellation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRow"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: Job is not `queued` or `running` (already terminal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/jobs/{id}/retry:
    post:
      tags: [jobs]
      summary: Re-queue a failed job
      operationId: retryJobV1
      description: |
        Sets `status` to **`queued`**, clears `error_message` and `result`, for jobs in **`failed`** only. The worker will pick the row up again. Other statuses → HTTP 409.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job row after re-queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRow"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: Job is not `failed`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/jobs/{id}:
    get:
      tags: [jobs]
      summary: Get one job by id (must be owned by caller)
      operationId: getJobV1
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRow"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase-issued access token (`Authorization: Bearer <jwt>`).
        Rust validates signature/claims per Supabase project settings (see architecture plan §4.2).

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: toonflow-server

    VersionResponse:
      type: object
      required: [service, version]
      properties:
        service:
          type: string
          example: toonflow-server
        version:
          type: string
          description: Rust crate / binary version (`CARGO_PKG_VERSION`)

    ReadyResponse:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          example: ok
        database:
          type: string
          enum: [not_configured, connected]
          description: "`not_configured` when `DATABASE_URL` is unset"

    MeResponse:
      type: object
      required: [sub, plan_tier]
      properties:
        sub:
          type: string
          format: uuid
          description: Supabase Auth user id (`JWT sub`)
        email:
          type: string
          format: email
          description: Present when included in JWT claims
        plan_tier:
          type: string
          description: From `app_user_profile`; `free` when DATABASE_URL is unset or no row exists
        billing_currency:
          type: string
          nullable: true
        billing_provider:
          type: string
          nullable: true

    UsageSummaryResponse:
      type: object
      required: [events_last_24h, events_last_7d]
      properties:
        events_last_24h:
          type: integer
          format: int64
          description: Rows in `app_usage_event` in the rolling last 24 hours
        events_last_7d:
          type: integer
          format: int64
          description: Rows in `app_usage_event` in the rolling last 7 days

    QueryAgentMemoryBody:
      type: object
      required: [projectId, agentType]
      additionalProperties: false
      properties:
        projectId:
          type: integer
          format: int32
          description: Legacy integer project id (`app_project.legacy_id`)
        agentType:
          type: string
          enum: [scriptAgent, productionAgent]
        episodesId:
          type: integer
          format: int32
          nullable: true

    ClearAgentMemoryBody:
      type: object
      required: [projectId, agentType]
      additionalProperties: false
      description: |
        Optional **`type`** (legacy) or **`clearType`**: `all` (default), `message`, or `summary`.
      properties:
        projectId:
          type: integer
          format: int32
        agentType:
          type: string
          enum: [scriptAgent, productionAgent]
        episodesId:
          type: integer
          format: int32
          nullable: true
        clearType:
          type: string
          enum: [all, message, summary]
          default: all
        type:
          type: string
          enum: [all, message, summary]
          description: Legacy alias for `clearType` (same values)

    ClearAgentMemoryResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    AppendAgentMemoryBody:
      type: object
      required: [projectId, agentType, content]
      additionalProperties: false
      properties:
        projectId:
          type: integer
          format: int32
        agentType:
          type: string
          enum: [scriptAgent, productionAgent]
        episodesId:
          type: integer
          format: int32
          nullable: true
        role:
          type: string
          description: Defaults to `user` when omitted
        content:
          type: string
        name:
          type: string
          nullable: true
        createTime:
          type: integer
          format: int64
          description: Epoch milliseconds; server default is now

    AppendAgentMemoryResponse:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid

    MemoryMarkdownBlock:
      type: object
      required: [type, status, data]
      properties:
        type:
          type: string
          enum: [markdown]
        status:
          type: string
          enum: [complete]
        data:
          type: string

    MemoryHistoryItem:
      type: object
      required: [id, role, status, datetime, content, createTime]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        name:
          type: string
          nullable: true
        status:
          type: string
          enum: [complete]
        datetime:
          type: string
          format: date-time
        content:
          type: array
          items:
            $ref: "#/components/schemas/MemoryMarkdownBlock"
        createTime:
          type: integer
          format: int64
          description: Epoch milliseconds (stored as `create_time_ms`)

    ProjectRow:
      type: object
      required: [id, legacy_id]
      properties:
        id:
          type: string
          format: uuid
        legacy_id:
          type: integer
          format: int32
        name:
          type: string
          nullable: true
        intro:
          type: string
          nullable: true
        project_type:
          type: string
          nullable: true
        image_model:
          type: string
          nullable: true
        image_quality:
          type: string
          nullable: true
        video_model:
          type: string
          nullable: true
        art_style:
          type: string
          nullable: true
        director_manual:
          type: string
          nullable: true
        mode:
          type: string
          nullable: true
        video_ratio:
          type: string
          nullable: true
        create_time_ms:
          type: integer
          format: int64
          nullable: true

    ScriptBrief:
      type: object
      required: [legacy_id]
      properties:
        legacy_id:
          type: integer
          format: int32
        name:
          type: string
          nullable: true
        extract_state:
          type: integer
          format: int32
          nullable: true

    ProjectDetailResponse:
      type: object
      required: [project, scripts]
      properties:
        project:
          $ref: "#/components/schemas/ProjectRow"
        scripts:
          type: array
          items:
            $ref: "#/components/schemas/ScriptBrief"

    PatchProjectBody:
      type: object
      additionalProperties: false
      description: |
        At least one property required. Use `null` or `""` to clear a column.
        Only the listed properties are accepted; extra keys are rejected (HTTP 400).
      properties:
        name:
          type: string
          nullable: true
        intro:
          type: string
          nullable: true
        project_type:
          type: string
          nullable: true
        image_model:
          type: string
          nullable: true
        image_quality:
          type: string
          nullable: true
        video_model:
          type: string
          nullable: true
        art_style:
          type: string
          nullable: true
        director_manual:
          type: string
          nullable: true
        mode:
          type: string
          nullable: true
        video_ratio:
          type: string
          nullable: true

    ScriptRow:
      type: object
      required: [id, project_id, legacy_id]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        legacy_id:
          type: integer
          format: int32
        name:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        extract_state:
          type: integer
          format: int32
          nullable: true
        create_time_ms:
          type: integer
          format: int64
          nullable: true

    PatchScriptBody:
      type: object
      additionalProperties: false
      description: At least one property required; unknown properties rejected (HTTP 400).
      properties:
        name:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        extract_state:
          type: integer
          format: int32
          nullable: true

    StoryboardRow:
      type: object
      required: [id, script_id, legacy_id]
      properties:
        id:
          type: string
          format: uuid
        script_id:
          type: string
          format: uuid
        legacy_id:
          type: integer
          format: int32
        legacy_script_id:
          type: integer
          format: int32
          nullable: true
        prompt:
          type: string
          nullable: true
        file_path:
          type: string
          nullable: true
        duration:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        track_id:
          type: integer
          format: int32
          nullable: true
        reason:
          type: string
          nullable: true
        track:
          type: string
          nullable: true
        video_desc:
          type: string
          nullable: true
        should_generate_image:
          type: integer
          format: int32
          nullable: true
        legacy_project_id:
          type: integer
          format: int32
          nullable: true
        flow_id:
          type: integer
          format: int32
          nullable: true
        sb_index:
          type: integer
          format: int32
          nullable: true
        create_time_ms:
          type: integer
          format: int64
          nullable: true

    PatchStoryboardBody:
      type: object
      additionalProperties: false
      description: At least one property required; unknown properties rejected (HTTP 400).
      properties:
        prompt:
          type: string
          nullable: true
        file_path:
          type: string
          nullable: true
        duration:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        track:
          type: string
          nullable: true
        video_desc:
          type: string
          nullable: true
        legacy_script_id:
          type: integer
          format: int32
          nullable: true
        track_id:
          type: integer
          format: int32
          nullable: true
        should_generate_image:
          type: integer
          format: int32
          nullable: true
        legacy_project_id:
          type: integer
          format: int32
          nullable: true
        flow_id:
          type: integer
          format: int32
          nullable: true
        sb_index:
          type: integer
          format: int32
          nullable: true

    SkillFileMeta:
      type: object
      required: [path, size_bytes]
      properties:
        path:
          type: string
          description: Relative path under `data/skills`
        size_bytes:
          type: integer
          format: int64

    SkillContentResponse:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
        content:
          type: string

    HarnessToolInfo:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string

    HarnessToolsResponse:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items:
            $ref: "#/components/schemas/HarnessToolInfo"

    BillingWebhookResponse:
      type: object
      required: [received, duplicate]
      properties:
        received:
          type: boolean
        duplicate:
          type: boolean
        id:
          type: integer
          format: int64
          description: |
            app_billing_webhook_event row id when duplicate is false.
        profile_updated:
          type: boolean
          description: |
            True when user_id and plan_tier were applied to app_user_profile (first receipt only).

    JobRow:
      type: object
      required:
        - id
        - owner_user_id
        - kind
        - status
        - payload
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        payload:
          type: object
          additionalProperties: true
        result:
          type: object
          nullable: true
          additionalProperties: true
        error_message:
          type: string
          nullable: true
        idempotency_key:
          type: string
          nullable: true
          description: Set when created with `Idempotency-Key` header; unique per owner when present.
        claimed_by:
          type: string
          nullable: true
          description: Worker instance label when `running` (`WORKER_ID` env); cleared when re-queued after `failed`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateJobBody:
      type: object
      additionalProperties: false
      required: [kind]
      description: Only `kind` and `payload` are accepted; extra properties are rejected by the server (HTTP 400).
      properties:
        kind:
          type: string
          description: Non-empty after trim (e.g. `storyboard.generate`)
        payload:
          type: object
          additionalProperties: true
          description: Defaults to `{}` when omitted

    ErrorBody:
      type: object
      required: [code, message]
      description: |
        Stable error envelope for `/api/v1/*`. Clients should log `request_id` for support.
      properties:
        code:
          type: string
          description: Machine-readable error code (snake_case)
          example: unauthorized
        message:
          type: string
          description: Human-readable summary
        request_id:
          type: string
          format: uuid
          description: Correlates with server logs / tracing
        details:
          type: object
          additionalProperties: true
          description: Optional structured detail (validation fields, etc.)

    RateLimitError:
      allOf:
        - $ref: "#/components/schemas/ErrorBody"
        - type: object
          properties:
            code:
              const: rate_limited
            retry_after_ms:
              type: integer
              description: Suggested backoff in milliseconds (mirror `Retry-After` when present)

          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CornerScapeRequestBody"
            examples:
              empty:
                summary: No type filter
                value: {}
              rolesOnly:
                summary: Roles only
                value:
                  types: [role]

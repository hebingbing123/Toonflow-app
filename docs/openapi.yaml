        Optional **`limit`** (1–200) with **`page`** (1-based, default 1) paginate; without **`limit`**, all matches are returned and **`total`** equals **`items`** length.
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: script_numeric_id
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: asset_type
          in: query
          required: false
          schema:
            type: string
            enum: [role, tool, scene]
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
      responses:

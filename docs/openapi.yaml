components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase-issued access token (`Authorization: Bearer <jwt>`).
        Rust validates signature/claims per Supabase project settings (see architecture plan §4.2).

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: toonflow-server

    PingResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true

    VersionResponse:
      type: object
      required: [service, version]
      properties:
        service:
          type: string
          example: toonflow-server
        version:
          type: string
          description: Rust crate / binary version (`CARGO_PKG_VERSION`)
        git_sha:
          type: string
          description: |
            Optional. Embedded at **compile time** when `TOONFLOW_GIT_SHA` was set for `cargo build` / `cargo test` (not read from runtime `.env`).

    ModelListEntry:
      type: object
      required: [id, label, value, type, name]
      description: Legacy-shaped row; `id` is vendor id, `name` is vendor name, `value` is API model id string
      properties:
        id:
          type: integer
          format: int32
        label:
          type: string
          description: Human-readable model label
        value:
          type: string
          description: Provider model id (e.g. `gpt-4o-mini`)
        type:
          type: string
          enum: [text, image, video]
        name:
          type: string
          description: Vendor display name

    ModelDetailResponse:
      type: object
      required: [vendor_id, vendor_name, name, model_name, type]
      properties:
        vendor_id:
          type: integer
          format: int32
        vendor_name:
          type: string
        name:
          type: string
          description: Human-readable model label
        model_name:
          type: string
        type:
          type: string
          enum: [text, image, video]

    TextModelDefaultResponse:
      type: object
      required: [stub_placeholder, default_model_id]
      properties:
        stub_placeholder:
          type: string
          description: Same as historical **`getTextModel`** **`data`** field (stub).
          example: "123"
        default_model_id:
          type: string
          description: Composite id for **`GET /api/v1/models/detail?model_id=`**
          example: "1:gpt-4o-mini"

    PatchTextModelDefaultBody:
      type: object
      properties:
        model_id:
          type: string
          nullable: true
          description: |
            Composite id `{vendor_id}:{model_name}` (e.g. `1:gpt-4o-mini`).
            Must exist in **`GET /api/v1/models/detail`** catalog.
            Pass `null` to reset to server default.
          example: "1:gpt-4o-mini"

    SwitchAiDevToolResponse:
      type: object
      required: [value]
      properties:
        value:
          type: string
          enum: ["0", "1"]
          description: Legacy `o_setting.switchAiDevTool` string flag

    SwitchAiDevToolPutRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
          enum: ["0", "1"]

    MemoryConfig:
      type: object
      description: Legacy `o_setting` keys for memory / RAG UI (camelCase JSON)
      required:
        - messagesPerSummary
        - shortTermLimit
        - summaryMaxLength
        - summaryLimit
        - ragLimit
        - deepRetrieveSummaryLimit
        - modelOnnxFile
        - modelDtype
      properties:
        messagesPerSummary:
          type: integer
          format: int64
        shortTermLimit:
          type: integer
          format: int64
        summaryMaxLength:
          type: integer
          format: int64
        summaryLimit:
          type: integer
          format: int64
        ragLimit:
          type: integer
          format: int64
        deepRetrieveSummaryLimit:
          type: integer
          format: int64
        modelOnnxFile:
          type: array
          items:
            type: string
        modelDtype:
          type: string

    MemoryConfigSavedResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Legacy sureMemory success text
          example: 保存设置成功

    SettingsClearAgentMemoriesBody:
      type: object
      required: [projectId, agentType]
      additionalProperties: false
      description: |
        Legacy **`delAllMemory`** had no body and cleared all SQLite **`memories`**; Rust requires project + agent scope (see **`postSettingsClearAgentMemoriesV1`**).
      properties:
        projectId:
          type: integer
          format: int32
        agentType:
          type: string
          enum: [scriptAgent, productionAgent]
        episodesId:
          type: integer
          format: int32
          nullable: true

    VendorCatalogSummary:
      type: object
      required: [id, name, modelCount, modelKinds]
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        modelCount:
          type: integer
          format: int32
          minimum: 0
        modelKinds:
          type: array
          items:
            type: string
          description: Sorted unique model `type` values from the embedded catalog

    VendorsSummaryResponse:
      type: object
      required: [vendors, source]
      properties:
        vendors:
          type: array
          items:
            $ref: "#/components/schemas/VendorSummaryItem"
        source:
          type: string
          enum: [static_catalog_with_user_config]
          description: Static catalog merged with per-user vendor_config from app_user_profile

    VendorSummaryItem:
      type: object
      required: [id, name, modelCount, modelKinds]
      properties:
        id:
          type: integer
          format: int32
          description: Vendor ID from static catalog
        name:
          type: string
        modelCount:
          type: integer
          format: int32
        modelKinds:
          type: array
          items:
            type: string
        userConfig:
          $ref: "#/components/schemas/VendorConfigEntry"
          description: User configuration for this vendor (if any)

    VendorConfigEntry:
      type: object
      required: [vendorId]
      properties:
        vendorId:
          type: string
          description: Vendor ID from the static catalog
        displayName:
          type: string
          nullable: true
          description: User-defined display name override
        enabled:
          type: boolean
          description: Whether this vendor is enabled for this user
        selectedModels:
          type: array
          items:
            type: string
          description: Selected model IDs from this vendor
        settings:
          type: object
          additionalProperties:
            type: string
          description: Additional non-sensitive config (API keys excluded)

    VendorConfig:
      type: object
      properties:
        vendors:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/VendorConfigEntry"
          description: Per-vendor configurations keyed by vendor_id
        defaultTextVendorId:
          type: string
          nullable: true
        defaultImageVendorId:
          type: string
          nullable: true
        defaultVideoVendorId:
          type: string
          nullable: true

    VendorModelTestBody:
      type: object
      required: [modelName, type, id]
      additionalProperties: false
      properties:
        modelName:
          type: string
        type:
          type: string
          enum: [text, image, video]
        id:
          type: string
          description: Legacy vendor id string (e.g. OpenAI vendor row key)

    VendorAddBody:
      type: object
      required: [tsCode]
      additionalProperties: false
      properties:
        tsCode:
          type: string
          description: Legacy TS provider script (evaluated with vm2 in Electron)

    VendorUpdateBody:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Vendor ID from static catalog
        displayName:
          type: string
          description: User-defined display name (optional)
        selectedModels:
          type: array
          items:
            type: string
          description: Selected model IDs from this vendor
        settings:
          type: object
          additionalProperties:
            type: string
          description: Non-sensitive settings only (API keys excluded for security)

    VendorUpdateResponse:
      type: object
      required: [vendorId, message]
      properties:
        vendorId:
          type: string
          description: Vendor ID that was updated
        message:
          type: string
          description: Confirmation message

    VendorMutationResponse:
      type: object
      required: [vendorId, message]
      properties:
        vendorId:
          type: string
          description: Vendor ID that was created, updated, or deleted
        message:
          type: string
          description: Confirmation message

    VendorEnableResponse:
      allOf:
        - $ref: "#/components/schemas/VendorMutationResponse"
        - type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
              description: Persisted enabled state

    VendorLinkResponse:
      allOf:
        - $ref: "#/components/schemas/VendorMutationResponse"
        - type: object
          required: [link]
          properties:
            link:
              type: string
              description: Stored external code link

    VendorIdBody:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:
          type: string

    VendorEnableBody:

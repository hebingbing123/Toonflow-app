openapi: 3.1.0
info:
  title: Toonflow API
  version: 1.0.0
  description: |
    HTTP surface for the Rust backend (`backend/`). All versioned routes live under `/api/v1`.
    WebSocket: `GET /api/v1/ws` (Upgrade) — JSON envelope protocol in `docs/websocket-events.md`; optional query `access_token`.

servers:
  - url: http://127.0.0.1:8666
    description: Local dev (default `PORT`; override with env)

tags:
  - name: system
    description: Health and probes
  - name: session
    description: Auth probe (Supabase JWT)
  - name: projects
    description: User-owned projects (Postgres + RLS)
  - name: scripts
    description: Scripts under owned projects (Postgres + RLS)
  - name: storyboards
    description: Storyboards under owned scripts (Postgres + RLS)
  - name: skills
    description: Read-only Markdown skills from `backend/data/skills`
  - name: harness
    description: Harness metadata (tool registry stubs)

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness (unversioned)
      operationId: healthRoot
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/health:
    get:
      tags: [system]
      summary: Liveness (versioned)
      operationId: healthV1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/ready:
    get:
      tags: [system]
      summary: Readiness (optional database ping)
      operationId: readyV1
      description: |
        If `DATABASE_URL` is set, runs `SELECT 1`. Otherwise returns `database: not_configured` (HTTP 200).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/me:
    get:
      tags: [session]
      summary: Current user from JWT (no DB round-trip)
      operationId: meV1
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: `SUPABASE_JWT_SECRET` not configured on server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/projects:
    get:
      tags: [projects]
      summary: List projects for the current user
      operationId: listProjectsV1
      description: |
        Returns `app_project` rows where `owner_user_id` matches the JWT `sub`.
        Requires `DATABASE_URL` on the server (otherwise 503).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectRow"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/projects/legacy/{legacy_id}:
    get:
      tags: [projects]
      summary: Project detail by legacy integer id
      operationId: getProjectByLegacyIdV1
      description: |
        Resolves `app_project` by `legacy_id` and current user; includes child `app_script` rows.
      security:
        - bearerAuth: []
      parameters:
        - name: legacy_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetailResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No project with that legacy id for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    patch:
      tags: [projects]
      summary: Partially update project by legacy id
      operationId: patchProjectByLegacyIdV1
      description: |
        JSON merge patch for `name` and `intro`. Omit a key to leave that column unchanged;
        `null` or empty string clears the column. At least one of `name` or `intro` must appear in the body.
      security:
        - bearerAuth: []
      parameters:
        - name: legacy_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchProjectBody"
      responses:
        "200":
          description: Updated project row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRow"
        "400":
          description: Invalid body or no fields to apply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No project with that legacy id for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/scripts/legacy/{legacy_id}:
    get:
      tags: [scripts]
      summary: Script by legacy integer id (owner must own parent project)
      operationId: getScriptByLegacyIdV1
      security:
        - bearerAuth: []
      parameters:
        - name: legacy_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptRow"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Script not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    patch:
      tags: [scripts]
      summary: Partially update script by legacy id
      operationId: patchScriptByLegacyIdV1
      description: |
        Merge patch for `name`, `content`, `extract_state`. Omit a key to leave unchanged;
        `null` or `""` clears text fields; `null` clears `extract_state`. At least one key required.
      security:
        - bearerAuth: []
      parameters:
        - name: legacy_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchScriptBody"
      responses:
        "200":
          description: Updated script row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptRow"
        "400":
          description: Invalid body or no fields to apply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Script not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/scripts/legacy/{script_legacy_id}/storyboards:
    get:
      tags: [storyboards]
      summary: List storyboards for a script (by script legacy id)
      operationId: listStoryboardsByScriptLegacyIdV1
      security:
        - bearerAuth: []
      parameters:
        - name: script_legacy_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoryboardRow"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/storyboards/legacy/{legacy_id}:
    get:
      tags: [storyboards]
      summary: Storyboard by legacy integer id
      operationId: getStoryboardByLegacyIdV1
      security:
        - bearerAuth: []
      parameters:
        - name: legacy_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryboardRow"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    patch:
      tags: [storyboards]
      summary: Partially update storyboard by legacy id
      operationId: patchStoryboardByLegacyIdV1
      description: |
        Merge patch; omit keys to leave unchanged; `null` or `""` clears text fields; `null` clears integers.
        At least one key required.
      security:
        - bearerAuth: []
      parameters:
        - name: legacy_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchStoryboardBody"
      responses:
        "200":
          description: Updated row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryboardRow"
        "400":
          description: Invalid body or no fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/skills:
    get:
      tags: [skills]
      summary: List Markdown skills (relative paths under `data/skills`)
      operationId: listSkillsV1
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillFileMeta"
        "400":
          description: Skills directory missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/skills/content:
    get:
      tags: [skills]
      summary: Read one skill file (UTF-8 text)
      operationId: getSkillContentV1
      security:
        - bearerAuth: []
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Relative path, e.g. `script_execution_script.md`
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillContentResponse"
        "400":
          description: Path unsafe or file too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/harness/tools:
    get:
      tags: [harness]
      summary: List registered Harness tool names (stubs)
      operationId: listHarnessToolsV1
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessToolsResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase-issued access token (`Authorization: Bearer <jwt>`).
        Rust validates signature/claims per Supabase project settings (see architecture plan §4.2).

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: toonflow-server

    ReadyResponse:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          example: ok
        database:
          type: string
          enum: [not_configured, connected]
          description: `not_configured` when `DATABASE_URL` is unset

    MeResponse:
      type: object
      required: [sub]
      properties:
        sub:
          type: string
          format: uuid
          description: Supabase Auth user id (`JWT sub`)
        email:
          type: string
          format: email
          description: Present when included in JWT claims

    ProjectRow:
      type: object
      required: [id, legacy_id]
      properties:
        id:
          type: string
          format: uuid
        legacy_id:
          type: integer
          format: int32
        name:
          type: string
          nullable: true
        intro:
          type: string
          nullable: true
        project_type:
          type: string
          nullable: true
        create_time_ms:
          type: integer
          format: int64
          nullable: true

    ScriptBrief:
      type: object
      required: [legacy_id]
      properties:
        legacy_id:
          type: integer
          format: int32
        name:
          type: string
          nullable: true
        extract_state:
          type: integer
          format: int32
          nullable: true

    ProjectDetailResponse:
      type: object
      required: [project, scripts]
      properties:
        project:
          $ref: "#/components/schemas/ProjectRow"
        scripts:
          type: array
          items:
            $ref: "#/components/schemas/ScriptBrief"

    PatchProjectBody:
      type: object
      description: |
        At least one property required. Use `null` or `""` to clear `name` or `intro`.
      properties:
        name:
          type: string
          nullable: true
        intro:
          type: string
          nullable: true

    ScriptRow:
      type: object
      required: [id, project_id, legacy_id]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        legacy_id:
          type: integer
          format: int32
        name:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        extract_state:
          type: integer
          format: int32
          nullable: true
        create_time_ms:
          type: integer
          format: int64
          nullable: true

    PatchScriptBody:
      type: object
      description: At least one property required.
      properties:
        name:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        extract_state:
          type: integer
          format: int32
          nullable: true

    StoryboardRow:
      type: object
      required: [id, script_id, legacy_id]
      properties:
        id:
          type: string
          format: uuid
        script_id:
          type: string
          format: uuid
        legacy_id:
          type: integer
          format: int32
        legacy_script_id:
          type: integer
          format: int32
          nullable: true
        prompt:
          type: string
          nullable: true
        file_path:
          type: string
          nullable: true
        duration:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        track_id:
          type: integer
          format: int32
          nullable: true
        reason:
          type: string
          nullable: true
        track:
          type: string
          nullable: true
        video_desc:
          type: string
          nullable: true
        should_generate_image:
          type: integer
          format: int32
          nullable: true
        legacy_project_id:
          type: integer
          format: int32
          nullable: true
        flow_id:
          type: integer
          format: int32
          nullable: true
        sb_index:
          type: integer
          format: int32
          nullable: true
        create_time_ms:
          type: integer
          format: int64
          nullable: true

    PatchStoryboardBody:
      type: object
      description: At least one property required.
      properties:
        prompt:
          type: string
          nullable: true
        file_path:
          type: string
          nullable: true
        duration:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        track:
          type: string
          nullable: true
        video_desc:
          type: string
          nullable: true
        legacy_script_id:
          type: integer
          format: int32
          nullable: true
        track_id:
          type: integer
          format: int32
          nullable: true
        should_generate_image:
          type: integer
          format: int32
          nullable: true
        legacy_project_id:
          type: integer
          format: int32
          nullable: true
        flow_id:
          type: integer
          format: int32
          nullable: true
        sb_index:
          type: integer
          format: int32
          nullable: true

    SkillFileMeta:
      type: object
      required: [path, size_bytes]
      properties:
        path:
          type: string
          description: Relative path under `data/skills`
        size_bytes:
          type: integer
          format: int64

    SkillContentResponse:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
        content:
          type: string

    HarnessToolsResponse:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items:
            type: string

    ErrorBody:
      type: object
      required: [code, message]
      description: |
        Stable error envelope for `/api/v1/*`. Clients should log `request_id` for support.
      properties:
        code:
          type: string
          description: Machine-readable error code (snake_case)
          example: unauthorized
        message:
          type: string
          description: Human-readable summary
        request_id:
          type: string
          format: uuid
          description: Correlates with server logs / tracing
        details:
          type: object
          additionalProperties: true
          description: Optional structured detail (validation fields, etc.)

    RateLimitError:
      allOf:
        - $ref: "#/components/schemas/ErrorBody"
        - type: object
          properties:
            code:
              const: rate_limited
            retry_after_ms:
              type: integer
              description: Suggested backoff in milliseconds (mirror `Retry-After` when present)

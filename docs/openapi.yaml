        - kind
        - status
        - payload
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        payload:
          type: object
          additionalProperties: true
        result:
          type: object
          nullable: true
          additionalProperties: true
        error_message:
          type: string
          nullable: true

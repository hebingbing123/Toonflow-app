        id:
          type: integer
          format: int32
        name:
          type: string
        model:
          type: string
        modelName:
          type: string
        vendorId:
          type: string
          nullable: true
        desc:
          type: string

    AgentSetKeyBody:
      type: object
      additionalProperties: false

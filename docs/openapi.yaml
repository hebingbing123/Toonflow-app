            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/jobs/{id}/cancel:
    post:
      tags: [jobs]
      summary: Cancel a queued or running job
      operationId: cancelJobV1
      description: |
        Sets `status` to `cancelled` when the job is **`queued`** or **`running`**. The worker finishes cooperatively (it does not overwrite `cancelled` when completing). Terminal states **`succeeded`**, **`failed`**, **`cancelled`** → HTTP 409.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job row after cancellation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRow"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: Job is not `queued` or `running` (already terminal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/jobs/{id}/retry:
    post:
      tags: [jobs]
      summary: Re-queue a failed job
      operationId: retryJobV1
      description: |
        Sets `status` to **`queued`**, clears `error_message` and `result`, for jobs in **`failed`** only. The worker will pick the row up again. Other statuses → HTTP 409.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job row after re-queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRow"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: Job is not `failed`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/jobs/{id}:
    get:
      tags: [jobs]
      summary: Get one job by id (must be owned by caller)
      operationId: getJobV1
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRow"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase-issued access token (`Authorization: Bearer <jwt>`).
        Rust validates signature/claims per Supabase project settings (see architecture plan §4.2).

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: toonflow-server

    VersionResponse:
      type: object
      required: [service, version]
      properties:
        service:
          type: string
          example: toonflow-server
        version:
          type: string
          description: Rust crate / binary version (`CARGO_PKG_VERSION`)
        git_sha:
          type: string
          description: |
            Optional. Embedded at **compile time** when `TOONFLOW_GIT_SHA` was set for `cargo build` / `cargo test` (not read from runtime `.env`).

    ModelListEntry:
      type: object
      required: [id, label, value, type, name]
      description: Legacy-shaped row; `id` is vendor id, `name` is vendor name, `value` is API model id string
      properties:
        id:
          type: integer
          format: int32
        label:
          type: string
          description: Human-readable model label
        value:
          type: string
          description: Provider model id (e.g. `gpt-4o-mini`)
        type:
          type: string
          enum: [text, image, video]
        name:
          type: string
          description: Vendor display name

    ModelDetailResponse:
      type: object
      required: [vendor_id, vendor_name, name, model_name, type]
      properties:
        vendor_id:
          type: integer
          format: int32
        vendor_name:
          type: string
        name:
          type: string
          description: Human-readable model label
        model_name:
          type: string
        type:
          type: string
          enum: [text, image, video]

    ReadyResponse:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          example: ok
        database:
          type: string
          enum: [not_configured, connected]
          description: "`not_configured` when `DATABASE_URL` is unset"

    MeResponse:
      type: object
      required: [sub, plan_tier]
      properties:
        sub:
          type: string
          format: uuid
          description: Supabase Auth user id (`JWT sub`)
        email:
          type: string
          format: email
          description: Present when included in JWT claims
        plan_tier:
          type: string
          description: From `app_user_profile`; `free` when DATABASE_URL is unset or no row exists
        billing_currency:
          type: string
          nullable: true
        billing_provider:
          type: string
          nullable: true

    UsageSummaryResponse:
      type: object
      required: [events_last_24h, events_last_7d, event_counts_last_7d]
      properties:
        events_last_24h:
          type: integer
          format: int64
          description: Rows in `app_usage_event` in the rolling last 24 hours
        events_last_7d:
          type: integer
          format: int64
          description: Rows in `app_usage_event` in the rolling last 7 days
        event_counts_last_7d:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Per `event_type` counts in the rolling last 7 days (empty object when no rows)

    QueryAgentMemoryBody:
      type: object
      required: [projectId, agentType]
      additionalProperties: false
      properties:
        projectId:
          type: integer
          format: int32
          description: Legacy integer project id (`app_project.legacy_id`)
        agentType:
          type: string
          enum: [scriptAgent, productionAgent]
        episodesId:
          type: integer
          format: int32
          nullable: true

    ClearAgentMemoryBody:
      type: object
      required: [projectId, agentType]
      additionalProperties: false
      description: |
        Optional **`type`** (legacy) or **`clearType`**: `all` (default), `message`, or `summary`.
      properties:
        projectId:
          type: integer
          format: int32
        agentType:
          type: string
          enum: [scriptAgent, productionAgent]
        episodesId:
          type: integer
          format: int32
          nullable: true
        clearType:
          type: string
          enum: [all, message, summary]
          default: all
        type:
          type: string
          enum: [all, message, summary]
          description: Legacy alias for `clearType` (same values)

    ClearAgentMemoryResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    AppendAgentMemoryBody:
      type: object
      required: [projectId, agentType, content]
      additionalProperties: false
      properties:
        projectId:
          type: integer
          format: int32
        agentType:
          type: string
          enum: [scriptAgent, productionAgent]
        episodesId:
          type: integer
          format: int32
          nullable: true
        role:
          type: string
          description: Defaults to `user` when omitted
        content:
          type: string
        name:
          type: string
          nullable: true
        createTime:
          type: integer
          format: int64
          description: Epoch milliseconds; server default is now

    AppendAgentMemoryResponse:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid

    MemoryMarkdownBlock:
      type: object
      required: [type, status, data]
      properties:
        type:
          type: string
          enum: [markdown]
        status:
          type: string
          enum: [complete]
        data:
          type: string

    MemoryHistoryItem:
      type: object
      required: [id, role, status, datetime, content, createTime]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        name:
          type: string
          nullable: true
        status:
          type: string
          enum: [complete]
        datetime:
          type: string
          format: date-time
        content:
          type: array
          items:
            $ref: "#/components/schemas/MemoryMarkdownBlock"
        createTime:
          type: integer
          format: int64
          description: Epoch milliseconds (stored as `create_time_ms`)

    ProjectRow:
      type: object
      required: [id, legacy_id]
      properties:
        id:
          type: string
          format: uuid
        legacy_id:
          type: integer
          format: int32
        name:
          type: string
          nullable: true
        intro:
          type: string
          nullable: true
        project_type:
          type: string
          nullable: true
        image_model:
          type: string
          nullable: true
        image_quality:
          type: string
          nullable: true

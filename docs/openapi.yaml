              schema:
                $ref: "#/components/schemas/LegacyNovelOkMessageResponse"
        "400":
          description: Invalid projectId or too many rows in data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Project legacy id not found for caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/novels/delete-novel:
    post:
      tags: [novels]
      summary: Legacy — delete one novel by legacy id
      operationId: postNovelsDeleteNovelV1
      description: |
        Parity with **`POST /api/novel/deleteNovel`**. **`id`** is **`app_novel.legacy_id`** (must be positive).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyNovelDeleteNovelBody"
      responses:
        "200":
          description: Row deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyNovelOkMessageResponse"
        "400":
          description: Non-positive id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No matching owned row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/novels/update-novel:
    post:
      tags: [novels]
      summary: Legacy — update one novel by legacy id
      operationId: postNovelsUpdateNovelV1
      description: |
        Parity with **`POST /api/novel/updateNovel`**. **`id`** is **`app_novel.legacy_id`**.
        **`index`** may be a JSON number or numeric string. Empty **`event`** clears **`event`** to null in Postgres.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyNovelUpdateNovelBody"
      responses:
        "200":
          description: Row updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyNovelOkMessageResponse"
        "400":
          description: Non-positive id or invalid index
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No matching owned row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/novels/batch-delete:
    post:
      tags: [novels]
      summary: Legacy — delete novels by legacy ids (owned rows only)
      operationId: postNovelsBatchDeleteV1
      description: |
        Parity with **`POST /api/novel/batchDeleteNovel`**. Deletes **`app_novel`** rows whose **`legacy_id`** is in **`ids`** and whose project is owned by the caller.
        Does not replicate SQLite **`o_eventChapter`** / **`o_event`** deletes. Empty **`ids`** → **400**. At most **500** ids per request.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyNovelBatchDeleteBody"
      responses:
        "200":
          description: At least one row deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyNovelOkMessageResponse"
        "400":
          description: Empty ids, too many ids, or invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No matching owned rows deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase-issued access token (`Authorization: Bearer <jwt>`).
        Rust validates signature/claims per Supabase project settings (see architecture plan §4.2).

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: toonflow-server

    PingResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true

    VersionResponse:
      type: object
      required: [service, version]
      properties:
        service:
          type: string
          example: toonflow-server
        version:
          type: string
          description: Rust crate / binary version (`CARGO_PKG_VERSION`)
        git_sha:
          type: string
          description: |
            Optional. Embedded at **compile time** when `TOONFLOW_GIT_SHA` was set for `cargo build` / `cargo test` (not read from runtime `.env`).

    ModelListEntry:
      type: object
      required: [id, label, value, type, name]
      description: Legacy-shaped row; `id` is vendor id, `name` is vendor name, `value` is API model id string
      properties:
        id:
          type: integer
          format: int32
        label:
          type: string
          description: Human-readable model label
        value:
          type: string
          description: Provider model id (e.g. `gpt-4o-mini`)
        type:
          type: string
          enum: [text, image, video]
        name:
          type: string
          description: Vendor display name

    ModelDetailResponse:
      type: object
      required: [vendor_id, vendor_name, name, model_name, type]
      properties:
        vendor_id:
          type: integer
          format: int32
        vendor_name:
          type: string
        name:
          type: string
          description: Human-readable model label
        model_name:
          type: string
        type:
          type: string
          enum: [text, image, video]

    TextModelDefaultResponse:
      type: object
      required: [legacy_placeholder, default_model_id]
      properties:
        legacy_placeholder:
          type: string
          description: Same as legacy **`getTextModel`** **`data`** field (stub).
          example: "123"
        default_model_id:
          type: string
          description: Composite id for **`GET /api/v1/models/detail?model_id=`**
          example: "1:gpt-4o-mini"

    PatchTextModelDefaultBody:
      type: object
      properties:
        model_id:
          type: string
          nullable: true
          description: |
            Composite id `{vendor_id}:{model_name}` (e.g. `1:gpt-4o-mini`).
            Must exist in **`GET /api/v1/models/detail`** catalog.
            Pass `null` to reset to server default.
          example: "1:gpt-4o-mini"

    SwitchAiDevToolResponse:
      type: object
      required: [value]
      properties:
        value:
          type: string
          enum: ["0", "1"]
          description: Legacy `o_setting.switchAiDevTool` string flag

    SwitchAiDevToolPutRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
          enum: ["0", "1"]

    MemoryConfig:
      type: object
      description: Legacy `o_setting` keys for memory / RAG UI (camelCase JSON)
      required:
        - messagesPerSummary
        - shortTermLimit
        - summaryMaxLength
        - summaryLimit
        - ragLimit
        - deepRetrieveSummaryLimit
        - modelOnnxFile
        - modelDtype
      properties:
        messagesPerSummary:
          type: integer
          format: int64
        shortTermLimit:
          type: integer
          format: int64
        summaryMaxLength:
          type: integer
          format: int64
        summaryLimit:
          type: integer
          format: int64
        ragLimit:
          type: integer
          format: int64
        deepRetrieveSummaryLimit:
          type: integer
          format: int64
        modelOnnxFile:
          type: array
          items:
            type: string
        modelDtype:
          type: string

    MemoryConfigSavedResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Legacy sureMemory success text
          example: 保存设置成功

    SettingsClearAgentMemoriesBody:
      type: object
      required: [projectId, agentType]
      additionalProperties: false
      description: |
        Legacy **`delAllMemory`** had no body and cleared all SQLite **`memories`**; Rust requires project + agent scope (see **`postSettingsClearAgentMemoriesV1`**).
      properties:
        projectId:
          type: integer
          format: int32
        agentType:
          type: string
          enum: [scriptAgent, productionAgent]
        episodesId:
          type: integer
          format: int32
          nullable: true

    VendorCatalogSummary:
      type: object
      required: [id, name, modelCount, modelKinds]
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        modelCount:
          type: integer
          format: int32
          minimum: 0
        modelKinds:
          type: array
          items:
            type: string
          description: Sorted unique model `type` values from the embedded catalog

    VendorsSummaryResponse:
      type: object
      required: [vendors, source]
      properties:
        vendors:
          type: array
          items:
            $ref: "#/components/schemas/VendorSummaryItem"
        source:
          type: string
          enum: [static_catalog_with_user_config]
          description: Static catalog merged with per-user vendor_config from app_user_profile

    VendorSummaryItem:
      type: object
      required: [id, name, modelCount, modelKinds]
      properties:
        id:
          type: integer
          format: int32
          description: Vendor ID from static catalog
        name:
          type: string
        modelCount:
          type: integer
          format: int32
        modelKinds:
          type: array
          items:
            type: string
        userConfig:
          $ref: "#/components/schemas/VendorConfigEntry"
          description: User configuration for this vendor (if any)

    VendorConfigEntry:
      type: object
      required: [vendorId]
      properties:
        vendorId:
          type: string
          description: Vendor ID from the static catalog
        displayName:
          type: string
          nullable: true
          description: User-defined display name override
        enabled:
          type: boolean
          description: Whether this vendor is enabled for this user
        selectedModels:
          type: array
          items:
            type: string
          description: Selected model IDs from this vendor
        settings:
          type: object
          additionalProperties:
            type: string
          description: Additional non-sensitive config (API keys excluded)

    VendorConfig:
      type: object
      properties:
        vendors:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/VendorConfigEntry"
          description: Per-vendor configurations keyed by vendor_id
        defaultTextVendorId:
          type: string
          nullable: true
        defaultImageVendorId:
          type: string
          nullable: true
        defaultVideoVendorId:
          type: string
          nullable: true

    VendorModelTestBody:
      type: object
      required: [modelName, type, id]
      additionalProperties: false
      properties:
        modelName:
          type: string
        type:
          type: string
          enum: [text, image, video]
        id:
          type: string
          description: Legacy vendor id string (e.g. OpenAI vendor row key)

    VendorAddBody:
      type: object
      required: [tsCode]
      additionalProperties: false
      properties:
        tsCode:
          type: string
          description: Legacy TS provider script (evaluated with vm2 in Electron)

    VendorUpdateBody:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Vendor ID from static catalog
        displayName:
          type: string
          description: User-defined display name (optional)
        selectedModels:
          type: array
          items:
            type: string
          description: Selected model IDs from this vendor
        settings:
          type: object
          additionalProperties:
            type: string
          description: Non-sensitive settings only (API keys excluded for security)

    VendorUpdateResponse:
      type: object
      required: [vendorId, message]
      properties:
        vendorId:
          type: string
          description: Vendor ID that was updated
        message:
          type: string
          description: Confirmation message

    VendorIdBody:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:
          type: string

    VendorEnableBody:
      type: object
      required: [id, enable]
      additionalProperties: false
      properties:
        id:
          type: string
        enable:
          type: number
          description: Legacy SQLite `enable` flag (**0** / **1**)

    VendorUpdateCodeBody:
      type: object
      required: [id, tsCode]
      additionalProperties: false
      properties:
        id:
          type: string
        tsCode:
          type: string

    VendorCodeFromLinkBody:
      type: object
      required: [link]
      additionalProperties: false
      properties:
        link:
          type: string
          description: URL to fetch (legacy **`getCodeByLink`**; may be any non-empty string)

    AgentDeployListBody:
      type: object
      additionalProperties: false
      description: Empty object `{}` only

    AgentDeployListItem:
      type: object
      required:
        [id, model, key, modelName, vendorId, desc, name, disabled, icon]
      properties:
        id:
          type: integer
          format: int32
        model:
          type: string
        key:
          type: string
        modelName:
          type: string
        vendorId:
          type: string
          nullable: true
        desc:
          type: string
        name:
          type: string
        disabled:
          type: boolean
        icon:
          type: string

    DeployAgentModelBody:

  /api/v1/jobs:
    get:
      tags: [jobs]
      summary: List generation jobs for the current user
      operationId: listJobsV1
      description: |
        Returns up to 100 `app_generation_job` rows for `owner_user_id = JWT sub`, newest first.
        Optional query **`kind`** and **`status`**: when set (non-empty after trim), rows must match **exactly** (AND). Omitted or blank → no filter on that dimension.
        Requires `DATABASE_URL` on the server.
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
          description: Exact `kind` filter
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [queued, running, succeeded, failed, cancelled]
          description: Exact `status` filter
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobRow"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      tags: [jobs]
      summary: Create a queued generation job
      operationId: createJobV1
      description: |
        Inserts a row with `status: queued`. Worker processing is not part of this endpoint.
        Optional header **`Idempotency-Key`**: when set (max 200 chars after trim), the first successful insert is stored per owner; retries with the same key return the **same row** (HTTP 200) without creating a duplicate.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 200
          description: Optional; dedupe create per `owner_user_id` when replayed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobBody"
      responses:
        "200":
          description: Created row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRow"
        "400":
          description: Empty `kind`, malformed JSON, unknown properties in body (only `kind` and `payload`), or JSON that fails deserialization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"


        file_path:
          type: string
          nullable: true
        duration:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        track:
          type: string
          nullable: true
        video_desc:
          type: string
          nullable: true
        legacy_script_id:
          type: integer
          format: int32
          nullable: true
        track_id:
          type: integer
          format: int32
          nullable: true
        should_generate_image:
          type: integer
          format: int32
          nullable: true
        legacy_project_id:
          type: integer
          format: int32
          nullable: true
        flow_id:
          type: integer
          format: int32
          nullable: true
        sb_index:
          type: integer
          format: int32
          nullable: true

    SkillFileMeta:
      type: object
      required: [path, size_bytes]
      properties:
        path:
          type: string
          description: Relative path under `data/skills`
        size_bytes:
          type: integer
          format: int64

    SkillsSummaryResponse:
      type: object
      required: [markdown_file_count, total_bytes]
      properties:
        markdown_file_count:
          type: integer
          format: int64
          description: Number of Markdown files counted (capped)
        total_bytes:
          type: integer
          format: int64
          description: Sum of file sizes for counted files

    SkillContentResponse:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
        content:
          type: string

    HarnessToolInfo:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string

    HarnessToolsResponse:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items:
            $ref: "#/components/schemas/HarnessToolInfo"

    BillingWebhookResponse:
      type: object
      required: [received, duplicate]
      properties:
        received:
          type: boolean
        duplicate:
          type: boolean
        id:
          type: integer
          format: int64
          description: |
            app_billing_webhook_event row id when duplicate is false.
        profile_updated:
          type: boolean
          description: |
            True when user_id and plan_tier were applied to app_user_profile (first receipt only).

    JobRow:
      type: object
      required:
        - id
        - owner_user_id
        - kind
        - status
        - payload
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
        kind:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        payload:
          type: object
          additionalProperties: true
        result:
          type: object
          nullable: true
          additionalProperties: true
        error_message:
          type: string
          nullable: true
        idempotency_key:
          type: string
          nullable: true
          description: Set when created with `Idempotency-Key` header; unique per owner when present.
        claimed_by:
          type: string
          nullable: true
          description: Worker instance label when `running` (`WORKER_ID` env); cleared when re-queued after `failed`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    JobKindSummary:
      type: object
      required: [kind, job_count]
      properties:
        kind:
          type: string
        job_count:
          type: integer
          format: int64

    JobStatusSummary:
      type: object
      required: [status, job_count]
      properties:
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        job_count:
          type: integer
          format: int64

    CreateJobBody:
      type: object
      additionalProperties: false
      required: [kind]
      description: Only `kind` and `payload` are accepted; extra properties are rejected by the server (HTTP 400).
      properties:
        kind:
          type: string
          description: Non-empty after trim (e.g. `storyboard.generate`)
        payload:
          type: object
          additionalProperties: true
          description: Defaults to `{}` when omitted

    ErrorBody:
      type: object
      required: [code, message]
      description: |
        Stable error envelope for `/api/v1/*`. Clients should log `request_id` for support.
      properties:
        code:
          type: string
          description: Machine-readable error code (snake_case)
          example: unauthorized
        message:
          type: string
          description: Human-readable summary
        request_id:
          type: string
          format: uuid
          description: Correlates with server logs / tracing
        details:
          type: object
          additionalProperties: true
          description: Optional structured detail (validation fields, etc.)

    RateLimitError:
      allOf:
        - $ref: "#/components/schemas/ErrorBody"
        - type: object
          properties:
            code:
              const: rate_limited
            retry_after_ms:
              type: integer
              description: Suggested backoff in milliseconds (mirror `Retry-After` when present)

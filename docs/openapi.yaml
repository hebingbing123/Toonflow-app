openapi: 3.1.0
externalDocs:
  description: WebSocket `/api/v1/ws` — JSON envelope; Harness `harness.tool.invoke` / `harness.tool.result` / `harness.agent.run` (tool loop)
  url: ./websocket-events.md
info:
  title: Toonflow API
  version: 1.0.0
  description: |
    HTTP surface for the Rust backend (`backend/`). All versioned routes live under `/api/v1`.
    WebSocket: `GET /api/v1/ws` (Upgrade) — JSON envelope protocol in **`docs/websocket-events.md`** (also linked from `externalDocs` above); optional query `access_token`.

    **Harness tools (MVP):** Tool **catalog** and metadata are exposed over HTTP at **`GET /api/v1/harness/tools`**. **Execution** uses **`harness.tool.invoke`** / **`harness.tool.result`** (e.g. `echo`, `isolated.echo`, `skills.read`, `wasm.probe`). **Agent loop:** **`harness.agent.run`** drives multi-round OpenAI tool calling over the same tool surface (requires LLM env + channel attach) — see **`docs/websocket-events.md`** for envelopes and `error.occurred` codes (`wasm_failed`, `isolation_failed`, etc.).

    **Billing webhook (MVP):** `POST /api/v1/webhooks/billing` — verify **`X-Toonflow-Signature: sha256=<hex>`** as HMAC-SHA256(raw body, `BILLING_WEBHOOK_SECRET`). Body must be JSON with string **`id`** (dedupe key). Returns **`received`** + **`duplicate`** when replayed. **Not** JWT-authenticated; configure secret in production. **Not** in the per-IP rate-limit bucket (same as `/health`).

    **Rate limiting (MVP):** Per client IP on all routes except unversioned `/health`, `/api/v1/health`, `/api/v1/version`, `/api/v1/ready`, and **`POST /api/v1/webhooks/billing`**.
    Default key is **TCP peer** IP; set **`RATE_LIMIT_TRUST_FORWARDED_HEADERS=1`** only behind a **trusted** proxy to use `Forwarded` / `X-Forwarded-For` / `X-Real-Ip` (spoofing risk if untrusted).
    Exceeding the limit returns **429** with **`Retry-After`** (seconds) and **`x-ratelimit-*`** headers.
    Tune with `RATE_LIMIT_REFILL_MS` (default `20`) and `RATE_LIMIT_BURST` (default `100`).

    **Request correlation:** Responses include **`X-Request-Id`** (echo client value or server-generated UUID).
    JSON error bodies (`code`, `message`) also include **`request_id`** when applicable. Clients may send **`X-Request-Id`** on requests (optional).

    **Usage (MVP):** Successful generation jobs append **`app_usage_event`** (`generation_job.succeeded`). **`GET /api/v1/usage/summary`** returns per-user counts (24h / 7d) for fair-use dashboards.

servers:
  - url: http://127.0.0.1:8666
    description: Local dev (default `PORT`; override with env)

tags:
  - name: system
    description: Health and probes
  - name: session
    description: Auth probe (Supabase JWT)
  - name: projects
    description: User-owned projects (Postgres + RLS)
  - name: assets
    description: Script-linked assets per project (`app_asset`, `app_script_asset`; Postgres + RLS)
  - name: scripts
    description: Scripts under owned projects (Postgres + RLS)
  - name: storyboards
    description: Storyboards under owned scripts (Postgres + RLS)
  - name: novels
    description: Novel source chapters per project (`app_novel`; Postgres + RLS)
  - name: art_styles
    description: Per-user art style presets (`app_art_style`; Postgres + RLS); legacy `o_artStyle` subset without OSS image upload
  - name: skills
    description: Read-only Markdown skills from `backend/data/skills`
  - name: harness
    description: Harness tool catalog over HTTP; tool execution over WebSocket (`harness.tool.invoke` — see `externalDocs`)
  - name: jobs
    description: Long-running generation jobs (`app_generation_job`; Postgres + RLS)
  - name: usage
    description: Per-user usage counts (`app_usage_event`; Postgres + RLS)
  - name: models
    description: Static vendor/model catalog (`backend/data/models_catalog.json`); legacy `modelSelect` parity without `o_vendorConfig`
  - name: agents
    description: Per-user agent memory (`app_agent_memory`; Postgres + RLS); legacy `/api/agents/getMemory` / `clearMemory` parity
  - name: webhooks
    description: Server-to-server billing webhooks (HMAC); not browser CORS flows

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness (unversioned)
      operationId: healthRoot
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/health:
    get:
      tags: [system]
      summary: Liveness (versioned)
      operationId: healthV1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/version:
    get:
      tags: [system]
      summary: Server semantic version (from Cargo package)
      operationId: versionV1
      description: |
        Public, no auth. Aligns with legacy **`/api/other/getVersion`** use cases for client compatibility checks.
        When the server binary is compiled with environment **`TOONFLOW_GIT_SHA`** set, the JSON may include **`git_sha`** (opaque string, often a Git commit id).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /api/v1/ready:
    get:
      tags: [system]
      summary: Readiness (optional database ping)
      operationId: readyV1
      description: |
        If `DATABASE_URL` is set, runs `SELECT 1`. Otherwise returns `database: not_configured` (HTTP 200).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/webhooks/billing:
    post:
      tags: [webhooks]
      summary: Ingest signed billing webhook (idempotent by JSON `id`)
      operationId: postBillingWebhookV1
      description: |
        Verifies **HMAC-SHA256** of the **raw request body** using `BILLING_WEBHOOK_SECRET`.
        Header **`X-Toonflow-Signature`** must be `sha256=` followed by lowercase hex (64 chars).
        Persists to `app_billing_webhook_event` when `id` is new; replays return `duplicate: true` (HTTP 200).
        On **first** receipt only, if **`user_id`** (UUID string) and **`plan_tier`** (non-empty string) are present, upserts **`app_user_profile`** (`billing_currency` / `billing_provider` optional).
        Returns **503** if `BILLING_WEBHOOK_SECRET` is unset or `DATABASE_URL` is not configured.
      security: []
      parameters:
        - name: X-Toonflow-Signature
          in: header
          required: true
          schema:
            type: string
          description: Format `sha256=<hex>` (HMAC-SHA256 of raw body).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              additionalProperties: true
              properties:
                id:
                  type: string
                  description: Provider event id; used as deduplication key.
                user_id:
                  type: string
                  format: uuid
                  description: Optional; when set with `plan_tier`, updates `app_user_profile` on first receipt only.
                plan_tier:
                  type: string
                  description: Optional; e.g. `free`, `pro` (see plan §12).
                billing_currency:
                  type: string
                  description: Optional; e.g. `CNY`.
                billing_provider:
                  type: string
                  description: Optional provider name for audit.
      responses:
        "200":
          description: Accepted (or duplicate replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingWebhookResponse"
        "400":
          description: Invalid JSON or missing non-empty `id`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing/bad signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Secret or database not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/me:
    get:
      tags: [session]
      summary: Current user from JWT plus SaaS profile when database is configured
      operationId: meV1
      description: |
        Always returns JWT `sub` (and `email` when present in claims). When **`DATABASE_URL`** is set, loads **`plan_tier`** / billing fields from **`app_user_profile`** (defaults to **`plan_tier: free`** when no row).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: "`SUPABASE_JWT_SECRET` not configured, or database error when loading profile"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/usage/summary:
    get:
      tags: [usage]
      summary: Usage event counts for the current user
      operationId: usageSummaryV1
      description: |
        Counts rows in **`app_usage_event`** for **`user_id = JWT sub`**: last 24 hours and last 7 days.
        Also returns **`event_counts_last_7d`**: a map of **`event_type` → count** for the same 7-day window.
        Events are appended by the job worker when a generation job reaches **`succeeded`**.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummaryResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/models:
    get:
      tags: [models]
      summary: List models from static catalog (filtered by type)
      operationId: listModelsV1
      description: |
        Bearer JWT. Data is baked from **`backend/data/models_catalog.json`** at compile time (no Postgres **`o_vendorConfig`**).
        Query **`type`**: `text` \| `image` \| `video` \| `all`. Omitted defaults to **`all`**, which **excludes** `video` rows (same rule as legacy **`modelSelect/getModelList`**).
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [text, image, video, all]
          description: Filter; `all` means every type except `video`
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelListEntry"
        "400":
          description: Invalid `type` query value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/models/detail:
    get:
      tags: [models]
      summary: Resolve one model by composite id
      operationId: modelDetailV1
      description: |
        Bearer JWT. **`model_id`** format **`{vendor_id}:{model_name}`** (e.g. `1:gpt-4o-mini`), aligned with legacy **`modelSelect/getModelDetail`** splitting **`modelId`**.
      security:
        - bearerAuth: []
      parameters:
        - name: model_id
          in: query
          required: true
          schema:
            type: string
            example: "1:gpt-4o-mini"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelDetailResponse"
        "400":
          description: Missing `model_id`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Unknown vendor or model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/agents/memory/query:
    post:
      tags: [agents]
      summary: List agent message memories for a legacy project scope
      operationId: queryAgentMemoryV1
      description: |
        Returns **`message`** rows for **`owner_user_id` + `projectId` + `agentType` + `episodesId`** (omit or null `episodesId` for the non-episode scope).
        Response shape matches legacy **`/api/agents/getMemory`** `data` array (camelCase, markdown content blocks).
        Requires an **`app_project`** row owned by the user with **`legacy_id = projectId`**.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryAgentMemoryBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemoryHistoryItem"
        "400":
          description: Invalid body or unknown `agentType`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No owned project with that legacy id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/agents/memory/clear:
    post:
      tags: [agents]
      summary: Clear agent memories for a legacy project scope
      operationId: clearAgentMemoryV1
      description: |
        Same semantics as legacy **`/api/agents/clearMemory`**: `all` deletes all rows; `message` deletes messages and summaries; `summary` clears summary rows and resets `summarized` on messages.
        Send **`type`** (legacy) or **`clearType`** with values **`all`**, **`message`**, or **`summary`** (default **`all`**).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClearAgentMemoryBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearAgentMemoryResponse"
        "400":
          description: Invalid body or unknown `agentType` / clear kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No owned project with that legacy id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/agents/memory/append:
    post:
      tags: [agents]
      summary: Append a single message memory (no auto-summary)
      operationId: appendAgentMemoryV1
      description: |
        Inserts one **`message`** row (`summarized = 0`, optional `embedding` left null). Does **not** run legacy auto-summary compaction (that required LLM + embeddings in Node).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendAgentMemoryBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppendAgentMemoryResponse"
        "400":
          description: Invalid body, empty `content`, or unknown `agentType`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No owned project with that legacy id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/projects/summary:
    get:
      tags: [projects]
      summary: Aggregate project, script, storyboard, novel, role, art-style, and asset counts for the current user
      operationId: getProjectsSummaryV1
      description: |
        One round-trip totals for **`owner_user_id = JWT sub`**: rows in **`app_project`**, **`app_script`** (via owned projects), **`app_storyboard`** (via owned script trees), **`app_novel`** (via owned projects), **`app_asset`** with **`asset_type = 'role'`** (same rule as **`GET …/stats`** **`role_count`**), **`app_art_style`** (user-wide presets), and all **`app_asset`** rows (via owned projects).
        Complements per-project **`GET /api/v1/projects/legacy/{legacy_id}/stats`**.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectsSummaryResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/projects:
    get:
      tags: [projects]
      summary: List projects for the current user
      operationId: listProjectsV1
      description: |
        Returns `app_project` rows where `owner_user_id` matches the JWT `sub`.
        Requires `DATABASE_URL` on the server (otherwise 503).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectRow"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      tags: [projects]
      summary: Create project (allocates global legacy_id)
      operationId: createProjectV1
      description: |
        Inserts **`app_project`** for the JWT subject. **`legacy_id`** is **`MAX(legacy_id)+1`** table-wide under a transaction-scoped advisory lock (avoids races with concurrent creates).
        All body fields optional; omit or use empty string for unset text. **`create_time_ms`** is set server-side.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRow"
        "400":
          description: Unknown JSON properties (extra keys rejected)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/projects/legacy/{legacy_id}:
    get:
      tags: [projects]
      summary: Project detail by legacy integer id
      operationId: getProjectByLegacyIdV1
      description: |
        Resolves `app_project` by `legacy_id` and current user; includes child `app_script` rows.
      security:
        - bearerAuth: []
      parameters:
        - name: legacy_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetailResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No project with that legacy id for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    patch:
      tags: [projects]
      summary: Partially update project by legacy id
      operationId: patchProjectByLegacyIdV1
      description: |
        JSON merge patch for text columns on `app_project`. Omit a key to leave that column unchanged;
        `null` or empty string clears the column. At least one listed property must appear in the body.
      security:
        - bearerAuth: []
      parameters:
        - name: legacy_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchProjectBody"
      responses:
        "200":
          description: Updated project row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRow"
        "400":
          description: Invalid body, no fields to apply, unknown properties, or malformed JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No project with that legacy id for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      tags: [projects]
      summary: Delete project by legacy id
      operationId: deleteProjectByLegacyIdV1
      description: |
        Deletes the row in **`app_project`** for the current user. Child **`app_script`** / **`app_storyboard`** rows cascade (FK **`ON DELETE CASCADE`**).
        Also deletes **`app_agent_memory`** for the same **`legacy_project_id`** and user (not FK-linked to the project).
      security:
        - bearerAuth: []
      parameters:
        - name: legacy_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "204":
          description: Deleted
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No project with that legacy id for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured, database error, or `DATABASE_URL` unset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/projects/legacy/{legacy_id}/stats:
    get:
      tags: [projects]
      summary: Project overview counts by legacy id
      operationId: getProjectStatsByLegacyIdV1
      description: |
        Bearer JWT. Resolves **`app_project`** by **`legacy_id`** and owner; returns **`app_script`** / **`app_storyboard`** counts.
        **`role_count`** is the number of **`app_asset`** rows with **`asset_type = 'role'`** for the project.
        **`novel_count`** is the number of **`app_novel`** rows for the project.
        **`video_count`** remains **`0`** until video rows are modeled in Postgres (legacy **`o_video`**).
      security:
        - bearerAuth: []
      parameters:
        - name: legacy_id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:

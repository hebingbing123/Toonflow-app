  /api/v1/production/export-image:
    post:
      tags: [production]
      summary: ZIP storyboard frames for export (Electron `exportImage`)
      operationId: postProductionExportImageV1
      description: |
        Bearer JWT. Validates **`projectId`**, **`scriptId`**, and **`shotId`** array, fetches each storyboard **`file_path`**
        on that owned script, and returns a ZIP attachment containing one file per storyboard in request order.
        Supported sources are **`http(s)`** URLs, base64 **`data:image/...`** URIs, and
        absolute local file paths.
        - **200** with **`application/zip`** when all referenced storyboard ids exist on that owned script
        - **404** when project/script not owned, or any id is missing on that script
        - **400** when a storyboard has no image yet or its **`file_path`** is not exportable
        - **503** when auth/DB is not configured
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductionExportImageBody"
      responses:
        "200":
          description: ZIP attachment
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment filename for the generated ZIP export
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid body or storyboard image source cannot be exported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":

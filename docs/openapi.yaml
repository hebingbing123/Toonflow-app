openapi: 3.1.0
externalDocs:
  description: WebSocket `/api/v1/ws` — JSON envelope; Harness `harness.tool.invoke` / `harness.tool.result` / `harness.agent.run` (tool loop)
  url: ./websocket-events.md
info:
  title: Toonflow API
  version: 1.0.0
  description: |
    HTTP surface for the Rust backend (`backend/`). All versioned routes live under `/api/v1`.
    WebSocket: `GET /api/v1/ws` (Upgrade) — JSON envelope protocol in **`docs/websocket-events.md`** (also linked from `externalDocs` above); optional query `access_token`.

    **Harness tools (MVP):** Tool **catalog** and metadata are exposed over HTTP at **`GET /api/v1/harness/tools`**. **Execution** uses **`harness.tool.invoke`** / **`harness.tool.result`** (e.g. `echo`, `isolated.echo`, `skills.read`, `wasm.probe`). **Agent loop:** **`harness.agent.run`** drives multi-round OpenAI tool calling over the same tool surface (requires LLM env + channel attach) — see **`docs/websocket-events.md`** for envelopes and `error.occurred` codes (`wasm_failed`, `isolation_failed`, etc.).

    **Billing webhook (MVP):** `POST /api/v1/webhooks/billing` — verify **`X-Toonflow-Signature: sha256=<hex>`** as HMAC-SHA256(raw body, `BILLING_WEBHOOK_SECRET`). Body must be JSON with string **`id`** (dedupe key). Returns **`received`** + **`duplicate`** when replayed. **Not** JWT-authenticated; configure secret in production. **Not** in the per-IP rate-limit bucket (same as `/health`).

    **Rate limiting (MVP):** Per client IP on all routes except unversioned `/health`, `/api/v1/health`, `/api/v1/ping`, `/api/v1/version`, `/api/v1/ready`, and **`POST /api/v1/webhooks/billing`**.
    Default key is **TCP peer** IP; set **`RATE_LIMIT_TRUST_FORWARDED_HEADERS=1`** only behind a **trusted** proxy to use `Forwarded` / `X-Forwarded-For` / `X-Real-Ip` (spoofing risk if untrusted).
    Exceeding the limit returns **429** with **`Retry-After`** (seconds) and **`x-ratelimit-*`** headers.
    Tune with `RATE_LIMIT_REFILL_MS` (default `20`) and `RATE_LIMIT_BURST` (default `100`).

    **Request correlation:** Responses include **`X-Request-Id`** (echo client value or server-generated UUID).
    JSON error bodies (`code`, `message`) also include **`request_id`** when applicable. Clients may send **`X-Request-Id`** on requests (optional).

    **Usage (MVP):** Successful generation jobs append **`app_usage_event`** (`generation_job.succeeded`). **`GET /api/v1/usage/summary`** returns per-user counts (24h / 7d) for fair-use dashboards.

    **Prompt templates:** **`GET /api/v1/prompts`** returns three built-in rows (**`id`** 1–3, legacy **`o_prompt`** parity); **`GET /api/v1/prompts/{legacy_id}`** returns one merged row (**`legacy_id`** must be **1**, **2**, or **3**); **`PATCH /api/v1/prompts/{legacy_id}`** upserts per-user **`data`** in **`app_user_prompt`**.

    **Visual manual:** **`GET`** or **`POST /api/v1/visual-manual`** reads bundled **`data/skills/art_skills/*`** (**POST** matches legacy **`POST /api/project/getVisualManual`** verb; body ignored). **`image`** paths are relative under **`data/skills`** (no OSS signing).

    **Text model default:** **`GET /api/v1/models/text-default`** replaces legacy **`POST /api/setting/getTextModel`** stub (**`data`: `"123"`**) with the same placeholder plus a real **`default_model_id`** for **`GET /api/v1/models/detail`**. Optional env **`TOONFLOW_DEFAULT_TEXT_MODEL_ID`** (composite id) when it matches the catalog.

    **Dev settings:** **`GET /api/v1/settings/dev/switch-ai-tool`** reads **`TOONFLOW_SWITCH_AI_DEV_TOOL`** (**`"1"`** on, else **`"0"`**), parity with legacy **`getSwitchAiDevTool`**. **`PUT`** validates **`value`** then returns **501** **`not_implemented`** (no per-user SQLite **`o_setting`** persistence).

    **Memory config (RAG / summary limits):** **`GET`** and **`POST /api/v1/settings/memory-config`** mirror legacy **`getMemory`** / **`sureMemory`** (**camelCase** fields, same defaults as SQLite **`initDB`**). Values are held in server memory per process (not Postgres); restart resets to defaults.
    **`POST /api/v1/settings/memory-config/clear-agent-memories`** maps legacy **`delAllMemory`**: SaaS requires **`projectId`** + **`agentType`** (optional **`episodesId`**); clears **`app_agent_memory`** for the JWT user only — same rows as **`POST /api/v1/agents/memory/clear`** with **`clearType: all`** (not a global SQLite wipe).

    **Vendor summary (keyless):** **`GET /api/v1/settings/vendors/summary`** replaces the *non-secret* part of legacy **`getVendorList`** intent (vendor ids, names, model counts) from the same static catalog as **`GET /api/v1/models`**. It never returns **`inputValues`** / API keys (those stay in server env or billing).
    **`POST /api/v1/settings/vendors/model-test`** validates legacy **`modelTest`** fields then **501** (no live LLM/image/video probe here).

    **Agent deploy (local SQLite → SaaS):** **`POST /api/v1/settings/agent-deploy/list`** returns the four default **`o_agentDeploy`** rows from **`initDB`** (static, no Postgres). **`POST …/deploy-model`** and **`POST …/set-key`** validate bodies then **501** (no per-user deploy table / no API keys over HTTP).

    **Script agent plan (SQLite → SaaS):** **`POST /api/v1/script-agent/get-plan-data`**, **`POST …/set-plan-data`**, **`POST …/update-data`** accept the same JSON shapes as legacy **`/api/scriptAgent/getPlanData`**, **`setPlanData`**, **`updateData`**, then **501** **`not_implemented`** until **`o_agentWorkData`**-equivalent persistence exists (live flows use **Harness WS**).

    **Asset generate (SQLite image pipeline → SaaS):** **`POST /api/v1/assets-generate/generate`**, **`POST …/polish-prompt`**, **`POST …/batch-generate`**, **`POST …/batch-polish`** match legacy **`/api/assetsGenerate/*`** request bodies, then **501** **`not_implemented`** until **`app_generation_job`** + image providers are wired end-to-end.

    **About / updates (desktop legacy):** **`POST /api/v1/settings/about/check-update`** accepts the same **`source`** enum as legacy **`checkUpdate`** but does **not** fetch **`update.json`** from OSS; it returns **`needUpdate: false`** and **`latestVersion`** set to the server crate version (SaaS deploys are not Electron auto-update). **`POST /api/v1/settings/about/download-app`** validates **`url`** then returns **501** **`not_implemented`** (local installer / zip apply is Electron-only).

servers:
  - url: http://127.0.0.1:8666
    description: Local dev (default `PORT`; override with env)

tags:
  - name: system
    description: Health, readiness, and lightweight probes (incl. legacy test-route parity)
  - name: session
    description: Auth probe (Supabase JWT)
  - name: projects
    description: User-owned projects (Postgres + RLS)
  - name: assets
    description: Script-linked assets per project (`app_asset`, `app_script_asset`; Postgres + RLS); corner-scape listing for legacy UI parity
  - name: scripts
    description: Scripts under owned projects (Postgres + RLS)
  - name: storyboards
    description: Storyboards under owned scripts (Postgres + RLS)
  - name: novels
    description: Novel source chapters per project (`app_novel`; Postgres + RLS)
  - name: art_styles
    description: Per-user art style presets (`app_art_style`; Postgres + RLS); legacy `o_artStyle` subset without OSS image upload
  - name: skills
    description: Markdown skills under `backend/data/skills` (read; PUT overwrite; POST create; DELETE remove one file); visual manual (`GET`/`POST /api/v1/visual-manual`) from bundled `art_skills`
  - name: harness
    description: Harness tool catalog over HTTP; tool execution over WebSocket (`harness.tool.invoke` — see `externalDocs`)
  - name: jobs
    description: Long-running generation jobs (`app_generation_job`; Postgres + RLS)
  - name: usage
    description: Per-user usage counts (`app_usage_event`; Postgres + RLS)
  - name: prompts
    description: Per-user prompt templates (`app_user_prompt`; Postgres + RLS); legacy `/api/setting/promptManage/getPrompt` / `updatePrompt`
  - name: models
    description: Static vendor/model catalog (`backend/data/models_catalog.json`); legacy `modelSelect` parity without `o_vendorConfig`
  - name: agents
    description: Per-user agent memory (`app_agent_memory`; Postgres + RLS); legacy `/api/agents/getMemory` / `clearMemory` parity
  - name: webhooks
    description: Server-to-server billing webhooks (HMAC); not browser CORS flows
  - name: settings
    description: Server-backed settings without SQLite `o_setting` (env-driven, in-memory snapshots, or future Postgres)

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness (unversioned)
      operationId: healthRoot
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/health:
    get:
      tags: [system]
      summary: Liveness (versioned)
      operationId: healthV1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/ping:
    get:
      tags: [system]
      summary: Minimal connectivity probe (legacy `/api/test/test` parity)
      operationId: pingV1
      description: |
        Public, no auth, no database. Replaces legacy **`GET /api/test/test`** which returned plain text **`ok`**; this route returns JSON **`{"ok":true}`** for versioned API clients.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"

  /api/v1/version:
    get:
      tags: [system]
      summary: Server semantic version (from Cargo package)
      operationId: versionV1
      description: |
        Public, no auth. Aligns with legacy **`/api/other/getVersion`** use cases for client compatibility checks.
        When the server binary is compiled with environment **`TOONFLOW_GIT_SHA`** set, the JSON may include **`git_sha`** (opaque string, often a Git commit id).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /api/v1/ready:
    get:
      tags: [system]
      summary: Readiness (optional database ping)
      operationId: readyV1
      description: |
        If `DATABASE_URL` is set, runs `SELECT 1`. Otherwise returns `database: not_configured` (HTTP 200).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/webhooks/billing:
    post:
      tags: [webhooks]
      summary: Ingest signed billing webhook (idempotent by JSON `id`)
      operationId: postBillingWebhookV1
      description: |
        Verifies **HMAC-SHA256** of the **raw request body** using `BILLING_WEBHOOK_SECRET`.
        Header **`X-Toonflow-Signature`** must be `sha256=` followed by lowercase hex (64 chars).
        Persists to `app_billing_webhook_event` when `id` is new; replays return `duplicate: true` (HTTP 200).
        On **first** receipt only, if **`user_id`** (UUID string) and **`plan_tier`** (non-empty string) are present, upserts **`app_user_profile`** (`billing_currency` / `billing_provider` optional).
        Returns **503** if `BILLING_WEBHOOK_SECRET` is unset or `DATABASE_URL` is not configured.
      security: []
      parameters:
        - name: X-Toonflow-Signature
          in: header
          required: true
          schema:
            type: string
          description: Format `sha256=<hex>` (HMAC-SHA256 of raw body).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              additionalProperties: true
              properties:
                id:
                  type: string
                  description: Provider event id; used as deduplication key.
                user_id:
                  type: string
                  format: uuid
                  description: Optional; when set with `plan_tier`, updates `app_user_profile` on first receipt only.
                plan_tier:
                  type: string
                  description: Optional; e.g. `free`, `pro` (see plan §12).
                billing_currency:
                  type: string
                  description: Optional; e.g. `CNY`.
                billing_provider:
                  type: string
                  description: Optional provider name for audit.
      responses:
        "200":
          description: Accepted (or duplicate replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingWebhookResponse"
        "400":
          description: Invalid JSON or missing non-empty `id`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing/bad signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Secret or database not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/me:
    get:
      tags: [session]
      summary: Current user from JWT plus SaaS profile when database is configured
      operationId: meV1
      description: |
        Always returns JWT `sub` (and `email` when present in claims). When **`DATABASE_URL`** is set, loads **`plan_tier`** / billing fields from **`app_user_profile`** (defaults to **`plan_tier: free`** when no row).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: "`SUPABASE_JWT_SECRET` not configured, or database error when loading profile"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/settings/dev/switch-ai-tool:
    get:
      tags: [settings]
      summary: AI dev-tool switch (effective server value)
      operationId: getSwitchAiDevToolV1
      description: |
        Bearer JWT. Effective value from env **`TOONFLOW_SWITCH_AI_DEV_TOOL`**: trimmed **`"1"`** → **`"1"`**, anything else (unset included) → **`"0"`**.
        Legacy **`GET /api/setting/dev/getSwitchAiDevTool`** returned the same digit string inside the old success envelope.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwitchAiDevToolResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    put:
      tags: [settings]
      summary: Update AI dev-tool switch (not persisted)
      operationId: putSwitchAiDevToolV1
      description: |
        Validates **`value`** is **`"0"`** or **`"1"`**, then responds **501** **`not_implemented`**: Rust does not write SQLite **`o_setting`**. Operators change **`TOONFLOW_SWITCH_AI_DEV_TOOL`** and restart (or future user settings store).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchAiDevToolPutRequest"
      responses:
        "400":
          description: Request body value must be the strings "0" or "1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "501":
          description: Persisting this toggle is not implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/settings/memory-config:
    get:
      tags: [settings]
      summary: Memory / RAG configuration (legacy getMemory)
      operationId: getMemoryConfigV1
      description: |
        Bearer JWT. Returns the current memory configuration (**camelCase** keys), same fields as legacy **`GET /api/setting/memoryConfig/getMemory`** **`data`**.
        Defaults match legacy SQLite **`initDB`** **`o_setting`** seeds. Stored in process memory until a user settings table exists.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryConfig"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      tags: [settings]
      summary: Save memory / RAG configuration (legacy sureMemory)
      operationId: postMemoryConfigV1
      description: |
        Bearer JWT. Replaces the in-memory configuration (**full body**, **`deny_unknown_fields`** on the server). Response **`message`** matches legacy **`sureMemory`** success string.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryConfig"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryConfigSavedResponse"
        "400":
          description: JSON parse error or unknown fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/settings/memory-config/clear-agent-memories:
    post:
      tags: [settings]
      summary: Clear all agent memory for a project (legacy delAllMemory scope)
      operationId: postSettingsClearAgentMemoriesV1
      description: |
        Bearer JWT. Deletes all **`app_agent_memory`** rows for **`owner_user_id = JWT sub`**, **`legacy_project_id`**, **`agent_type`**, and optional **`episodes_id`** — identical to **`POST /api/v1/agents/memory/clear`** with **`clearType: all`**.
        Legacy **`POST /api/setting/memoryConfig/delAllMemory`** wiped the entire SQLite **`memories`** table with no body; the Rust API requires **`projectId`** and **`agentType`** for multi-tenant safety.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsClearAgentMemoriesBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearAgentMemoryResponse"
        "400":
          description: Invalid **`agentType`** or bad JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: Project not found or not owned by the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/settings/about/check-update:
    post:
      tags: [settings]
      summary: Desktop update check (SaaS stub)
      operationId: postAboutCheckUpdateV1
      description: |
        Bearer JWT. Body **`source`** matches legacy **`POST /api/setting/about/checkUpdate`** (**`toonflow`**, **`github`**, **`gitee`**, **`atomgit`**).
        Does not call the legacy OSS manifest: responds **`needUpdate: false`**, **`latestVersion`** = server **`CARGO_PKG_VERSION`**, **`reinstall: false`**, **`time`** = current UTC RFC3339, no **`url`**.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AboutCheckUpdateRequest"
      responses:
        "200":
          description: OK (stub — no remote version comparison)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutCheckUpdateResponse"
        "400":
          description: Invalid JSON or unknown fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/settings/about/download-app:
    post:
      tags: [settings]
      summary: Download and run installer (not supported)
      operationId: postAboutDownloadAppV1
      description: |
        Bearer JWT. Validates **`url`** (**http** or **https**) and **`reinstall`**, then **501** **`not_implemented`**: the Rust API does not download binaries or mutate local **`serve`/`web`/`skills`/`models`** trees (legacy Electron **`downloadApp`**).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AboutDownloadAppRequest"
      responses:
        "400":
          description: Missing/invalid **`url`** or bad JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "501":
          description: Local download/install is not implemented on this API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/settings/vendors/summary:
    get:
      tags: [settings]
      summary: Static vendor + model-kind summary (no secrets)
      operationId: getSettingsVendorsSummaryV1
      description: |
        Bearer JWT. Returns **`vendors`** derived from the embedded **`models_catalog.json`** (same source as **`GET /api/v1/models`**): **`id`**, **`name`**, **`modelCount`**, sorted unique **`modelKinds`**.
        **`source`** is always **`static_catalog`**. Does **not** expose legacy **`o_vendorConfig.inputValues`** or other API keys (SaaS: env / billing).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorsSummaryResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/settings/vendors/model-test:
    post:
      tags: [settings]
      summary: Live vendor model smoke test (not implemented)
      operationId: postSettingsVendorModelTestV1
      description: |
        Bearer JWT. Validates **`modelName`**, **`type`** (**`text`** | **`image`** | **`video`**), **`id`** (legacy vendor id string), then **501** **`not_implemented`**: the Rust API does not run the legacy **`modelTest`** LLM/OSS probe.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorModelTestBody"
      responses:
        "400":
          description: Invalid **`type`** or empty **`modelName`** / **`id`**
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "501":
          description: Live probe not implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Auth not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/settings/agent-deploy/list:
    post:
      tags: [settings]
      summary: List default agent deploy rows (static)

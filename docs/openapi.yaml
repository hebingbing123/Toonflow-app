openapi: 3.1.0
externalDocs:
  description: WebSocket `/api/v1/ws` — JSON envelope; Harness `harness.tool.invoke` / `harness.tool.result` / `harness.agent.run` (tool loop)
  url: ./websocket-events.md
info:
  title: Toonflow API
  version: 1.0.0
  description: |
    HTTP surface for the Rust backend (`backend/`). All versioned routes live under `/api/v1`.
    WebSocket: `GET /api/v1/ws` (Upgrade) — JSON envelope protocol in **`docs/websocket-events.md`** (also linked from `externalDocs` above); optional query `access_token`.

    **Harness tools (MVP):** Tool **catalog** and metadata are exposed over HTTP at **`GET /api/v1/harness/tools`**. **Execution** uses **`harness.tool.invoke`** / **`harness.tool.result`** (e.g. `echo`, `isolated.echo`, `skills.read`, `wasm.probe`). **Agent loop:** **`harness.agent.run`** drives multi-round OpenAI tool calling over the same tool surface (requires LLM env + channel attach) — see **`docs/websocket-events.md`** for envelopes and `error.occurred` codes (`wasm_failed`, `isolation_failed`, etc.).

    **Billing webhook (MVP):** `POST /api/v1/webhooks/billing` — verify **`X-Toonflow-Signature: sha256=<hex>`** as HMAC-SHA256(raw body, `BILLING_WEBHOOK_SECRET`). Body must be JSON with string **`id`** (dedupe key). Returns **`received`** + **`duplicate`** when replayed. **Not** JWT-authenticated; configure secret in production. **Not** in the per-IP rate-limit bucket (same as `/health`).

    **Rate limiting (MVP):** Per client IP on all routes except unversioned `/health`, `/api/v1/health`, `/api/v1/ping`, `/api/v1/version`, `/api/v1/ready`, and **`POST /api/v1/webhooks/billing`**.
    Default key is **TCP peer** IP; set **`RATE_LIMIT_TRUST_FORWARDED_HEADERS=1`** only behind a **trusted** proxy to use `Forwarded` / `X-Forwarded-For` / `X-Real-Ip` (spoofing risk if untrusted).
    Exceeding the limit returns **429** with **`Retry-After`** (seconds) and **`x-ratelimit-*`** headers.
    Tune with `RATE_LIMIT_REFILL_MS` (default `20`) and `RATE_LIMIT_BURST` (default `100`).

    **Request correlation:** Responses include **`X-Request-Id`** (echo client value or server-generated UUID).
    JSON error bodies (`code`, `message`) also include **`request_id`** when applicable. Clients may send **`X-Request-Id`** on requests (optional).

    **Usage (MVP):** Successful generation jobs append **`app_usage_event`** (`generation_job.succeeded`). **`GET /api/v1/usage/summary`** returns per-user counts (24h / 7d) for fair-use dashboards.

    **Prompt templates:** **`GET /api/v1/prompts`** returns three built-in rows (**`id`** 1–3, legacy **`o_prompt`** parity); **`GET /api/v1/prompts/{legacy_id}`** returns one merged row (**`legacy_id`** must be **1**, **2**, or **3**); **`PATCH /api/v1/prompts/{legacy_id}`** upserts per-user **`data`** in **`app_user_prompt`**.

    **Visual manual:** **`GET`** or **`POST /api/v1/visual-manual`** reads bundled **`data/skills/art_skills/*`** (**POST** matches legacy **`POST /api/project/getVisualManual`**; body ignored). **`POST /api/v1/project/add-visual-manual`** / **`…/edit-visual-manual`** / **`…/delete-visual-manual`** mirror **`addVisualManual`** / **`editVisualManual`** / **`deleteVisualManual`** (same 12 Markdown slots as **`GET`**). **`image`** paths stay relative under **`data/skills`** (no OSS signing).

    **Text model default:** **`GET /api/v1/models/text-default`** replaces legacy **`POST /api/setting/getTextModel`** stub (**`data`: `"123"`**) with the same placeholder plus a real **`default_model_id`**. Priority: per-user preference (set via **`PATCH /api/v1/models/text-default`** → `app_user_profile.preferred_text_model_id`) → **`TOONFLOW_DEFAULT_TEXT_MODEL_ID`** env → first catalog text model.

    **Dev settings:** **`GET /api/v1/settings/dev/switch-ai-tool`** reads **`TOONFLOW_SWITCH_AI_DEV_TOOL`** (**`"1"`** on, else **`"0"`**), parity with legacy **`getSwitchAiDevTool`**. **`PUT`** validates **`value`** then returns **501** **`not_implemented`** (no per-user SQLite **`o_setting`** persistence).

    **Memory config (RAG / summary limits):** **`GET`** and **`POST /api/v1/settings/memory-config`** mirror legacy **`getMemory`** / **`sureMemory`** (**camelCase** fields, same defaults as SQLite **`initDB`**). Values are held in server memory per process (not Postgres); restart resets to defaults.
    **`POST /api/v1/settings/memory-config/clear-agent-memories`** maps legacy **`delAllMemory`**: SaaS requires **`projectId`** + **`agentType`** (optional **`episodesId`**); clears **`app_agent_memory`** for the JWT user only — same rows as **`POST /api/v1/agents/memory/clear`** with **`clearType: all`** (not a global SQLite wipe).

    **Vendor summary (keyless):** **`GET /api/v1/settings/vendors/summary`** replaces the *non-secret* part of legacy **`getVendorList`** intent (vendor ids, names, model counts) from the same static catalog as **`GET /api/v1/models`**. It never returns **`inputValues`** / API keys (those stay in server env or billing).
    **`POST /api/v1/settings/vendors/model-test`** validates legacy **`modelTest`** fields and enqueues **`app_generation_job`** kind **`settings.vendor.model_test`** (**`queued`** **`JobRow`**); worker fails until a live probe is implemented.
    **Vendor writes (SQLite → SaaS):** **`POST …/vendors/add`**, **`…/update`**, **`…/delete`**, **`…/enable`**, **`…/update-code`**, **`…/code-from-link`** accept the same *top-level* shapes as legacy **`addVendor`** / **`updateVendor`** / **`deleteVendor`** / **`enableVendor`** / **`updateCode`** / **`getCodeByLink`**, then **501** (no **`o_vendorConfig`** table, no TS/vm2, no server-side URL fetch).

    **Danger / wipe (Electron-only):** Legacy **`POST /api/other/deleteAllData`** and **`GET /api/setting/dbConfig/clearData`** rebuilt local SQLite. SaaS exposes **`POST /api/v1/settings/danger/delete-all-data`** and **`POST …/danger/clear-database`** with body **`{}`** only, then **501** **`not_implemented`** — no bulk wipe endpoint (use Supabase / ops).

    **Agent deploy (local SQLite → SaaS):** **`POST /api/v1/settings/agent-deploy/list`** returns the four default **`o_agentDeploy`** rows from **`initDB`** (static, no Postgres). **`POST …/deploy-model`** and **`POST …/set-key`** validate bodies then **501** (no per-user deploy table / no API keys over HTTP).

    **Script agent plan (SQLite → SaaS):** **`POST /api/v1/script-agent/get-plan-data`**, **`POST …/set-plan-data`**, **`POST …/update-data`** accept the same JSON shapes as legacy **`/api/scriptAgent/getPlanData`**, **`setPlanData`**, **`updateData`**, backed by Postgres **`app_script_agent_plan`** + **`app_script`** (JWT **`owner_user_id`**, project by **`app_project.legacy_id`**). Responses use the legacy **`{ code, data, message }`** envelope (**`code`** is numeric **200** on success). Live agent streaming remains **Harness WS**.

    **Asset generate (SQLite image pipeline → SaaS):** **`POST …/assets-generate/generate`**, **`polish-prompt`**, **`batch-generate`**, **`batch-polish`** validate legacy bodies, resolve **`app_project`**, check quota, enqueue one **`app_generation_job`** each (**`asset.generate.image`**, **`asset.polish.prompt`**, **`asset.generate.batch`**, **`asset.polish.batch`**). **`asset.polish.*`** and **`asset.generate.*`** **`succeeded`** when **`OPENAI_API_KEY`/`LLM_API_KEY`** is set: polish uses chat completions; image jobs call **`POST {OPENAI_BASE_URL}/v1/images/generations`** (model from request or **`TOONFLOW_IMAGE_MODEL`**, default **`dall-e-3`**), insert **`app_asset_image`** (**`file_path`** = temporary **`url`**; **`base64`** hint in enqueue is not yet fed to the provider). **`concurrentCount`** on batch routes is stored in **`payload`** only (worker runs sequentially). Otherwise those jobs **`failed`**.

    **Production / workbench (Electron-only pipeline):** Legacy **`/api/production/*`** **`POST`** routes are exposed under **`/api/v1/production/*`**. Six routes use **strict** request schemas; the rest accept any JSON **object** (**`ProductionLegacyJsonStubBody`**) and return **501** **`not_implemented`** (no **`o_video`** / OSS parity yet). Non-object JSON bodies return **400**.

    **Legacy task center (`/api/task/*`):** **`POST /api/v1/tasks/get-project`** and **`POST …/get-task-categories`** accept body **`{}`** and return **`{ "data": [...] }`** (projects with non-empty names; distinct job **`kind`** as **`taskClass`**). **`POST …/get-task-api`** paginates **`app_generation_job`** with legacy **`page`/`limit`** and optional **`taskClass`/`state`/`projectId`** (`projectId` filters rows whose **`payload.project_legacy_id`** string equals the number). **`POST …/task-details`**: **`taskId`** as **UUID string** returns the same **`JobRow`** as **`GET /api/v1/jobs/{id}`**; **`taskId`** as **integer** → **501** (legacy SQLite **`o_tasks.id`** has no mapping).

    **Legacy project CRUD posts (`/api/project/*`):** **`POST …/project/get-project`** (**`{}`**) → **`{ "data": [ProjectRow] }`**; **`POST …/delete-project`** / **`add-project`** / **`edit-project`** (PG **`app_project`**). **Director manual (`story_skills`):** **`POST …/query-director-manual`** (**`{}`**); **`POST …/add-director-manual`** / **`…/edit-director-manual`** / **`…/delete-director-manual`**. **Visual manual (`art_skills`):** **`POST …/add-visual-manual`** / **`…/edit-visual-manual`** / **`…/delete-visual-manual`** (**`stylePath`** = folder under **`art_skills`**).

    **Legacy general + script list:** **`POST /api/v1/general/get-single-project`** (**`{ "id": legacy_project_id }`**) returns **`{ "data": [ProjectRow] }`** (0 or 1 row). **`POST …/general/update-project`** updates **`intro`**, SQLite-shaped **`type`** (maps to **`mode`**), **`artStyle`**, **`videoRatio`**, **`projectType`** on **`app_project`** by legacy id (at least one field besides **`id`**). **`POST /api/v1/scripts/get-script-api`** lists scripts for **`projectId`** with optional substring **`name`** filter and **`relatedAssets`** (**`app_script_asset`** → **`app_asset`** legacy ids).

    **Legacy novels (read/CRUD):** **`POST …/novels/get-novel-data`** / **`…/get-novel-index`** take **`{ "projectId" }`** (**`app_project.legacy_id`**). **`POST …/get-novel`** paginates with **`page`/`limit`** (cap **200**) and optional **`search`** (**`chapter` ILIKE**); response **`{ data, total }`** (**`id`** = **`legacy_id`**). **`POST …/add-novel`** batch-inserts (**`data`** ≤ **200**); empty **`data`** → **200** without DB. **`POST …/delete-novel`** / **`…/update-novel`** use **`id`** = **`app_novel.legacy_id`**. **`POST …/batch-delete`** deletes by **`ids`**. No SQLite **`o_event*`** / **`cleanNovel`** parity.

    **About / updates (desktop legacy):** **`POST /api/v1/settings/about/check-update`** accepts the same **`source`** enum as legacy **`checkUpdate`** but does **not** fetch **`update.json`** from OSS; it returns **`needUpdate: false`** and **`latestVersion`** set to the server crate version (SaaS deploys are not Electron auto-update). **`POST /api/v1/settings/about/download-app`** validates **`url`** then returns **501** **`not_implemented`** (local installer / zip apply is Electron-only).

servers:
  - url: http://127.0.0.1:8666
    description: Local dev (default `PORT`; override with env)

tags:
  - name: system
    description: Health, readiness, and lightweight probes (incl. legacy test-route parity)
  - name: session
    description: Auth probe (Supabase JWT)
  - name: projects
    description: User-owned projects (Postgres + RLS)
  - name: general
    description: Legacy general dashboard POST routes (old `/api/general/*`)
  - name: assets
    description: Script-linked assets per project (`app_asset`, `app_script_asset`; Postgres + RLS); corner-scape listing for legacy UI parity
  - name: scripts
    description: Scripts under owned projects (Postgres + RLS)
  - name: storyboards
    description: Storyboards under owned scripts (Postgres + RLS)
  - name: production
    description: Legacy Electron production workbench (video timeline, flow save); most routes are stubs until jobs + object storage
  - name: novels
    description: Novel source chapters per project (`app_novel`; Postgres + RLS)
  - name: art_styles
    description: Per-user art style presets (`app_art_style`; Postgres + RLS); legacy `o_artStyle` subset without OSS image upload
  - name: skills
    description: Markdown skills under `backend/data/skills` (read; PUT overwrite; POST create; DELETE remove one file); visual manual (`GET`/`POST /api/v1/visual-manual`) from bundled `art_skills`
  - name: harness
    description: Harness tool catalog over HTTP; tool execution over WebSocket (`harness.tool.invoke` — see `externalDocs`)
  - name: jobs
    description: Long-running generation jobs (`app_generation_job`; Postgres + RLS)
  - name: tasks
    description: Legacy Electron task center (`POST` for old `/api/task/*`); maps to projects and generation jobs where applicable
  - name: usage
    description: Per-user usage counts (`app_usage_event`; Postgres + RLS)
  - name: prompts
    description: Per-user prompt templates (`app_user_prompt`; Postgres + RLS); legacy `/api/setting/promptManage/getPrompt` / `updatePrompt`
  - name: models
    description: Static vendor/model catalog (`backend/data/models_catalog.json`); legacy `modelSelect` parity without `o_vendorConfig`
  - name: agents
    description: Per-user agent memory (`app_agent_memory`; Postgres + RLS); legacy `/api/agents/getMemory` / `clearMemory` parity
  - name: webhooks
    description: Server-to-server billing webhooks (HMAC); not browser CORS flows
  - name: settings
    description: Server-backed settings without SQLite `o_setting` (env-driven, in-memory snapshots, or future Postgres)

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness (unversioned)
      operationId: healthRoot
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/health:
    get:
      tags: [system]
      summary: Liveness (versioned)
      operationId: healthV1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/ping:
    get:
      tags: [system]
      summary: Minimal connectivity probe (legacy `/api/test/test` parity)
      operationId: pingV1
      description: |
        Public, no auth, no database. Replaces legacy **`GET /api/test/test`** which returned plain text **`ok`**; this route returns JSON **`{"ok":true}`** for versioned API clients.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"

  /api/v1/version:
    get:
      tags: [system]
      summary: Server semantic version (from Cargo package)
      operationId: versionV1
      description: |
        Public, no auth. Aligns with legacy **`/api/other/getVersion`** use cases for client compatibility checks.
        When the server binary is compiled with environment **`TOONFLOW_GIT_SHA`** set, the JSON may include **`git_sha`** (opaque string, often a Git commit id).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /api/v1/ready:
    get:
      tags: [system]
      summary: Readiness (optional database ping)
      operationId: readyV1
      description: |
        If `DATABASE_URL` is set, runs `SELECT 1`. Otherwise returns `database: not_configured` (HTTP 200).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/webhooks/billing:
    post:
      tags: [webhooks]
      summary: Ingest signed billing webhook (idempotent by JSON `id`)
      operationId: postBillingWebhookV1
      description: |
        Verifies signature of the **raw request body** using `BILLING_WEBHOOK_SECRET`.
        Supports either:
        - **Toonflow native**: `X-Toonflow-Signature: sha256=<hex>` (HMAC-SHA256 of raw body)
        - **Stripe native**: `Stripe-Signature: t=<unix>,v1=<hex>[,v1=<hex>...]` (HMAC-SHA256 of `<unix>.<raw_body>`)
        When both are present, `Stripe-Signature` takes precedence.
        Persists to `app_billing_webhook_event` when `id` is new; replays return `duplicate: true` (HTTP 200).
        Deduplication key is **`<billing_provider>:<id>`** when `billing_provider` is present (lowercased), otherwise `id` as-is.
        Server also stores best-effort metadata for audit:
        `provider`, `raw_event_id`, `event_type`, `event_created_at`, `is_informational_event`.
        On **first** receipt only, if **`user_id`** (UUID string) and **`plan_tier`** (non-empty string) are present, upserts **`app_user_profile`**.
        Optional profile fields in payload: `billing_currency`, `billing_provider`, `subscription_status`,
        `subscription_current_period_end`, `subscription_status_updated_at`.
        When `billing_provider` is omitted, parser routing applies a currency adapter
        (for status derivation only; dedupe namespace still requires explicit `billing_provider`).
        Default mapping is `CNY -> alipay`, `USD -> stripe`, and can be overridden by
        env `BILLING_CURRENCY_PROVIDER_MAP` (format `CNY=alipay,USD=stripe`).
        For Stripe payloads, server also supports provider mapping from event envelope/object:
        `type`, `created`, `data.object.status`, `data.object.current_period_end`.
        Current Stripe event fallback coverage includes common subscription/invoice events such as:
        `customer.subscription.created|updated|paused|resumed|unpaused|deleted`,
        `invoice.payment_succeeded|paid|payment_failed|payment_reversal|overdue|payment_action_required|marked_uncollectible|voided`.
        Non-state Stripe events in the informational whitelist (currently
        `customer.subscription.trial_will_end`, `customer.subscription.pending_update_applied`,
        `customer.subscription.pending_update_expired`, `invoice.finalization_failed`, `invoice.upcoming`,
        `invoice.created`, `invoice.finalized`, `invoice.updated`, `invoice.sent`)
        are treated as informational only (no status transition).
        For Alipay payloads, server supports baseline mapping from:
        `trade_status` / `type` / `notify_time`.
        Non-state Alipay events in the informational whitelist (currently `trade.finished`)
        are treated as informational only.
        For Paddle payloads, server supports baseline mapping from:
        `type` / `occurred_at` / `data.status` / `data.next_billed_at`.
        Current Paddle event fallback coverage includes common subscription/transaction events such as:
        `subscription.created|activated|updated|paused|resumed|past_due|canceled|expired`,
        `transaction.completed|payment_failed|canceled`.
        Non-state Paddle events in the informational whitelist (currently
        `subscription.trialing`, `transaction.billed`, `transaction.created`, `transaction.updated`) are treated as informational only.
        For subscription fields, incoming updates are guarded by `subscription_status_updated_at` to avoid
        out-of-order webhook events overriding newer state.
        Returns **503** if `BILLING_WEBHOOK_SECRET` is unset or `DATABASE_URL` is not configured.
      security: []
      parameters:
        - name: X-Toonflow-Signature
          in: header
          required: false
          schema:
            type: string
          description: Format `sha256=<hex>` (HMAC-SHA256 of raw body).
        - name: Stripe-Signature
          in: header
          required: false
          schema:
            type: string
          description: |
            Stripe signature format `t=<unix>,v1=<hex>[,v1=<hex>...]`.
            Validated with `BILLING_STRIPE_TOLERANCE_SECS` (default 300 seconds).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              additionalProperties: true
              properties:
                id:
                  type: string
                  description: Provider event id. Used in dedupe key (namespaced by `billing_provider` when present).
                user_id:
                  type: string
                  format: uuid
                  description: Optional; when set with `plan_tier`, updates `app_user_profile` on first receipt only.
                plan_tier:
                  type: string
                  description: Optional; e.g. `free`, `pro` (see plan §12).
                billing_currency:
                  type: string
                  description: Optional; e.g. `CNY`.
                billing_provider:
                  type: string
                  description: Optional provider name for audit (e.g. `stripe`, `alipay`, `paddle`).
                subscription_status:
                  type: string
                  description: Optional normalized subscription state (`free|trialing|active|past_due|unpaid|canceled|incomplete|incomplete_expired`).
                subscription_current_period_end:
                  description: Optional subscription period end timestamp (Unix seconds or RFC3339 string).
                  oneOf:
                    - type: integer
                      format: int64
                    - type: string
                subscription_status_updated_at:
                  description: Optional provider event timestamp used for out-of-order protection (Unix seconds or RFC3339 string).
                  oneOf:
                    - type: integer
                      format: int64
                    - type: string
      responses:
        "200":
          description: Accepted (or duplicate replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingWebhookResponse"
        "400":
          description: Invalid JSON or missing non-empty `id`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing/bad signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Secret or database not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/webhooks/billing/events:
    get:
      tags: [webhooks]
      summary: List ingested billing webhook events (audit)
      operationId: listBillingWebhookEventsV1
      description: |
        Bearer JWT required. Returns recent rows from `app_billing_webhook_event` for audit/debug.
        Supports optional filters by `informational_event`, `provider`, created-at window
        (`created_from` / `created_to`, RFC3339), `raw_event_id` / `raw_event_id_prefix`,
        `event_type`, `provider_event_id_prefix`, `event_created_from` / `event_created_to`,
        row id range (`id_min` / `id_max`, inclusive; `id_min` must be `<= id_max` when both set),
        plus basic pagination (`limit` + `offset`).
      security:
        - bearerAuth: []
      parameters:
        - name: informational_event
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by informational whitelist classification.
        - name: provider
          in: query
          required: false
          schema:
            type: string
          description: Provider filter (normalized lowercase; e.g. `stripe`, `alipay`, `paddle`).
        - name: raw_event_id
          in: query
          required: false
          schema:
            type: string
          description: Exact raw event id filter (non-empty string), e.g. `evt_123`.
        - name: raw_event_id_prefix
          in: query
          required: false
          schema:
            type: string
          description: Prefix match on raw event id (non-empty string), e.g. `evt_`.
        - name: event_type
          in: query
          required: false
          schema:
            type: string
          description: Exact event type filter (non-empty string), e.g. `invoice.payment_failed`.
        - name: provider_event_id_prefix
          in: query
          required: false
          schema:
            type: string
          description: Prefix match on dedupe key `provider_event_id` (non-empty), e.g. `stripe:evt_`.
        - name: provider_event_id
          in: query
          required: false
          schema:
            type: string
          description: Exact match on dedupe key `provider_event_id` (non-empty), e.g. `stripe:evt_123`.
        - name: event_created_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include rows with `event_created_at >= event_created_from` (RFC3339).
        - name: event_created_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include rows with `event_created_at <= event_created_to` (RFC3339).
        - name: created_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include rows with `created_at >= created_from` (RFC3339).
        - name: created_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Include rows with `created_at <= created_to` (RFC3339).
        - name: id_min
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Include rows with `id >= id_min` (inclusive).
        - name: id_max
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Include rows with `id <= id_max` (inclusive). When both `id_min` and `id_max` are set, `id_min` must be `<= id_max`.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [id_desc, id_asc]
            default: id_desc
          description: Sort order by row id.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingWebhookEventsResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Database not configured/reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"


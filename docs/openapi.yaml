openapi: 3.1.0
externalDocs:
  description: WebSocket `/api/v1/ws` — JSON envelope; Harness `harness.tool.invoke` / `harness.tool.result` / `harness.agent.run` (tool loop)
  url: ./websocket-events.md
info:
  title: Toonflow API
  version: 1.0.0
  description: |
    HTTP surface for the Rust backend (`backend/`). All versioned routes live under `/api/v1`.
    WebSocket: `GET /api/v1/ws` (Upgrade) — JSON envelope protocol in **`docs/websocket-events.md`** (also linked from `externalDocs` above); optional query `access_token`.

    **Harness tools (MVP):** Tool **catalog** and metadata are exposed over HTTP at **`GET /api/v1/harness/tools`**. **Execution** uses **`harness.tool.invoke`** / **`harness.tool.result`** (e.g. `echo`, `isolated.echo`, `skills.read`, `wasm.probe`). **Agent loop:** **`harness.agent.run`** drives multi-round OpenAI tool calling over the same tool surface (requires LLM env + channel attach) — see **`docs/websocket-events.md`** for envelopes and `error.occurred` codes (`wasm_failed`, `isolation_failed`, etc.).

    **Billing webhook (MVP):** `POST /api/v1/webhooks/billing` — verify **`X-Toonflow-Signature: sha256=<hex>`** as HMAC-SHA256(raw body, `BILLING_WEBHOOK_SECRET`). Body must be JSON with string **`id`** (dedupe key). Returns **`received`** + **`duplicate`** when replayed. **Not** JWT-authenticated; configure secret in production. **Not** in the per-IP rate-limit bucket (same as `/health`).

    **Rate limiting (MVP):** Per client IP on all routes except unversioned `/health`, `/api/v1/health`, `/api/v1/ping`, `/api/v1/version`, `/api/v1/ready`, and **`POST /api/v1/webhooks/billing`**.
    Default key is **TCP peer** IP; set **`RATE_LIMIT_TRUST_FORWARDED_HEADERS=1`** only behind a **trusted** proxy to use `Forwarded` / `X-Forwarded-For` / `X-Real-Ip` (spoofing risk if untrusted).
    Exceeding the limit returns **429** with **`Retry-After`** (seconds) and **`x-ratelimit-*`** headers.
    Tune with `RATE_LIMIT_REFILL_MS` (default `20`) and `RATE_LIMIT_BURST` (default `100`).

    **Request correlation:** Responses include **`X-Request-Id`** (echo client value or server-generated UUID).
    JSON error bodies (`code`, `message`) also include **`request_id`** when applicable. Clients may send **`X-Request-Id`** on requests (optional).

    **Usage (MVP):** Successful generation jobs append **`app_usage_event`** (`generation_job.succeeded`). **`GET /api/v1/usage/summary`** returns per-user counts (24h / 7d) for fair-use dashboards.

    **Prompt templates:** **`GET /api/v1/prompts`** returns three built-in rows (**`id`** 1–3, historical **`o_prompt`** parity); **`GET /api/v1/prompts/{numeric_id}`** returns one merged row (**`numeric_id`** must be **1**, **2**, or **3**); **`PATCH /api/v1/prompts/{numeric_id}`** upserts per-user **`data`** in **`app_user_prompt`**.

    **Visual manual:** **`GET`** or **`POST /api/v1/visual-manual`** reads bundled **`data/skills/art_skills/*`** (**POST** matches Electron-era **`POST /api/project/getVisualManual`**; body ignored). **`POST /api/v1/project/add-visual-manual`** / **`…/edit-visual-manual`** / **`…/delete-visual-manual`** mirror **`addVisualManual`** / **`editVisualManual`** / **`deleteVisualManual`** (same 12 Markdown slots as **`GET`**). **`image`** paths stay relative under **`data/skills`** (no OSS signing).

    **Text model default:** **`GET /api/v1/models/text-default`** replaces Electron-era **`POST /api/setting/getTextModel`** stub (**`data`: `"123"`**) with the same placeholder plus a real **`default_model_id`**. Priority: per-user preference (set via **`PATCH /api/v1/models/text-default`** → `app_user_profile.preferred_text_model_id`) → **`TOONFLOW_DEFAULT_TEXT_MODEL_ID`** env → first catalog text model.

    **Dev settings:** **`GET /api/v1/settings/dev/switch-ai-tool`** returns the process-local effective value for Electron-era **`getSwitchAiDevTool`**. **`PUT`** validates **`value`** (**`"0"`** / **`"1"`**) and updates the in-process override; startup bootstraps from **`TOONFLOW_SWITCH_AI_DEV_TOOL`**, and restart resets to env/default.

    **Memory config (RAG / summary limits):** **`GET`** and **`POST /api/v1/settings/memory-config`** mirror Electron-era **`getMemory`** / **`sureMemory`** (**camelCase** fields, same defaults as SQLite **`initDB`**). Values persist per user in **`app_user_profile.memory_config`** with server defaults as fallback; when **`DATABASE_URL`** is unset these endpoints return **503** **`database_error`** instead of using process-local storage.
    **`POST /api/v1/settings/memory-config/clear-agent-memories`** maps Electron-era **`delAllMemory`**: SaaS requires **`projectId`** + **`agentType`** (optional **`episodesId`**); clears **`app_agent_memory`** for the JWT user only — same rows as **`POST /api/v1/agents/memory/clear`** with **`clearType: all`** (not a global SQLite wipe).

    **Vendor summary (keyless):** **`GET /api/v1/settings/vendors/summary`** replaces the *non-secret* part of Electron-era **`getVendorList`** intent (vendor ids, names, model counts) from the same static catalog as **`GET /api/v1/models`**. It never returns **`inputValues`** / API keys (those stay in server env or billing).
    **`POST /api/v1/settings/vendors/model-test`** validates Electron-era **`modelTest`** fields and enqueues **`app_generation_job`** kind **`settings.vendor.model_test`** (**`queued`** **`JobRow`**); the worker then performs a live probe: **text/image** use a stored vendor credential when available (fallback **`OPENAI_API_KEY`** / **`LLM_API_KEY`**), while **video** resolves **Runway/Pika/Kling** and submits a minimal provider request (fallback provider env vars).
    **Vendor writes (SQLite → SaaS):** **`POST …/vendors/add`**, **`…/update`**, **`…/delete`**, **`…/enable`**, **`…/update-code`**, **`…/code-from-link`** now persist non-sensitive vendor metadata into **`app_user_profile.vendor_config`**. The Rust API stores **`tsCode`** / **`code_link`** references only; it does **not** execute TS, evaluate vm2, or fetch remote code server-side.

    **Danger / wipe (Electron-only):** Legacy **`POST /api/other/deleteAllData`** and **`GET /api/setting/dbConfig/clearData`** rebuilt local SQLite. SaaS keeps **`POST /api/v1/settings/danger/delete-all-data`** and **`POST …/danger/clear-database`** as **501** **`not_implemented`** placeholders — no bulk wipe endpoint on the hosted API. The supported operational replacement is the guarded CLI: **`cargo run --bin toonflow-server -- ops clear-user-data --user-id <uuid> --dry-run`** and then **`--execute --confirm clear-user-data:<uuid>`**.

    **Agent deploy (local SQLite → SaaS):** **`POST /api/v1/settings/agent-deploy/list`** returns the four default **`o_agentDeploy`** rows from **`initDB`**, overlaid with per-user model selection from **`app_user_profile.agent_deploy_config`** when Postgres is configured. **`POST …/deploy-model`** persists model / vendor choice for one of the four rows. **`POST …/set-key`** is a safe **200** no-op: keys are still server-side only.

    **Script agent plan (SQLite → SaaS):** **`POST /api/v1/script-agent/get-plan-data`**, **`POST …/set-plan-data`**, **`POST …/update-data`** accept the same JSON shapes as Electron-era **`/api/scriptAgent/getPlanData`**, **`setPlanData`**, **`updateData`**, backed by Postgres **`app_script_agent_plan`** + **`app_script`** (JWT **`owner_user_id`**, project by **`app_project.numeric_id`**). Responses use the Electron-era **`{ code, data, message }`** envelope (**`code`** is numeric **200** on success). Live agent streaming remains **Harness WS**.

    **Asset generate (SQLite image pipeline → SaaS):** **`POST …/assets-generate/generate`**, **`polish-prompt`**, **`batch-generate`**, **`batch-polish`** validate Electron-era bodies, resolve **`app_project`**, check quota, enqueue one **`app_generation_job`** each (**`asset.generate.image`**, **`asset.polish.prompt`**, **`asset.generate.batch`**, **`asset.polish.batch`**). **`POST …/assets-generate/cancel-generate`** mirrors Electron-era cancel semantics by marking caller-owned **`app_asset_image`** row (**`numeric_image_id = id`**) as **`生成失败`**, and additionally cancels matching caller-owned queued/running **`asset.generate.*`**/**`asset.polish.*`** jobs for the same asset; response remains **`{ message: "取消成功" }`** (idempotent success when no row matches). **`asset.polish.*`** and **`asset.generate.*`** **`succeeded`** when **`OPENAI_API_KEY`/`LLM_API_KEY`** is set: polish uses chat completions; image jobs call **`POST {OPENAI_BASE_URL}/v1/images/edits`** when **`payload.image_base64`** is present (multipart reference image), otherwise **`POST …/images/generations`** (model from request or **`TOONFLOW_IMAGE_MODEL`**, default **`dall-e-3`**). Both paths insert **`app_asset_image`** (**`file_path`** = temporary **`url`**). Legacy **`base64`** is normalized into queue **`payload.image_base64`** (raw base64 → **`data:image/jpeg;base64,...`**). **`concurrentCount`** on batch routes is stored in **`payload`** only (worker runs sequentially). Otherwise those jobs **`failed`**.

    **Production / workbench:** Legacy **`/api/production/*`** **`POST`** routes are exposed under **`/api/v1/production/*`**. **29 endpoints fully implemented** including video track management, batch image generation, video generation with Runway/Pika/Kling support, edit-image flow（含 upload-image）, and storyboard CRUD. All endpoints use strict request schemas and return proper responses. Video generation jobs are handled by the worker with provider polling.

    **Task center (replaces `/api/task/*` POST):** use **`GET /api/v1/projects`** (non-empty names + **`numeric_id`** client-side), **`GET /api/v1/jobs/kinds`**, **`GET /api/v1/jobs/page`** (query **`page`/`limit`/`task_class`/`state`/`project_id`**; **`project_id`** only filters when **`> 0`**, same as Electron-era **`projectId`** vs **`payload.project_numeric_id`**), and **`GET /api/v1/jobs/task-detail/{task_id}`** (**UUID** or positive integer / digit path for **`numeric_task_id`**). Flutter **`postTasks*`** names remain as compat wrappers over these GETs.

    **Project CRUD (UUID):** **`GET`/`POST /api/v1/projects`**, **`GET`/`PATCH`/`DELETE /api/v1/projects/{project_id}`**. **Director manual (`story_skills`):** **`POST …/query-director-manual`** (**`{}`**); **`POST …/add-director-manual`** / **`…/edit-director-manual`** / **`…/delete-director-manual`**. **Visual manual (`art_skills`):** **`POST …/add-visual-manual`** / **`…/edit-visual-manual`** / **`…/delete-visual-manual`** (**`stylePath`** = folder under **`art_skills`**).

    **Script list (UUID project):** **`POST …/projects/{project_id}/scripts/get-script-api`** lists scripts under the UUID project with optional substring **`name`** filter and **`relatedAssets`** (**`app_script_asset`** → **`app_asset`** stable **`numeric_id`** values). Flutter **`postGeneralGetSingleProject`** / **`postGeneralUpdateProject`** are compat names only: they use **`GET /api/v1/projects`** (paged, filter by **`numeric_id`**) and **`PATCH /api/v1/projects/{project_id}`** (field mapping from Electron-era camelCase), not **`/api/v1/general/*`**.

        **Novels + novel-events (UUID project):** **`GET`/`POST …/projects/{project_id}/novels`**，**`GET`/`PATCH`/`DELETE …/novels/{novel_numeric_id}`**（**`novel_numeric_id`** = **`app_novel.numeric_id`**）。**`GET`/`POST …/novel-events`**、**`PATCH`/`DELETE …/novel-events/{event_numeric_id}`**、**`POST …/novel-events/batch-delete`**、**`POST …/novel-events/generate-events`**（异步章节事件抽取）。Flutter **`novels_workbench_http` / `novels_events`** 中的 **`postCompat*`** 名称为兼容包装，内部走上述 REST。**已删除** **`/api/v1/novels/*`** 与 **`…/projects/compat/{id}/novel-events*`**。

    **About / updates:** **`POST /api/v1/settings/about/check-update`** accepts the same **`source`** enum as Electron-era **`checkUpdate`** but does **not** fetch **`update.json`** from OSS. Instead it compares the current crate version with an optional env-driven release manifest (**`TOONFLOW_UPDATE_LATEST_VERSION`**, **`TOONFLOW_UPDATE_TIME`**, **`TOONFLOW_UPDATE_{SOURCE}_URL`**); when unset it safely falls back to **`needUpdate: false`** and the current version. **`POST /api/v1/settings/about/download-app`** validates **`url`** then returns **200** with a policy message — Flutter apps use platform stores/installers, not this API.

servers:
  - url: http://127.0.0.1:8666
    description: Local dev (default `PORT`; override with env)

tags:
  - name: system
    description: Health, readiness, and lightweight probes (incl. Electron-era test-route parity)
  - name: session
    description: Auth probe (Supabase JWT)
  - name: projects
    description: User-owned projects (Postgres + RLS)
  - name: assets
    description: Script-linked assets per project (`app_asset`, `app_script_asset`; Postgres + RLS); corner-scape listing for Electron-era UI parity
  - name: scripts
    description: Scripts under owned projects (Postgres + RLS)
  - name: storyboards
    description: Storyboards under owned scripts (Postgres + RLS)
  - name: production
    description: Legacy Electron production workbench parity over Postgres-backed storyboards, assets, edit-image flow, and video workbench routes
  - name: novels
    description: Novel source chapters per project (`app_novel`; Postgres + RLS)
  - name: art_styles
    description: Per-user art style presets (`app_art_style`; Postgres + RLS); Electron `o_artStyle` subset with local base64 cover persistence instead of OSS upload
  - name: skills
    description: Markdown skills under `backend/data/skills` (read; PUT overwrite; POST create; DELETE remove one file); visual manual (`GET`/`POST /api/v1/visual-manual`) from bundled `art_skills`
  - name: harness
    description: Harness tool catalog over HTTP; tool execution over WebSocket (`harness.tool.invoke` — see `externalDocs`)
  - name: jobs
    description: Long-running generation jobs (`app_generation_job`; Postgres + RLS)
  - name: usage
    description: Per-user usage counts (`app_usage_event`; Postgres + RLS)
  - name: prompts
    description: Per-user prompt templates (`app_user_prompt`; Postgres + RLS); Electron `/api/setting/promptManage/getPrompt` / `updatePrompt`
  - name: models
    description: Static vendor/model catalog (`backend/data/models_catalog.json`); Electron `modelSelect` parity without `o_vendorConfig`
  - name: agents
    description: Per-user agent memory (`app_agent_memory`; Postgres + RLS); Electron `/api/agents/getMemory` / `clearMemory` parity
  - name: webhooks
    description: Server-to-server billing webhooks (HMAC); not browser CORS flows
  - name: settings
    description: Server-backed settings without SQLite `o_setting` (env-driven, in-memory snapshots, or future Postgres)

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness (unversioned)
      operationId: healthRoot
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/health:
    get:
      tags: [system]
      summary: Liveness (versioned)
      operationId: healthV1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/ping:
    get:
      tags: [system]
      summary: Minimal connectivity probe (Electron `/api/test/test` parity)
      operationId: pingV1
      description: |
        Public, no auth, no database. Replaces Electron-era **`GET /api/test/test`** which returned plain text **`ok`**; this route returns JSON **`{"ok":true}`** for versioned API clients.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"

  /api/v1/version:
    get:
      tags: [system]
      summary: Server semantic version (from Cargo package)
      operationId: versionV1
      description: |
        Public, no auth. Aligns with Electron-era **`/api/other/getVersion`** use cases for client compatibility checks.
        When the server binary is compiled with environment **`TOONFLOW_GIT_SHA`** set, the JSON may include **`git_sha`** (opaque string, often a Git commit id).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /api/v1/ready:
    get:
      tags: [system]
      summary: Readiness (optional database ping)
      operationId: readyV1
      description: |
        If `DATABASE_URL` is set, runs `SELECT 1`. Otherwise returns `database: not_configured` (HTTP 200).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /api/v1/webhooks/billing:
    post:
      tags: [webhooks]
      summary: Ingest signed billing webhook (idempotent by JSON `id`)
      operationId: postBillingWebhookV1
      description: |
        Verifies signature of the **raw request body** using `BILLING_WEBHOOK_SECRET`.
        Supports either:
        - **Toonflow native**: `X-Toonflow-Signature: sha256=<hex>` (HMAC-SHA256 of raw body)
        - **Stripe native**: `Stripe-Signature: t=<unix>,v1=<hex>[,v1=<hex>...]` (HMAC-SHA256 of `<unix>.<raw_body>`)
        When both are present, `Stripe-Signature` takes precedence.
        Persists to `app_billing_webhook_event` when event id is new; replays return `duplicate: true` (HTTP 200).
        Deduplication key is **`<billing_provider>:<event_id>`** when `billing_provider` is present (lowercased), otherwise raw event id as-is.
        Event id fields accepted in order: `id` (recommended), `event_id`, `eventId`, `notify_id`, `notifyId`.
        Event id values may be string or integer (integers are normalized to string before dedupe).
        Server also stores best-effort metadata for audit:
        `provider`, `raw_event_id`, `event_type`, `event_created_at`, `is_informational_event`.
        On **first** receipt only, if **`user_id`** (UUID string) and **`plan_tier`** (non-empty string) are present, upserts **`app_user_profile`**.
        Optional profile fields in payload: `billing_currency`, `billing_provider`, `subscription_status`,
        `subscription_current_period_end`, `subscription_status_updated_at`.
        When `billing_provider` is omitted, parser routing applies a currency adapter
        (for status derivation only; dedupe namespace still requires explicit `billing_provider`).
        Default mapping is `CNY -> alipay`, `USD -> stripe`, and can be overridden by
        env `BILLING_CURRENCY_PROVIDER_MAP` (format `CNY=alipay,USD=stripe`).
        For Stripe payloads, server also supports provider mapping from event envelope/object:
        `type` (or fallback `event_type` / `event` / `name` / `notify_type`), `created`, `data.object.status`, `data.object.current_period_end`.
        For audit metadata extraction, event type supports fallback keys
        `event_type` / `event` / `name`, and event time supports fallback keys
        `event_created_at` / `event_created` / `created` / `occurred_at` / `notify_time` / `gmt_payment` / `gmt_create` / `gmt_close` / `timestamp`.
        Current Stripe event fallback coverage includes common subscription/invoice events such as:
        `customer.subscription.created|updated|paused|resumed|unpaused|deleted`,
        `invoice.payment_succeeded|paid|payment_failed|payment_reversal|overdue|payment_action_required|marked_uncollectible|voided`.
        Non-state Stripe events in the informational whitelist (currently
        `customer.subscription.trial_will_end`, `customer.subscription.pending_update_applied`,
        `customer.subscription.pending_update_expired`, `customer.subscription.pending_update_created`,
        `invoice.finalization_failed`, `invoice.upcoming`,
        `invoice.created`, `invoice.finalized`, `invoice.updated`, `invoice.sent`,
        `payment_intent.created`, `payment_intent.succeeded`, `payment_intent.payment_failed`,
        `payment_intent.canceled`, `payment_intent.processing`, `payment_intent.requires_action`,
        `charge.succeeded`, `charge.updated`, `charge.failed`, `charge.captured`,
        `charge.refunded`, `charge.refund.updated`, `charge.dispute.created`,
        `charge.dispute.updated`, `charge.dispute.closed`)
        are treated as informational only (no status transition).
        For Alipay payloads, server supports baseline mapping from:
        `trade_status` / (`type` or fallback `event_type` / `event` / `name` / `notify_type`) / `notify_time`.
        Alipay time values accept RFC3339, unix timestamp (seconds or milliseconds), and Electron-era datetime format `YYYY-MM-DD HH:MM:SS`.
        Non-state Alipay events in the informational whitelist (currently `trade.finished`)
        are treated as informational only.
        For Paddle payloads, server supports baseline mapping from:
        `type` (or fallback `event_type` / `event` / `name` / `notify_type`) / `occurred_at` / `data.status` / `data.next_billed_at`.
        Current Paddle event fallback coverage includes common subscription/transaction events such as:
        `subscription.created|activated|updated|paused|resumed|past_due|canceled|expired`,
        `transaction.completed|payment_failed|canceled`.
        Non-state Paddle events in the informational whitelist (currently
        `subscription.trialing`, `transaction.billed`, `transaction.created`, `transaction.updated`,
        `transaction.paid`, `transaction.ready`) are treated as informational only.
        For subscription fields, incoming updates are guarded by `subscription_status_updated_at` to avoid
        out-of-order webhook events overriding newer state.
        Returns **503** if `BILLING_WEBHOOK_SECRET` is unset or `DATABASE_URL` is not configured.
      security: []
      parameters:
        - name: X-Toonflow-Signature
          in: header
          required: false
          schema:
            type: string
          description: Format `sha256=<hex>` (HMAC-SHA256 of raw body).
        - name: Stripe-Signature
          in: header
          required: false
          schema:
            type: string
          description: |
            Stripe signature format `t=<unix>,v1=<hex>[,v1=<hex>...]`.
            Validated with `BILLING_STRIPE_TOLERANCE_SECS` (default 300 seconds).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                id:
                  type: string
                  description: Preferred dedupe id. Used in dedupe key (namespaced by `billing_provider` when present).
                event_id:
                  type: string
                  description: Compatibility dedupe id fallback.
                eventId:
                  type: string
                  description: Compatibility dedupe id fallback (camelCase).
                notify_id:
                  type: string
                  description: Compatibility dedupe id fallback (third-party provider naming).
                notifyId:
                  oneOf:
                    - type: string
                    - type: integer
                      format: int64
                  description: Compatibility dedupe id fallback (camelCase third-party provider naming).
                event_type:
                  type: string
                  description: Optional event type fallback key (same role as `type`).
                event:
                  type: string
                  description: Optional event type fallback key (provider-compatible alias).
                name:
                  type: string
                  description: Optional event type fallback key (provider-compatible alias).
                notify_type:
                  type: string
                  description: Optional event type fallback key (third-party provider naming).
                event_created_at:
                  description: Optional canonical event timestamp fallback (Unix seconds/milliseconds, RFC3339, or `YYYY-MM-DD HH:MM:SS`).
                  oneOf:
                    - type: integer
                      format: int64
                    - type: string
                user_id:
                  type: string
                  format: uuid
                  description: Optional; when set with `plan_tier`, updates `app_user_profile` on first receipt only.
                plan_tier:
                  type: string
                  description: Optional; e.g. `free`, `pro` (see plan §12).
                billing_currency:
                  type: string
                  description: Optional; e.g. `CNY`.
                billing_provider:
                  type: string
                  description: Optional provider name for audit (e.g. `stripe`, `alipay`, `paddle`).
                subscription_status:
                  type: string
                  description: Optional normalized subscription state (`free|trialing|active|past_due|unpaid|canceled|incomplete|incomplete_expired`).
                subscription_current_period_end:
                  description: Optional subscription period end timestamp (Unix seconds/milliseconds or RFC3339 string).
                  oneOf:
                    - type: integer
                      format: int64
                    - type: string
                subscription_status_updated_at:
                  description: Optional provider event timestamp used for out-of-order protection (Unix seconds/milliseconds or RFC3339 string).
                  oneOf:
                    - type: integer
                      format: int64
                    - type: string
      responses:
        "200":
          description: Accepted (or duplicate replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingWebhookResponse"
        "400":
          description: Invalid JSON or missing non-empty `id`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Missing/bad signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Secret or database not configured
          content:

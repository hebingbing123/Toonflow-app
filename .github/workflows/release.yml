name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 1.0.0)"
        required: false
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_core

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install Flutter dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build Windows desktop app
        run: |
          cd frontend
          flutter build windows --release

      - name: Package Windows app bundle
        shell: pwsh
        run: |
          $artifactDir = "artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Compress-Archive `
            -Path "frontend/build/windows/x64/runner/Release/*" `
            -DestinationPath "$artifactDir/openflow-windows-x64.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: artifacts/openflow-windows-x64.zip
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_core

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install Flutter dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build macOS desktop app
        run: |
          cd frontend
          flutter build macos --release

      - name: Package macOS app bundle
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            frontend/build/macos/Build/Products/Release/openflow_app.app \
            artifacts/openflow-macos-app.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: artifacts/openflow-macos-app.zip
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_core

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install Flutter dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build Linux desktop app
        run: |
          cd frontend
          flutter build linux --release

      - name: Package Linux bundle
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tar -C frontend/build/linux/x64/release -czf artifacts/openflow-linux-x64.tar.gz bundle

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: artifacts/openflow-linux-x64.tar.gz
          retention-days: 30

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-builds
          path: dist

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-builds
          path: dist

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-builds
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenFlow ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
          body: |
            ## Downloads

            - Windows x64 bundle: `openflow-windows-x64.zip`
            - macOS app bundle: `openflow-macos-app.zip`
            - Linux bundle: `openflow-linux-x64.tar.gz`

            ## Install

            - Windows: unzip `openflow-windows-x64.zip`, then run `openflow_app.exe`.
            - macOS: unzip `openflow-macos-app.zip`, then move `openflow_app.app` into `Applications`.
            - Linux: extract `openflow-linux-x64.tar.gz`, then run `bundle/openflow_app`.
          files: |
            dist/openflow-windows-x64.zip
            dist/openflow-macos-app.zip
            dist/openflow-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - "refactor/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refactor-monorepo:
    name: Refactor stack (OpenAPI + Rust + Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: scripts/refactor-check.sh (same as yarn refactor:check)
        run: bash scripts/refactor-check.sh

  supabase-migrations:
    name: Supabase migrations (local DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Postgres (Supabase CLI) and apply supabase/migrations
        run: |
          supabase db start
          supabase db reset --yes --no-seed

  legacy-node:
    name: Legacy Node (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint

name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - "refactor/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-backend:
    name: Rust (backend/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  sqlx-migrations:
    name: Postgres migrations (sqlx smoke)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toonflow_mig_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/toonflow_mig_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap minimal auth schema (bare Postgres)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/ci/pg_bootstrap_for_migrations.sql
      - name: Run sqlx migrations against supabase/migrations
        working-directory: backend
        run: cargo run --bin toonflow-sqlx-migrate

  flutter-frontend:
    name: Flutter (frontend/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  legacy-node:
    name: Legacy Node (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint

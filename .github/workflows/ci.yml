name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - "refactor/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi-contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Export merged OpenAPI and validate YAML
        env:
          OPENFLOW_GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tmp_spec="$(mktemp)"
          (
            cd backend
            cargo run --quiet --bin export-openapi
          ) > "$tmp_spec"
          ruby -ryaml -e "YAML.load(File.read(ARGV[0]))" "$tmp_spec"
          export OPENFLOW_OPENAPI_SPEC="$tmp_spec"
          bash scripts/check_openapi_drift.sh
          bash scripts/check_rust_api_consistency.sh
          rm -f "$tmp_spec"

  backend-rust:
    name: Backend Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: cargo fmt + clippy
        run: |
          set -euo pipefail
          cd backend
          cargo fmt -- --check
          cargo clippy -- -D warnings
      - name: cargo test
        run: |
          set -euo pipefail
          cd backend
          cargo test -p openflow-server --lib -j 1 -- --test-threads=1
          shopt -s nullglob
          for test_rs in tests/*.rs; do
            name=$(basename "$test_rs" .rs)
            if [[ "$name" == "search_api_test" && -z "${DATABASE_URL:-}" ]]; then
              echo "==> skipping $name: DATABASE_URL is not set"
              continue
            fi
            echo "==> integration test crate: $name"
            cargo test -p openflow-server --test "$name" -j 1 -- --test-threads=1
          done
          cargo test -p openflow-server --doc -j 1 -- --test-threads=1

  rust-core:
    name: Rust Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_core
      - name: cargo fmt + clippy + test
        run: |
          set -euo pipefail
          cd rust_core
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

  frontend-flutter:
    name: Frontend Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter pub get
        run: |
          set -euo pipefail
          cd frontend
          flutter pub get
      - name: flutter analyze
        run: |
          set -euo pipefail
          cd frontend
          flutter analyze
      - name: flutter test
        run: |
          set -euo pipefail
          cd frontend
          flutter test

  frontend-desktop-build:
    name: Frontend Desktop Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_core
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev
      - name: Enable Flutter desktop target
        run: flutter config --enable-${{ matrix.target }}-desktop
      - name: flutter pub get
        run: |
          cd frontend
          flutter pub get
      - name: Prebuild Rust desktop bridge
        run: cargo build --manifest-path rust_core/Cargo.toml -p openflow_core_bridge
      - name: Build Flutter desktop app
        run: |
          cd frontend
          flutter build ${{ matrix.target }} --debug

  studio-visual-debt:
    name: Studio visual debt baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Studio visual debt grep gates
        run: bash scripts/studio-visual-debt-check.sh

  ui-smoke:
    name: UI smoke (widget + interaction)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: UI widget + smoke tests (includes golden verify)
        run: |
          set -euo pipefail
          bash scripts/run-ui-review-gates.sh

  ui-audit-tool:
    name: UI audit tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter pub get + test (tools/ui_audit)
        run: |
          set -euo pipefail
          cd tools/ui_audit
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter test

  ui-audit:
    name: UI/UX audit (incremental static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve incremental diff base
        id: diff
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            echo "base=origin/${{ github.base_ref }}...HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "base=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
          fi
      - name: Install ui_audit tool
        run: |
          set -euo pipefail
          cd tools/ui_audit
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Run incremental static audit
        env:
          UI_AUDIT_DIFF_BASE: ${{ steps.diff.outputs.base }}
        run: |
          set -euo pipefail
          cd tools/ui_audit
          dart run ui_audit:ui_audit \
            --config=../../.kiro/audit-config-ci.yaml \
            --incremental \
            --incremental-base="${UI_AUDIT_DIFF_BASE}" \
            --ci \
            --fail-on=high
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-report
          path: .kiro/audit-reports/
          if-no-files-found: ignore

  ui-golden:
    name: UI golden gallery
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Golden gallery (widget)
        run: |
          set -euo pipefail
          cd frontend
          flutter pub get
          flutter test test/ui/ --name golden

  backend-worker-build:
    name: Worker build placeholder (W0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate wrangler.toml present
        run: test -f backend/wrangler.toml

  supabase-migrations:
    name: Supabase migrations (local DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Start local Postgres (Supabase CLI) and apply supabase/migrations
        run: |
          supabase db start
          supabase db reset --yes --no-seed
      - name: PG contract — workspace shared audit export (ignored tests)
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export DATABASE_URL="${DB_URL:?missing DB_URL from supabase status}"
          export SUPABASE_JWT_SECRET="${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}"
          cd backend
          cargo test settings_workspace_shared_audit_export -- --ignored --nocapture --test-threads=1

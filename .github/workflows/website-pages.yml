# Deploy static marketing site (website/) to GitHub Pages on gh-pages branch.
# Enable in repo Settings → Pages → Source: Deploy from branch → gh-pages / root.
name: Website Pages

on:
  push:
    branches: [master, main]
    paths:
      - "website/**"
      - ".github/workflows/website-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy website to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website
          publish_branch: gh-pages
          commit_message: "deploy: website @ ${{ github.sha }}"

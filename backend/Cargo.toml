[package]
name = "toonflow-server"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Toonflow API (Harness-oriented Rust backend; work in progress)"

[[bin]]
name = "toonflow-sqlite-import"
path = "src/bin/sqlite_import.rs"
test = false

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dotenvy = "0.15"
futures-util = "0.3"
governor = "0.10"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = "9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
subtle = "2"
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring", "uuid", "json", "macros", "chrono"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"
wasmi = { version = "0.31", default-features = false }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
utoipa = { version = "5.4.0", features = ["yaml", "chrono", "uuid", "axum_extras"] }
serde_yaml = "0.9.34"

[build-dependencies]
wat = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "export-openapi"
path = "src/bin/export_openapi.rs"
test = false

[features]
redis = []

[profile.test]
debug = 0
incremental = true
# `toonflow-server` 的测试目标很大，256 会把编译切得过碎，长时间停在
# `Compiling toonflow-server` 且几乎没有可见进度。保留并行，但避免过度切分。
codegen-units = 64

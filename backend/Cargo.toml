[package]
name = "openflow-server"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Openflow API (Harness-oriented Rust backend; work in progress)"

[[bin]]
name = "openflow-sqlite-import"
path = "src/bin/sqlite_import.rs"
test = false

[[bin]]
name = "reconcile-billing"
path = "src/bin/reconcile_billing.rs"
test = false

[[bin]]
name = "quality-export"
path = "src/bin/quality_export.rs"
test = false

[[bin]]
name = "quality-regression-check"
path = "src/bin/quality_regression_check.rs"
test = false

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
async-trait = "0.1"
aws-config = { version = "1.5", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1.70", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
axum = { version = "0.8", features = ["macros", "ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
futures-util = "0.3"
governor = "0.10"
hex = "0.4"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
md5 = "0.7"
moka = { version = "0.12", features = ["future"] }
once_cell = "1"
jsonwebtoken = "9"
rand = "0.8"
regex = "1"
rsa = { version = "0.9", features = ["sha2", "pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream", "cookies"] }
urlencoding = "2"
scraper = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
subtle = "2"
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-ring", "uuid", "json", "macros", "chrono", "migrate"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "fs"] }
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"
wasmi = { version = "0.31", default-features = false }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
utoipa = { version = "5.4.0", features = ["yaml", "chrono", "uuid", "axum_extras"] }
serde_yaml = "0.9.34"
opentelemetry = { version = "0.31.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31.0", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.31.1", default-features = false, features = ["trace", "grpc-tonic"] }
tracing-opentelemetry = "0.32.1"

[build-dependencies]
wat = "1"

[dev-dependencies]
futures = "0.3"
proptest = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6.5"

[[bin]]
name = "export-openapi"
path = "src/bin/export_openapi.rs"
test = false

[[bin]]
name = "backfill-job-workspace-id"
path = "src/bin/backfill_job_workspace_id.rs"
test = false

[features]
redis = []
migrate = []

[profile.test]
debug = 0
# 关闭增量编译，避免 target 无限膨胀（与根 .cargo/config.toml 保持一致）
incremental = false
codegen-units = 64

[profile.dev]
# 关闭增量编译，避免 target 无限膨胀
incremental = false
# 减少调试信息级别，大幅缩小 .d 文件和 target 体积
debug = 1
# 适当提高 codegen-units 加快编译速度
codegen-units = 256

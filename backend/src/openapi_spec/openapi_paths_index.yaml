      summary: Same as GET — Electron-era POST verb for getVisualManual
      operationId: postVisualManualV1
      description: 'Identical JSON to **`GET /api/v1/visual-manual`**. Accepts any JSON body (including **`{}`**); body is
        **ignored**.

        Use when migrating clients that called Electron-era **`POST /api/project/getVisualManual`**.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Ignored; may be empty **`{}`**
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisualManualResponse'
        '400':
          description: Skills tree missing or unreadable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

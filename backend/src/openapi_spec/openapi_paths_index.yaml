      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Job row after cancellation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRow'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Job is not `queued` or `running` (already terminal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Auth not configured or database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

        of **`README.md`** as **`name`** (Electron-era strips `--`), optional **`images/*.png`** etc. as relative paths, and
        fixed Markdown slots (**`README`**, **`prefix`**, **`art_prompt/*`**, **`driector_skills/*`**) matching Electron-era
        **`DATA_MAP`**.

        Does not require Postgres. Prefer **GET** for new clients; **`POST /api/v1/visual-manual`** returns the same JSON
        for Electron-era **`POST /api/project/getVisualManual`** callers.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisualManualResponse'
        '400':
          description: Skills tree missing or unreadable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

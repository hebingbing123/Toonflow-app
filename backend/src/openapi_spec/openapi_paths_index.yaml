  /api/v1/jobs/{id}/cancel:
    post:
      tags:
      - jobs
      summary: Cancel a queued or running job
      operationId: cancelJobV1
      description: 'Sets `status` to `cancelled` when the job is **`queued`** or **`running`**. The worker finishes cooperatively
        (it does not overwrite `cancelled` when completing). Terminal states **`succeeded`**, **`failed`**, **`cancelled`**
        → HTTP 409.


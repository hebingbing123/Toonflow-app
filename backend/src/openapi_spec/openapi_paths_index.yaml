  /api/v1/quality/reviews:
    get:
      tags:
      - quality
      summary: List quality reviews for the current user
      operationId: listQualityReviewsV1
      description: 'Returns the caller''s quality review rows ordered by **`created_at DESC`**.

        Supports filtering by **`targetType`**, **`targetId`**, **`jobId`**, and **`isBadCase`**.

        **`limit`** defaults to **100** and clamps to **1..=500**; **`offset`** defaults to **0**.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: targetType
        in: query
        schema:
          type: string
          enum:
          - storyboard
          - script
          - video
          - asset
          - output
      - name: targetId
        in: query
        schema:
          type: string
      - name: jobId
        in: query
        schema:
          type: string
          format: uuid
      - name: isBadCase
        in: query
        schema:
          type: boolean
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Matching quality reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QualityReview'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Database not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    post:
      tags:
      - quality
      summary: Create a quality review for the current user
      operationId: createQualityReviewV1
      description: 'Persists one **`app_quality_review`** row.

        **`targetType`** must be one of **`storyboard`**, **`script`**, **`video`**, **`asset`**, **`output`**.

        **`source`** defaults to **`manual`** and may also be **`auto`**.

        **`badCaseCategory`** is optional but, when present, must match the allowed enum.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQualityReviewBody'
      responses:

paths:
  /api/v1/ws:
    get:
      tags:
      - websocket
      summary: WebSocket upgrade — JSON envelope protocol
      description: '# WebSocket events (`/api/v1/ws`)


        Single WebSocket entry (same version prefix as REST). Clients derive the URL from HTTP `baseUrl`, e.g. `ws://127.0.0.1:8666/api/v1/ws`
        or `wss://…/api/v1/ws` behind TLS.


        ## Wire envelope (target v1)


        All frames are **UTF-8 JSON** with:


        | Field | Type | Required | Notes |

        |--------|------|----------|--------|

        | `type` | string | yes | `domain.action` (lowercase), e.g. `agent.chat.send` |

        | `schema_version` | integer | yes | Start at `1`; bump when payload is incompatible |

        | `payload` | object | yes | Event-specific body |

        | `request_id` | string (uuid) | no | Correlate with logs / tracing |


        Unknown `type` or unsupported `schema_version` → close with policy-defined code or return `error.occurred` (see below).


        ## Authentication


        - **v1 (no BFF)**: Same JWT as REST — Supabase access token.

        - Browsers cannot set arbitrary headers on `WebSocket`; use **query** `access_token=<jwt>` or **first message** `session.auth`
        (see below) — pick one per client and document in Flutter config.


        ### `session.auth` (client → server)


        | Field | Type | Required |

        |-------|------|----------|

        | `type` | const `session.auth` | yes |

        | `schema_version` | `1` | yes |

        | `payload.access_token` | string | yes |


        Server responds with `session.ready` or `error.occurred` before other traffic.


        ### `session.ready` (server → client)


        | Field | Notes |

        |-------|--------|

        | `payload.sub` | Authenticated user id (UUID string, matches JWT `sub`) |


        ### `harness.tool.invoke` (client → server)


        Requires an authenticated session (`?access_token=` or successful `session.auth`). Does **not** require `agent.*.attach`.


        | Field | Type | Required |

        |-------|------|----------|

        | `type` | const `harness.tool.invoke` | yes |

        | `schema_version` | `1` | yes |

        | `payload.name` | string | yes (tool id from `GET /api/v1/harness/tools`) |

        | `payload.arguments` | object | no (defaults to `{}`) |

        | `payload.arguments.path` | string | required for **`skills.read`** — relative path under `data/skills` (same as
        REST `GET /api/v1/skills/content?path=`) |


        #### Production `add_deriveAsset`


        - **`arguments.assetsId`**: parent asset **`app_asset.numeric_id`**. That parent row must be linked to the active
        script (**`app_script_asset`**) for **`arguments.scriptId`** or the script from **`agent.production.attach`** / **`agent.context.update`**.

        - **`arguments.id`** (optional): when updating an existing derived asset, that row must already be linked to the same
        script (**`UPDATE … FROM app_script_asset`** on the server).


        ### `harness.tool.result` (server → client)


        Emitted when invocation succeeds.


        | Field | Notes |

        |-------|--------|

        | `payload.name` | Tool that ran |

        | `payload.result` | JSON value returned by the tool (`echo`: mirrors `arguments`; `isolated.echo`: same as `echo`
        but runs in a child process; `skills.read`: `{ path, content }`; script tools: `get_planData` (includes optional numeric
        `planId` when an `app_script_agent_plan` row exists, aligned with REST `get-plan-data`), `get_script_content`, `get_novel_text`,
        `get_novel_events`, `run_sub_agent_storySkeleton`, `run_sub_agent_adaptationStrategy`, `run_sub_agent_script`, `run_supervision_agent`;
        production tools: `get_flowData`, `add_deriveAsset` (parent `arguments.assetsId` must be linked to the active script
        in `app_script_asset`; see **Production `add_deriveAsset`** below), `del_deriveAsset`, `generate_deriveAsset`, `generate_storyboard`,
        `run_sub_agent_derive_assets`, `run_sub_agent_generate_assets`, `run_sub_agent_director_plan`, `run_sub_agent_storyboard_gen`,
        `run_sub_agent_storyboard_panel`, `run_sub_agent_storyboard_table`; `wasm.probe`: `{ ok, value }`) |


        ### `harness.agent.run` (client → server)


        Multi-round **OpenAI tool calling** loop: the model may invoke Harness catalog tools; the server runs them (same rules
        as `harness.tool.invoke`) and feeds results back until the model returns a final assistant message.


        Requires **`OPENAI_API_KEY` / `LLM_API_KEY`** (same as `agent.chat.send`). Requires an authenticated session and **an
        attached channel** (`agent.script.attach` or `agent.production.attach`) before use.


        | Field | Type | Required |

        |-------|------|----------|

        | `type` | const `harness.agent.run` | yes |

        | `schema_version` | `1` | yes |

        | `payload.content` | string | yes (user goal / instruction) |

        | `payload.max_tool_rounds` | integer | no (default **8**, clamped **1–32**; each “round” is one chat completion that
        may issue tool calls) |


        Shares **`agent.run.cancel`** with streaming chat: cancel aborts an in-flight `harness.agent.run`.


        ### `harness.agent.started` (server → client)


        | Field | Notes |

        |-------|-------|

        | `payload.max_tool_rounds` | Configured cap |


        ### `harness.agent.tool_call` (server → client)


        Emitted before each tool execution during the loop.


        | Field | Notes |

        |-------|-------|

        | `payload.call_id` | OpenAI `tool_call` id |

        | `payload.name` | Tool name |

        | `payload.arguments` | Parsed JSON arguments (or a fallback object if JSON parse fails) |


        ### `harness.agent.finished` (server → client)


        After the model returns a final text response (no tool calls in that completion).


        | Field | Notes |

        |-------|-------|

        | `payload.tool_rounds_executed` | Completions that executed at least one tool call |

        | `payload.finish_reason` | e.g. `stop` |


        ### `harness.agent.cancelled` (server → client)


        Emitted when the run stops due to **`agent.run.cancel`** (cancel token).


        The final assistant text uses the same **`chat.message.*` / `chat.content.*`** sequence as a non-streaming single
        block (one `chat.content.updated` with full text).


        ### `generation.job.updated` (server → client)


        Pushed when a row in `app_generation_job` owned by the caller transitions (for example `queued` → `running` → `succeeded`
        / `failed`, `queued` → `cancelled`, or `failed` → `queued` via retry). **`payload`** is the full job object (snake_case:
        `id`, `owner_user_id`, `kind`, `status`, `payload`, `result`, `error_message`, `idempotency_key`, `created_at`, `updated_at`).


        The server registers the connection for push after auth (`?access_token=` or `session.auth`).


        Cancelling a **`running`** job via REST sets `cancelled` immediately; the in-process worker will not apply `succeeded`
        / `failed` if the row is no longer `running`.


        ### `session.ack` (server → client)


        Generic success for attach / context update / cancel; carries `request_id` when the client sent one.


        ### `agent.chat.send` → LLM stream (server → client)


        When `OPENAI_API_KEY` or `LLM_API_KEY` is configured, the server streams an OpenAI-compatible **`/v1/chat/completions`**
        response and emits (in order):


        1. **`chat.message.created`** — assistant shell (`status`: `streaming`, `name`: `统筹` or `视频策划` by channel).

        2. **`chat.content.added`** — first `text` block (`messageId`, `content.id`).

        3. **`chat.content.updated`** — repeated; `payload.append` carries each token/chunk (client concatenates for full
        text).

        4. **`chat.message.updated`** — `status`: `complete` or `stop` (cancel / disconnect).


        If the API key is missing, respond with **`error.occurred`** (`code`: `llm_not_configured`). Upstream failures use
        `code`: `llm_error`.


        ## Channels vs legacy Socket.IO namespaces


        Legacy Node stack used Socket.IO namespaces:


        | Legacy namespace | Purpose |

        |------------------|---------|

        | `/api/socket/scriptAgent` | 剧本 / 统筹 Agent |

        | `/api/socket/productionAgent` | 视频策划 Agent |


        **Target mapping**: `payload.channel` on the first post-auth message, or dedicated connect types:


        | `type` | Meaning |

        |--------|---------|

        | `agent.script.attach` | Former `scriptAgent` namespace |

        | `agent.production.attach` | Former `productionAgent` namespace |


        `payload` should carry `isolation_key`, `project_id`, and for production `script_id` where applicable (mirrors handshake
        `auth` fields today).


        ## Client → server (legacy names → target `type`)


        | Legacy Socket.IO event | Target `type` | Notes |

        |------------------------|---------------|--------|

        | (Harness) | `harness.tool.invoke` | `payload.name`, optional `payload.arguments` — `echo` returns arguments; `isolated.echo`
        same JSON semantics as `echo` via process isolation; `skills.read` requires `arguments.path` (relative to `data/skills`)
        and returns `{ path, content }`; script tools: `get_planData`, `get_script_content`, `get_novel_text`, `get_novel_events`,
        `run_sub_agent_storySkeleton`, `run_sub_agent_adaptationStrategy`, `run_sub_agent_script`, `run_supervision_agent`;
        production tools: `get_flowData` (`arguments.key` + optional `scriptId`), `add_deriveAsset` (parent `assetsId` must
        be `app_script_asset`-linked for active `scriptId`; see **Production `add_deriveAsset`** below), `del_deriveAsset`,
        `generate_deriveAsset`, `generate_storyboard`, `run_sub_agent_derive_assets`, `run_sub_agent_generate_assets`, `run_sub_agent_director_plan`,
        `run_sub_agent_storyboard_gen`, `run_sub_agent_storyboard_panel`, `run_sub_agent_storyboard_table`; `wasm.probe` runs
        embedded WASM (wasmi) |

        | (Harness agent) | `harness.agent.run` | `payload.content` plus optional `max_tool_rounds` — LLM-driven multi-step
        tool loop; requires attach + API key (see § above) |

        | `chat` | `agent.chat.send` | `payload.content` (string) |

        | `stop` | `agent.run.cancel` | Abort current generation |

        | `updateContext` | `agent.context.update` | Production only; `isolation_key`, `project_id`, `script_id`; legacy used
        ack callback — use `request_id` + optional `session.ack` server message |


        ## Server → client (legacy names → target `type`)


        Legacy emits arbitrary Socket.IO event names. Map to `domain.action`:


        | Legacy event | Target `type` | Payload notes |

        |--------------|---------------|---------------|

        | `message` | `chat.message.created` | New message shell: `id`, `role`, `name`, `status`, `datetime`, `content` array
        |

        | `message:update` | `chat.message.updated` | `id`, `status`, optional `ext` (e.g. `error`) |

        | `content:add` | `chat.content.added` | `messageId`, `content` (discriminated by `content.type`) |

        | `content:update` | `chat.content.updated` | Streaming: e.g. `append` per chunk (see § `agent.chat.send` above) |


        Content block shapes follow `src/socket/chatMessagesData.d.ts` (`text`, `markdown`, `image`, `thinking`, `search`,
        `suggestion`, `toolcall`, `activity`, `reasoning`, etc.) until OpenAPI/JSON Schema is generated for them.


        ## Errors over WebSocket


        | `type` | `payload` |

        |--------|-----------|

        | `error.occurred` | `code` (string), `message` (string), optional `request_id` inside **`payload`** (and the same
        id may appear on the **envelope** root when the client sent one), optional `details` |


        Harness-related `code` values include **`unknown_tool`** (name not in catalog), **`tool_not_implemented`** (catalogued
        but no runtime path yet), **`invalid_payload`** (bad/missing args, path rules, oversize file), **`not_found`** (skill
        path missing), **`skill_unavailable`** (skills dir missing on server), **`isolation_failed`** (child process tool
        error), **`wasm_failed`** (WASM interpreter error for `wasm.probe`), **`unsupported_schema`**.


        Align `code` / `message` semantics with `the exported OpenAPI document` `ErrorBody` where possible.


        ## Reverse proxy


        Configure **one** `location` (or equivalent) for `/api/v1/` so HTTP and `Upgrade: websocket` both reach the Rust service.


        ## Reference implementation (legacy)


        - Namespaces: `src/socket/index.ts`

        - Handlers: `src/socket/routes/scriptAgent.ts`, `src/socket/routes/productionAgent.ts`

        - Outbound payloads: `src/socket/resTool.ts`

        '
      operationId: websocketUpgrade
      responses:
        '101':
          description: Switching Protocols — WebSocket established (RFC 6455)
        '400':
          description: Bad Request — invalid upgrade or handshake
        '401':
          description: Unauthorized — JWT rejected when required by server policy
  /health:
    get:
      tags:
      - system
      summary: Liveness (unversioned)
      operationId: healthRoot
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/health:
    get:
      tags:
      - system
      summary: Liveness (versioned)
      operationId: healthV1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/ping:
    get:
      tags:
      - system
      summary: Minimal connectivity probe (Electron `/api/test/test` parity)
      operationId: pingV1
      description: 'Public, no auth, no database. Replaces Electron-era **`GET /api/test/test`** which returned plain text
        **`ok`**; this route returns JSON **`{"ok":true}`** for versioned API clients.

        '
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
  /api/v1/version:
    get:
      tags:
      - system
      summary: Server semantic version (from Cargo package)
      operationId: versionV1
      description: 'Public, no auth. Aligns with Electron-era **`/api/other/getVersion`** use cases for client compatibility
        checks.

        When the server binary is compiled with environment **`TOONFLOW_GIT_SHA`** set, the JSON may include **`git_sha`**
        (opaque string, often a Git commit id).

        '
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /api/v1/ready:
    get:
      tags:
      - system
      summary: Readiness (optional database ping)
      operationId: readyV1
      description: 'If `DATABASE_URL` is set, runs `SELECT 1`. Otherwise returns `database: not_configured` (HTTP 200).

        '
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/webhooks/billing:
    post:
      tags:
      - webhooks
      summary: Ingest signed billing webhook (idempotent by JSON `id`)
      operationId: postBillingWebhookV1
      description: 'Verifies signature of the **raw request body** using `BILLING_WEBHOOK_SECRET`.

        Supports either:

        - **Toonflow native**: `X-Toonflow-Signature: sha256=<hex>`. Recommended: also send **`X-Toonflow-Timestamp: <unix_secs>`**
        and sign **`HMAC-SHA256(secret, "<unix_secs>." + raw_body)`** (replay-resistant; window **`BILLING_TOONFLOW_TOLERANCE_SECS`**,
        default 300s). Without the timestamp header, legacy **`HMAC-SHA256(secret, raw_body)`** still works unless **`BILLING_TOONFLOW_REQUIRE_TIMESTAMP=1`**.

        - **Stripe native**: `Stripe-Signature: t=<unix>,v1=<hex>[,v1=<hex>...]` (HMAC-SHA256 of `<unix>.<raw_body>`)

        When both are present, `Stripe-Signature` takes precedence.

        Persists to `app_billing_webhook_event` when event id is new; replays return `duplicate: true` (HTTP 200).

        Deduplication key is **`<billing_provider>:<event_id>`** when `billing_provider` is present (lowercased), otherwise
        raw event id as-is.

        Event id fields accepted in order: `id` (recommended), `event_id`, `eventId`, `notify_id`, `notifyId`.

        Event id values may be string or integer (integers are normalized to string before dedupe).

        Server also stores best-effort metadata for audit:

        `provider`, `raw_event_id`, `event_type`, `event_created_at`, `is_informational_event`.

        On **first** receipt only, if **`user_id`** (UUID string) and **`plan_tier`** (non-empty string) are present, upserts
        **`app_user_profile`**.

        Optional profile fields in payload: `billing_currency`, `billing_provider`, `subscription_status`,

        `subscription_current_period_end`, `subscription_status_updated_at`.

        When `billing_provider` is omitted, parser routing applies a currency adapter

        (for status derivation only; dedupe namespace still requires explicit `billing_provider`).

        Default mapping is `CNY -> alipay`, `USD -> stripe`, and can be overridden by

        env `BILLING_CURRENCY_PROVIDER_MAP` (format `CNY=alipay,USD=stripe`).

        For Stripe payloads, server also supports provider mapping from event envelope/object:

        `type` (or fallback `event_type` / `event` / `name` / `notify_type`), `created`, `data.object.status`, `data.object.current_period_end`.

        For audit metadata extraction, event type supports fallback keys

        `event_type` / `event` / `name`, and event time supports fallback keys

        `event_created_at` / `event_created` / `created` / `occurred_at` / `notify_time` / `gmt_payment` / `gmt_create` /
        `gmt_close` / `timestamp`.

        Current Stripe event fallback coverage includes common subscription/invoice events such as:

        `customer.subscription.created|updated|paused|resumed|unpaused|deleted`,

        `invoice.payment_succeeded|paid|payment_failed|payment_reversal|overdue|payment_action_required|marked_uncollectible|voided`.

        Non-state Stripe events in the informational whitelist (currently

        `customer.subscription.trial_will_end`, `customer.subscription.pending_update_applied`,

        `customer.subscription.pending_update_expired`, `customer.subscription.pending_update_created`,

        `invoice.finalization_failed`, `invoice.upcoming`,

        `invoice.created`, `invoice.finalized`, `invoice.updated`, `invoice.sent`,

        `payment_intent.created`, `payment_intent.succeeded`, `payment_intent.payment_failed`,

        `payment_intent.canceled`, `payment_intent.processing`, `payment_intent.requires_action`,

        `charge.succeeded`, `charge.updated`, `charge.failed`, `charge.captured`,

        `charge.refunded`, `charge.refund.updated`, `charge.dispute.created`,

        `charge.dispute.updated`, `charge.dispute.closed`)

        are treated as informational only (no status transition).

        For Alipay payloads, server supports baseline mapping from:

        `trade_status` / (`type` or fallback `event_type` / `event` / `name` / `notify_type`) / `notify_time`.

        Alipay time values accept RFC3339, unix timestamp (seconds or milliseconds), and Electron-era datetime format `YYYY-MM-DD
        HH:MM:SS`.

        Non-state Alipay events in the informational whitelist (currently `trade.finished`)

        are treated as informational only.

        For Paddle payloads, server supports baseline mapping from:

        `type` (or fallback `event_type` / `event` / `name` / `notify_type`) / `occurred_at` / `data.status` / `data.next_billed_at`.

        Current Paddle event fallback coverage includes common subscription/transaction events such as:

        `subscription.created|activated|updated|paused|resumed|past_due|canceled|expired`,

        `transaction.completed|payment_failed|canceled`.

        Non-state Paddle events in the informational whitelist (currently

        `subscription.trialing`, `transaction.billed`, `transaction.created`, `transaction.updated`,

        `transaction.paid`, `transaction.ready`) are treated as informational only.

        For subscription fields, incoming updates are guarded by `subscription_status_updated_at` to avoid

        out-of-order webhook events overriding newer state.

        Returns **503** if `BILLING_WEBHOOK_SECRET` is unset or `DATABASE_URL` is not configured.

        '
      security: []
      parameters:
      - name: X-Toonflow-Signature
        in: header
        required: false
        schema:
          type: string
        description: Format `sha256=<hex>` (HMAC-SHA256 of raw body).
      - name: Stripe-Signature
        in: header
        required: false
        schema:
          type: string
        description: 'Stripe signature format `t=<unix>,v1=<hex>[,v1=<hex>...]`.

          Validated with `BILLING_STRIPE_TOLERANCE_SECS` (default 300 seconds).

          '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                id:
                  type: string
                  description: Preferred dedupe id. Used in dedupe key (namespaced by `billing_provider` when present).
                event_id:
                  type: string
                  description: Compatibility dedupe id fallback.
                eventId:
                  type: string
                  description: Compatibility dedupe id fallback (camelCase).
                notify_id:
                  type: string
                  description: Compatibility dedupe id fallback (third-party provider naming).
                notifyId:
                  oneOf:
                  - type: string
                  - type: integer
                    format: int64
                  description: Compatibility dedupe id fallback (camelCase third-party provider naming).
                event_type:
                  type: string
                  description: Optional event type fallback key (same role as `type`).
                event:
                  type: string
                  description: Optional event type fallback key (provider-compatible alias).
                name:
                  type: string
                  description: Optional event type fallback key (provider-compatible alias).
                notify_type:
                  type: string
                  description: Optional event type fallback key (third-party provider naming).
                event_created_at:
                  description: Optional canonical event timestamp fallback (Unix seconds/milliseconds, RFC3339, or `YYYY-MM-DD
                    HH:MM:SS`).
                  oneOf:
                  - type: integer
                    format: int64
                  - type: string
                user_id:
                  type: string
                  format: uuid
                  description: Optional; when set with `plan_tier`, updates `app_user_profile` on first receipt only.
                plan_tier:
                  type: string
                  description: Optional; e.g. `free`, `pro` (see plan §12).
                billing_currency:
                  type: string
                  description: Optional; e.g. `CNY`.
                billing_provider:
                  type: string
                  description: Optional provider name for audit (e.g. `stripe`, `alipay`, `paddle`).
                subscription_status:
                  type: string
                  description: Optional normalized subscription state (`free|trialing|active|past_due|unpaid|canceled|incomplete|incomplete_expired`).
                subscription_current_period_end:
                  description: Optional subscription period end timestamp (Unix seconds/milliseconds or RFC3339 string).
                  oneOf:
                  - type: integer
                    format: int64
                  - type: string
                subscription_status_updated_at:
                  description: Optional provider event timestamp used for out-of-order protection (Unix seconds/milliseconds
                    or RFC3339 string).
                  oneOf:
                  - type: integer
                    format: int64
                  - type: string
      responses:
        '200':
          description: Accepted (or duplicate replay)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingWebhookResponse'
        '400':
          description: Invalid JSON or missing non-empty `id`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Missing/bad signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Secret or database not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/webhooks/billing/events:
    get:
      tags:
      - webhooks
      summary: List ingested billing webhook events (audit)
      operationId: listBillingWebhookEventsV1
      description: 'Bearer JWT required. **Disabled by default:** the handler returns **403** unless the server sets

        environment variable **`BILLING_WEBHOOK_EVENTS_LIST_ENABLED=1`** (ops/staging audit only).

        The table is a **global** webhook log, not scoped per user; do not enable in production

        multi-tenant deployments without additional controls.


        When enabled, returns recent rows from `app_billing_webhook_event` for audit/debug.

        Supports optional filters by `informational_event`, `provider`, created-at window

        (`created_from` / `created_to`, RFC3339), `raw_event_id` / `raw_event_id_prefix`,

        `event_type`, `provider_event_id_prefix`, `event_created_from` / `event_created_to`,

        row id range (`id_min` / `id_max`, inclusive; `id_min` must be `<= id_max` when both set),

        plus basic pagination (`limit` + `offset`).

        '
      security:
      - bearerAuth: []
      parameters:
      - name: informational_event
        in: query
        required: false
        schema:
          type: boolean
        description: Filter by informational whitelist classification.
      - name: provider
        in: query
        required: false
        schema:
          type: string
        description: Provider filter (normalized lowercase; e.g. `stripe`, `alipay`, `paddle`).
      - name: raw_event_id
        in: query
        required: false
        schema:
          type: string
        description: Exact raw event id filter (non-empty string), e.g. `evt_123`.
      - name: raw_event_id_prefix
        in: query
        required: false
        schema:
          type: string
        description: Prefix match on raw event id (non-empty string), e.g. `evt_`.
      - name: event_type
        in: query
        required: false
        schema:
          type: string
        description: Exact event type filter (non-empty string), e.g. `invoice.payment_failed`.
      - name: provider_event_id_prefix
        in: query
        required: false
        schema:
          type: string
        description: Prefix match on dedupe key `provider_event_id` (non-empty), e.g. `stripe:evt_`.
      - name: provider_event_id
        in: query
        required: false
        schema:
          type: string
        description: Exact match on dedupe key `provider_event_id` (non-empty), e.g. `stripe:evt_123`.
      - name: event_created_from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Include rows with `event_created_at >= event_created_from` (RFC3339).
      - name: event_created_to
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Include rows with `event_created_at <= event_created_to` (RFC3339).
      - name: created_from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Include rows with `created_at >= created_from` (RFC3339).
      - name: created_to
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Include rows with `created_at <= created_to` (RFC3339).
      - name: id_min
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: Include rows with `id >= id_min` (inclusive).
      - name: id_max
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: Include rows with `id <= id_max` (inclusive). When both `id_min` and `id_max` are set, `id_min` must
          be `<= id_max`.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - id_desc
          - id_asc
          default: id_desc
        description: Sort order by row id.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingWebhookEventsResponse'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Listing disabled (`BILLING_WEBHOOK_EVENTS_LIST_ENABLED` is not `1`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Database not configured/reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

      description: 'Same **`path`** query rules and `..` rejection as **`GET /api/v1/skills/content`**, but returns raw bytes
        with an image **`Content-Type`**.

        Allowed extensions: **png**, **jpg**, **jpeg**, **gif**, **webp**, **svg**. Other extensions (including **`.md`**)
        → **400**. Max file size **25_000_000** bytes.

        Use with **`GET /api/v1/visual-manual`** item **`image`** paths (relative under **`data/skills`**) when clients need
        a fetchable URL instead of original OSS-signed links.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: path
        in: query

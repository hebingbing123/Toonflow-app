      operationId: putSkillContentV1
      description: 'Same path rules as **`GET /api/v1/skills/content`**. The target file **must already exist** (Electron-era
        **`saveSkillContent`** returned **400** otherwise). Body size is capped at **2_000_000** bytes (UTF-8).

        '
      security:
      - bearerAuth: []
      requestBody:

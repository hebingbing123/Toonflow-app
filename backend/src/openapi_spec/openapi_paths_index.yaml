    post:
      tags:
      - scripts
      summary: Export scripts as a ZIP of text files (Electron `exportScript` parity)
      operationId: exportScriptsZipV1
      description: 'Returns **`application/zip`** with one **`.txt`** per script (**`{numeric_id}_{sanitized_name}.txt`**).

        Only scripts **owned** by the caller (via `app_project.owner_user_id`) are included; unknown numeric ids are **omitted**
        (SQLite behavior).

        Request body **`numeric_ids`** must be **non-empty** positive integers, at most **500** per call.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportScriptsBody'
      responses:
        '200':
          description: ZIP attachment
          content:
            application/zip:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="scripts.zip"
        '400':
          description: Empty or too many `numeric_ids`, or unknown JSON fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: ZIP build failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

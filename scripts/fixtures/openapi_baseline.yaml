components:
  schemas:
    ABCompareCaseBody:
      properties:
        baselineJobId:
          format: uuid
          type: string
        optimizedJobId:
          format: uuid
          type: string
        testCaseId:
          type: string
      required:
      - testCaseId
      - baselineJobId
      - optimizedJobId
      type: object
    ABCompareCasePersisted:
      properties:
        baselineJobId:
          format: uuid
          type: string
        comparison: {}
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        optimizedJobId:
          format: uuid
          type: string
        testCaseId:
          type: string
      required:
      - id
      - testCaseId
      - baselineJobId
      - optimizedJobId
      - comparison
      - createdAt
      type: object
    ABCompareConfigBody:
      properties:
        maxQualityDrop:
          format: double
          type: number
        minQualityScore:
          format: double
          type: number
        minTokenReductionPct:
          format: double
          type: number
        significanceThreshold:
          format: double
          type: number
      required:
      - minTokenReductionPct
      - maxQualityDrop
      - minQualityScore
      - significanceThreshold
      type: object
    ABCompareRequestBody:
      properties:
        cases:
          items:
            $ref: '#/components/schemas/ABCompareCaseBody'
          type: array
        config:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ABCompareConfigBody'
        name:
          type:
          - string
          - 'null'
        persist:
          type:
          - boolean
          - 'null'
      required:
      - cases
      type: object
    ABCompareResponseBody:
      properties:
        avgQualityDiff:
          format: double
          type: number
        avgTokenReductionPct:
          format: double
          type: number
        comparisons:
          items:
            $ref: '#/components/schemas/ABComparisonLite'
          type: array
        failedCases:
          minimum: 0
          type: integer
        passed:
          type: boolean
        passedCases:
          minimum: 0
          type: integer
        qualityRegressions:
          minimum: 0
          type: integer
        runId:
          format: uuid
          type:
          - string
          - 'null'
        totalCases:
          minimum: 0
          type: integer
      required:
      - totalCases
      - passedCases
      - failedCases
      - avgTokenReductionPct
      - avgQualityDiff
      - qualityRegressions
      - passed
      - comparisons
      type: object
    ABCompareRunDetail:
      properties:
        cases:
          items:
            $ref: '#/components/schemas/ABCompareCasePersisted'
          type: array
        run:
          $ref: '#/components/schemas/ABCompareRunRow'
      required:
      - run
      - cases
      type: object
    ABCompareRunRow:
      properties:
        config: {}
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        name:
          type:
          - string
          - 'null'
        summary: {}
      required:
      - id
      - createdAt
      - config
      - summary
      type: object
    ABComparisonLite:
      properties:
        failureReasons:
          items:
            type: string
          type: array
        pValue:
          format: double
          type:
          - number
          - 'null'
        passed:
          type: boolean
        qualityRegression:
          type: boolean
        qualityScoreDiff:
          format: double
          type:
          - number
          - 'null'
        testCaseId:
          type: string
        tokenReductionPct:
          format: double
          type: number
      required:
      - testCaseId
      - qualityRegression
      - tokenReductionPct
      - passed
      - failureReasons
      type: object
    AcceptWorkspaceInviteBody:
      additionalProperties: false
      properties:
        token:
          type: string
      required:
      - token
      type: object
    AccountDeleteBody:

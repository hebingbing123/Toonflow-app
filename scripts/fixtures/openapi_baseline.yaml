          description: 占位阶段固定 **`false`**；二期才可据此阻断导出。
          type: boolean
        pending_review_bad_case_count:
          description: 与 **`GET …/production-overview`** **`pending_review_bad_case_count`** 同源计数。
          format: int64
          type: integer
        schema_version:
          format: int32
          type: integer
      required:
      - schema_version
      - enforced
      - pending_review_bad_case_count
      type: object
    ShortVideoQualityStageBucket:
      description: L3：**成片候选 / 分镜级**质量评审摘要（只读；与 **`GET /api/v1/quality/reviews`** 同一 `app_quality_review` 源）。
      properties:
        bad_case_count:
          format: int64
          type: integer
        stage:
          description: 空字符串表示 **`stage` IS NULL**。
          type: string
      required:
      - stage
      - bad_case_count
      type: object
    ShortVideoReadinessReasonRollup:
      properties:
        reason:
          type: string
        storyboard_count:
          description: Storyboards that fail this check (one shot may contribute to multiple reasons).
          format: int64
          type: integer
      required:
      - reason
      - storyboard_count
      type: object
    ShortVideoReadinessRollup:
      properties:
        blocked_count:
          format: int64
          type: integer
        by_reason:
          items:
            $ref: '#/components/schemas/ShortVideoReadinessReasonRollup'
          type: array
        ready_count:
          format: int64
          type: integer
        total_storyboards:
          format: int64
          type: integer
      required:
      - total_storyboards
      - ready_count
      - blocked_count
      - by_reason
      type: object
    SkillFileSnapshot:
      description: 技能文件快照
      properties:
        content:
          type:
          - string
          - 'null'
        hash:
          type: string
        path:
          type: string
      required:
      - path
      - hash
      type: object
    SkillSnapshot:
      description: 技能版本快照
      properties:
        skillFiles:
          items:
            $ref: '#/components/schemas/SkillFileSnapshot'
          type: array
        versionTag:
          type:
          - string
          - 'null'
      required:
      - skillFiles
      type: object
    SkipReviewBody:
      additionalProperties: false
      description: 跳过复核请求体
      properties:
        reason:
          type:
          - string
          - 'null'
      type: object
    SliDefinition:
      description: SLI definition for a critical path.
      properties:
        description:
          description: Description of what this path does
          type: string
        endpoints:
          description: Endpoint patterns that belong to this path
          items:
            type: string
          type: array
        name:
          description: Human-readable name
          type: string
        path:
          $ref: '#/components/schemas/CriticalPath'
          description: Critical path identifier
        targetAvailability:
          description: Target availability (0.0 to 1.0)
          format: double
          type: number
        targetP95LatencyMs:
          description: Target p95 latency in milliseconds
          format: int64
          minimum: 0
          type: integer
        targetSuccessRate:
          description: Target success rate (0.0 to 1.0)
          format: double
          type: number
      required:
      - path
      - name
      - description
      - endpoints
      - targetP95LatencyMs
      - targetSuccessRate
      - targetAvailability
      type: object
    SliSnapshot:
      description: SLI snapshot showing current performance vs targets.
      properties:
        availabilityMeetsTarget:
          description: Whether availability meets target
          type: boolean
        currentAvailability:
          description: Current availability (0.0 to 1.0)
          format: double
          type: number
        currentP95LatencyMs:
          description: Current p95 latency in milliseconds
          format: int64
          minimum: 0
          type: integer
        currentSuccessRate:
          description: Current success rate (0.0 to 1.0)
          format: double
          type: number
        definition:
          $ref: '#/components/schemas/SliDefinition'
          description: SLI definition
        healthy:
          description: Overall SLI health (all targets met)
          type: boolean
        latencyMeetsTarget:
          description: Whether p95 latency meets target
          type: boolean
        path:
          $ref: '#/components/schemas/CriticalPath'
          description: Critical path
        successRateMeetsTarget:
          description: Whether success rate meets target
          type: boolean
        totalRequests:
          description: Total requests in measurement window
          format: int64
          minimum: 0
          type: integer
      required:
      - path
      - definition
      - currentP95LatencyMs
      - currentSuccessRate
      - currentAvailability
      - latencyMeetsTarget
      - successRateMeetsTarget
      - availabilityMeetsTarget
      - healthy
      - totalRequests
      type: object
    SliStatusResponse:
      description: SLI status response.
      properties:
        healthy:
          description: Overall system health (all SLIs healthy)
          type: boolean
        slis:
          description: SLI snapshots for all critical paths
          items:
            $ref: '#/components/schemas/SliSnapshot'
          type: array
        windowMinutes:
          description: Time window in minutes
          format: int64
          minimum: 0
          type: integer
      required:
      - slis
      - healthy
      - windowMinutes
      type: object
    StageRoiBreakdown:
      description: 阶段 ROI 分解
      properties:
        avgQualityScore:
          description: 该阶段平均质量得分
          format: double
          type: number
        qualityScoreDelta:
          description: 相对基线的质量得分变化
          format: double
          type: number
        sampleCount:
          description: 该阶段样本数量
          format: int32
          type: integer
        stage:
          description: 阶段名称
          type: string
        tokenDelta:
          description: 相对基线的 Token 增量
          format: int64
          type: integer
        tokensUsed:
          description: 该阶段 Token 消耗
          format: int64
          type: integer
      required:
      - stage
      - tokensUsed
      - tokenDelta
      - avgQualityScore
      - qualityScoreDelta
      - sampleCount
      type: object
    StoryboardQualityProgression:
      description: Quality progression across pipeline stages for a single storyboard.
      properties:
        degradationStages:
          description: Stages where degradation occurred (e.g., ["storyboard_to_video"])
          items:
            type: string
          type: array
        outputQuality:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/QualityMetrics'
            description: Quality metrics at output stage
        qualityDegradationDetected:
          description: Whether quality degradation was detected
          type: boolean
        storyboardId:
          description: Storyboard numeric ID
          format: int32
          type: integer
        storyboardQuality:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/QualityMetrics'
            description: Quality metrics at storyboard stage
        videoQuality:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/QualityMetrics'
            description: Quality metrics at video stage
      required:
      - storyboardId
      - qualityDegradationDetected
      - degradationStages
      type: object
    StoryboardShortVideoReadiness:
      description: |-
        Per-storyboard short-video readiness flags plus derived **`ready_for_generation`**.

        Check semantics are documented in **`backend/docs/short-video-readiness-field-gaps.md`** (Jellyfish
        extras vs stored fields).
      properties:
        blocking_reasons:
          description: Machine-readable reasons when **`ready_for_generation`** is false.
          items:
            type: string
          type: array
        candidate_cleared:
          description: Candidate review cleared — currently **`metadata.shortVideo.candidateStatus`** (see gaps doc).
          type: boolean
        has_basic_slot:
          description: Timeline ordering present (**`app_storyboard.sb_index`**).
          type: boolean
        has_live_action_performance_notes:
          description: 真人模式：表演/口播约束说明（**`metadata.shortVideo.liveAction.performanceNotes`**）。
          type: boolean
        has_live_action_reference_shots:
          description: 真人模式：至少 1 条参考镜头 URL（**`metadata.shortVideo.liveAction.referenceShotUrls`**）。
          type: boolean
        has_prompt_context:
          description: Prompt or video description text present.
          type: boolean
        has_reference_visual:
          description: Reference frame / key visual (**`file_path`**) present.
          type: boolean
        no_blocking_job:
          description: No queued/running **`app_generation_job`** targeting this storyboard.
          type: boolean
        ready_for_generation:
          description: All of the above checks pass.
          type: boolean
        sb_index:
          format: int32
          type:
          - integer
          - 'null'
        script_numeric_id:
          format: int32
          type:
          - integer
          - 'null'
        storyboard_id:
          format: uuid
          type: string
        storyboard_numeric_id:
          format: int32
          type: integer
      required:
      - storyboard_id
      - storyboard_numeric_id
      - has_basic_slot
      - has_prompt_context
      - has_reference_visual
      - has_live_action_reference_shots
      - has_live_action_performance_notes
      - candidate_cleared
      - no_blocking_job
      - ready_for_generation
      - blocking_reasons
      type: object
    SubmitGateDecisionBody:
      additionalProperties: false
      properties:
        decision:
          type:
          - string
          - 'null'
        promoteToBaseline:
          type:
          - boolean
          - 'null'
        promotionRestrictions:
          type:
          - string
          - 'null'
        rationaleNote:
          type:
          - string
          - 'null'
        variantId:
          format: uuid
          type: string
      required:
      - variantId
      type: object
    SubmitReviewBody:
      additionalProperties: false
      description: 提交复核结果请求体
      properties:
        submittedScore: {}
      required:
      - submittedScore
      type: object
    SuggestPlatformCopyBody:
      properties:
        apply:
          type: boolean
        style_hint:
          type:
          - string
          - 'null'
      type: object
    SuggestPlatformCopyResponse:
      properties:
        draft_id:
          format: uuid
          type: string
        platform_copy_fragment: {}
        source:
          type: string
      required:
      - draft_id
      - platform_copy_fragment
      - source
      type: object
    UpdateBenchmarkCaseBody:
      additionalProperties: false
      description: 更新基线样本请求体
      properties:
        caseType:
          type:
          - string
          - 'null'
        issueTags:
          items:
            type: string
          type:
          - array
          - 'null'
        lastVerifiedAt:
          format: date-time
          type:
          - string
          - 'null'
        stage:
          type:
          - string
          - 'null'
        summary:
          type:
          - string
          - 'null'
        weight:
          format: int32
          type:
          - integer
          - 'null'
      type: object
    UpdateObservationAssetBody:
      additionalProperties: false
      description: 更新观察资产请求体
      properties:
        issueType:
          type:
          - string
          - 'null'
        normalizedNote:
          type:
          - string
          - 'null'
        scopeKind:
          type:
          - string
          - 'null'
        signalStrength:
          format: int32
          type:
          - integer
          - 'null'
        status:
          type:
          - string
          - 'null'
      type: object
    UpsertPublishTargetsBody:
      properties:
        targets:
          items:
            $ref: '#/components/schemas/PublishTargetInput'
          type: array
      required:
      - targets
      type: object
    UsageSummaryResponse:
      properties:
        daily_job_quota:
          description: Effective daily job cap for this user (`null` = unlimited).
          format: int64
          type:
          - integer
          - 'null'
        event_counts_last_7d:
          additionalProperties:
            format: int64
            type: integer
          description: Per-`event_type` counts in the rolling last 7 days (same window as `events_last_7d`).
          propertyNames:
            type: string
          type: object
        events_last_24h:
          format: int64
          type: integer
        events_last_7d:
          format: int64
          type: integer
        jobs_today:
          description: Jobs created today (UTC natural day) — same counter used by quota enforcement.
          format: int64
          type: integer
        quota_remaining:
          description: Remaining jobs allowed today (`null` = unlimited). `0` means quota is exhausted.
          format: int64
          type:
          - integer
          - 'null'
      required:
      - events_last_24h
      - events_last_7d
      - event_counts_last_7d
      - jobs_today
      type: object
    VariantCostDelta:
      description: 变体成本增量
      properties:
        costDeltaUsd:
          description: 相对基线的成本增量（美元）
          format: double
          type: number
        estimatedCostUsd:
          description: 估算成本（美元）
          format: double
          type: number
        tokenDelta:
          description: 相对基线的 Token 增量
          format: int64
          type: integer
        tokenDeltaPercent:
          description: 相对基线的 Token 增量百分比
          format: double
          type: number
        totalTokens:
          description: Token 总消耗
          format: int64
          type: integer
      required:
      - totalTokens
      - tokenDelta
      - tokenDeltaPercent
      - estimatedCostUsd
      - costDeltaUsd
      type: object
    VariantRoiComparison:
      description: 变体 ROI 对比
      properties:
        costDelta:
          $ref: '#/components/schemas/VariantCostDelta'
          description: 成本增量（相对基线）
        isBaseline:
          description: 是否为基线变体
          type: boolean
        memoryBudgetProfile:
          $ref: '#/components/schemas/MemoryBudgetProfileSnapshot'
          description: 记忆预算档
        qualityMetrics:
          $ref: '#/components/schemas/QualityMetrics'
          description: 质量指标
        sampleDetails:
          description: 按样本的详细 ROI
          items:
            $ref: '#/components/schemas/SampleRoiDetail'
          type: array
        stageBreakdown:
          description: 按阶段的 ROI 分解
          items:
            $ref: '#/components/schemas/StageRoiBreakdown'
          type: array
        variantId:
          description: 变体 ID
          format: uuid
          type: string
        variantLabel:
          description: 变体标签
          type: string
      required:
      - variantId
      - variantLabel
      - isBaseline
      - memoryBudgetProfile
      - costDelta
      - qualityMetrics
      - sampleDetails
      - stageBreakdown
      type: object
    VersionResponse:
      properties:
        git_sha:
          description: Present when the binary was built with env **`TOONFLOW_GIT_SHA`** set (compile-time `option_env!`).
          type:
          - string
          - 'null'
        service:
          type: string
        version:
          type: string
      required:
      - service
      - version
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: |
        Supabase-issued access token (`Authorization: Bearer <jwt>`).

        Rust validates signature/claims per Supabase project settings (see architecture plan 4.2).
      scheme: bearer
      type: http
info:
  description: 'HTTP under `/api/v1` (use tags below). Typical calls: `Authorization: Bearer <Supabase access_token>`.'
  title: Toonflow API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/agents/memory/append:
    post:
      operationId: appendAgentMemoryV1
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unavailable
      security:
      - bearerAuth: []
      tags:
      - agents
  /api/v1/agents/memory/clear:
    post:
      operationId: clearAgentMemoryV1
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unavailable
      security:
      - bearerAuth: []
      tags:
      - agents
  /api/v1/agents/memory/query:
    post:
      operationId: queryAgentMemoryV1
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unavailable
      security:
      - bearerAuth: []
      tags:
      - agents
  /api/v1/art-styles:
    get:
      operationId: listArtStylesV1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ListArtStylesResponse
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Missing or invalid Bearer token
        '503':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Auth not configured, database error, or `DATABASE_URL` unset
      summary: List art styles for the current user
      tags:
      - art_styles
    post:
      operationId: createArtStyleV1
      requestBody:
        content:
          application/json:
            schema:
              $ref: CreateArtStyleBody
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: ArtStyleRow
          description: Created
        '400':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Invalid body
        '401':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Missing or invalid Bearer token
        '503':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Auth not configured, database error, or `DATABASE_URL` unset
      summary: Create an art style preset
      tags:
      - art_styles
  /api/v1/art-styles/extract-prompt:
    post:
      operationId: extractArtStylePromptV1
      requestBody:
        content:
          application/json:
            schema:
              $ref: ExtractArtStylePromptBody
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ExtractArtStylePromptResponse
          description: OK — extracted text (trimmed assistant message)
        '400':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Invalid body (e.g. empty **`images`** or blank entries after trim)
        '401':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Missing or invalid Bearer token
        '500':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Upstream LLM or parse failure (details not exposed)
        '503':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Auth not configured or LLM keys unset (**`llm_not_configured`**)
      summary: Extract art-style prompt from images (vision LLM)
      tags:
      - art_styles
  /api/v1/art-styles/numeric/{numeric_id}:
    delete:
      operationId: deleteArtStyleByNumericIdV1
      responses:
        '204':
          description: Deleted
        '401':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Missing or invalid Bearer token
        '404':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Not found
        '503':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Auth not configured, database error, or `DATABASE_URL` unset
      summary: Delete an art style preset
      tags:
      - art_styles
    get:
      operationId: getArtStyleByNumericIdV1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ArtStyleRow
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Missing or invalid Bearer token
        '404':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Not found
        '503':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Auth not configured, database error, or `DATABASE_URL` unset
      summary: Get one art style by numeric id
      tags:
      - art_styles
    patch:
      operationId: patchArtStyleByNumericIdV1
      requestBody:
        content:
          application/json:
            schema:
              $ref: PatchArtStyleBody
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: ArtStyleRow
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Invalid patch
        '401':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Missing or invalid Bearer token
        '404':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Not found
        '503':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Auth not configured, database error, or `DATABASE_URL` unset
      summary: Patch art style fields
      tags:
      - art_styles
  /api/v1/art-styles/numeric/{numeric_id}/cover:
    get:
      operationId: getArtStyleCoverByNumericIdV1
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: OK
        '401':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Missing or invalid Bearer token
        '404':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Cover not found for this art style
        '503':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Auth not configured, database error, or `TOONFLOW_LOCAL_ART_STYLE_COVER_DIR` unset
      summary: Fetch one locally persisted art-style cover
      tags:
      - art_styles
  /api/v1/assets-generate/batch-generate:
    post:
      operationId: postAssetsBatchGenerateV1
      requestBody:
        content:
          application/json:
            schema:
              $ref: BatchGenerateImageAssetsBody
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: JobRow
          description: New **`queued`** batch job (**`JobRow`**)
        '400':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Unknown JSON fields or invalid body
        '401':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Missing or invalid Bearer token
        '404':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Not found
        '429':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Daily generation job quota exceeded
        '503':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Auth not configured, database error, or `DATABASE_URL` unset
      summary: Batch-generate asset images (Electron `batchGenerateImageAssets` parity)
      tags:
      - assets
  /api/v1/assets-generate/batch-polish:
    post:
      operationId: postAssetsBatchPolishV1
      requestBody:
        content:
          application/json:
            schema:
              $ref: BatchPolishAssetsPromptBody
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: JobRow
          description: New **`queued`** batch job (**`JobRow`**)
        '400':
          content:
            application/json:
              schema:
                $ref: ErrorBody
          description: Unknown JSON fields or invalid body
        '401':
          content:
            application/json:
              schema:

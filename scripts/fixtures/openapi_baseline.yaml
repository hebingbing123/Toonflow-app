        example: 角色设计
        in: query
        name: q
        required: true
        schema:
          type: string
      - description: 结果类型过滤（可选）：project, script, asset, novel, novel_event；兼容查询参数名 type
        in: query
        name: result_type
        required: false
        schema:
          items:
            type: string
          type: array
      - description: 页码（默认 1）
        in: query
        name: page
        required: false
        schema:
          format: int32
          minimum: 0
          type: integer
      - description: 每页数量（默认 20，最大 100）
        in: query
        name: page_size
        required: false
        schema:
          format: int32
          minimum: 0
          type: integer
      - description: 时间范围起始（ISO 8601 格式）
        in: query
        name: time_from
        required: false
        schema:
          type: string
      - description: 时间范围结束（ISO 8601 格式）
        in: query
        name: time_to
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
          description: 搜索成功
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: 请求参数错误
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: 未认证
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: 无权限访问该工作区
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: 请求过于频繁，已超过速率限制（60 请求/分钟）
        '500':
          content:
            application/json:
              schema:

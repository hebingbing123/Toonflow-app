components:
  schemas:
    ArtStyleRow:
      description: One `app_art_style` row (Electron-era `o_artStyle` subset).
      properties:
        file_url:
          type:
          - string
          - 'null'
        id:
          format: uuid
          type: string
        label:
          type:
          - string
          - 'null'
        name:
          type: string
        numeric_id:
          format: int32
          type: integer
        prompt:
          type:
          - string
          - 'null'
      required:
      - id
      - numeric_id
      - name
      title: ArtStyleRow
      type: object
    AssetRow:
      description: '`app_asset` 实体的数据库行。'
      properties:
        asset_type:
          type: string
        candidate_status:
          description: '`pending` / `linked` / `ignored`；未参与候选流时为 **`null`**。'
          type:
          - string
          - 'null'
        create_time_ms:
          format: int64
          type:
          - integer
          - 'null'
        description:
          type:
          - string
          - 'null'
        id:
          format: uuid
          type: string
        name:
          type: string
        numeric_id:
          format: int32
          type: integer
      required:
      - id
      - numeric_id
      - name
      - asset_type
      type: object
    AssetsOverviewCandidateCounts:
      description: '`GET /api/v1/projects/{project_id}/assets-overview` — C5 统一资产只读聚合。'
      properties:
        ignored:
          format: int64
          type: integer
        linked:
          format: int64
          type: integer
        pending:
          format: int64
          type: integer
        unset:
          description: '**`candidate_status`** unset or unknown — treated as non-candidate flow for counts.'
          format: int64
          type: integer
      required:
      - pending
      - linked
      - ignored
      - unset
      type: object
    AssetsOverviewItem:
      properties:
        asset_id:
          format: uuid
          type: string
        asset_type:
          type: string
        candidate_status:
          type:
          - string
          - 'null'
        linked_script_numeric_ids:
          description: Linked scripts (**`app_script.numeric_id`**) in the same project via **`app_script_asset`**.
          items:
            format: int32
            type: integer
          type: array
        name:
          type: string
        numeric_id:
          format: int32
          type: integer
      required:
      - asset_id
      - numeric_id
      - name
      - asset_type
      - linked_script_numeric_ids
      type: object
    AssetsOverviewTypeGroup:
      properties:
        asset_type:
          type: string
        items:
          items:
            $ref: '#/components/schemas/AssetsOverviewItem'
          type: array
      required:
      - asset_type
      - items
      type: object
    AutoJudgeConfidence:
      description: 自动评测置信度
      enum:
      - high
      - medium
      - low
      type: string
    BatchScheduleDraftsBody:
      properties:
        draft_ids:
          items:
            format: uuid
            type: string
          type: array
        scheduled_at:
          format: date-time
          type:
          - string
          - 'null'
      required:
      - draft_ids
      type: object
    BatchScheduleDraftsResponse:
      properties:
        updated:
          format: int64
          type: integer
      required:
      - updated
      type: object
    BenchmarkCase:
      description: 基线样本记录
      properties:
        caseType:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        issueTags: {}
        lastVerifiedAt:
          format: date-time
          type:
          - string
          - 'null'
        ownerUserId:
          format: uuid
          type: string
        projectId:
          format: int32
          type: integer
        scriptId:
          format: int32
          type:
          - integer
          - 'null'
        sourceKind:
          type: string
        sourceRef:
          type:
          - string
          - 'null'
        stage:
          type: string
        summary:
          type: string
        updatedAt:
          format: date-time
          type: string
        weight:
          format: int32
          type: integer
      required:
      - id
      - ownerUserId
      - projectId
      - stage
      - caseType
      - issueTags
      - weight
      - sourceKind
      - summary
      - createdAt
      - updatedAt
      type: object
    BenchmarkTrendPoint:
      properties:
        approvedCount:
          format: int32
          type: integer
        avgQualityScore:
          format: double
          type: number
        badCaseFailures:
          format: int32
          type: integer
        blockedCount:
          format: int32
          type: integer
        completedResults:
          format: int32
          type: integer
        totalTokens:
          format: int64
          type: integer
        weekStart:
          type: string
      required:
      - weekStart
      - completedResults
      - avgQualityScore
      - totalTokens
      - badCaseFailures
      - approvedCount
      - blockedCount
      type: object
    BenchmarkTrendsResponse:
      properties:
        weeks:
          items:
            $ref: '#/components/schemas/BenchmarkTrendPoint'
          type: array
      required:
      - weeks
      type: object
    BillingWebhookEventItem:
      properties:
        created_at:
          format: date-time
          type: string
        event_created_at:
          format: date-time
          type:
          - string
          - 'null'
        event_type:
          type:
          - string
          - 'null'
        id:
          format: int64
          type: integer
        is_informational_event:
          type: boolean
        provider:
          type:
          - string
          - 'null'
        provider_event_id:
          type: string
        raw_event_id:
          type:
          - string
          - 'null'
      required:
      - id
      - provider_event_id
      - is_informational_event
      - created_at
      type: object
    BillingWebhookEventsResponse:
      properties:
        has_more:
          type: boolean
        items:
          items:
            $ref: '#/components/schemas/BillingWebhookEventItem'
          type: array
        limit:
          format: int64
          type: integer
        next_offset:
          format: int64
          type:
          - integer
          - 'null'
        offset:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
      - items
      - total
      - limit
      - offset
      - has_more
      type: object
    BillingWebhookResponse:
      properties:
        duplicate:
          type: boolean
        id:
          format: int64
          type:
          - integer
          - 'null'
        informational_event:
          type: boolean
        profile_updated:
          type:
          - boolean
          - 'null'
        provider_event_id:
          type:
          - string
          - 'null'
        received:
          type: boolean
      required:
      - received
      - duplicate
      - informational_event
      type: object
    CompressionRules:
      description: 压缩规则
      properties:
        compactSilentLowRisk:
          description: 是否启用静默压缩（低风险场景）
          type: boolean
        continuityNoteMaxChars:
          description: 连续性笔记最大字符数
          format: int32
          type:
          - integer
          - 'null'
        memoryNoteMaxChars:
          description: 记忆笔记最大字符数
          format: int32
          type:
          - integer
          - 'null'
        styleFragmentRetention:
          description: 风格片段保留策略
          type:
          - string
          - 'null'
      required:
      - compactSilentLowRisk
      type: object
    CreateArtStyleBody:
      additionalProperties: false
      properties:
        file_url:
          type:
          - string
          - 'null'
        label:
          type:
          - string
          - 'null'
        name:
          type: string
        prompt:
          type:
          - string
          - 'null'
      required:
      - name
      type: object
    CreateAssetBody:
      additionalProperties: false
      properties:
        description:
          type:
          - string
          - 'null'
        name:
          type: string
        type:
          type: string
      required:
      - name
      - type
      type: object
    CreateBenchmarkCaseBody:
      additionalProperties: false
      description: 创建基线样本请求体
      properties:
        caseType:
          type: string
        issueTags:
          items:
            type: string
          type:
          - array
          - 'null'
        projectId:
          format: int32
          type: integer
        scriptId:
          format: int32
          type:
          - integer
          - 'null'
        sourceKind:
          type: string
        sourceRef:
          type:
          - string
          - 'null'
        stage:
          type: string
        summary:
          type: string
        weight:
          format: int32
          type:
          - integer
          - 'null'
      required:
      - projectId
      - stage
      - caseType
      - sourceKind
      - summary
      type: object
    CreateExperimentBody:
      additionalProperties: false
      description: 创建实验运行请求体
      properties:
        baselineVariantLabel:
          type:
          - string
          - 'null'
        name:
          type: string
        sampleTier:
          type: string
        stageScope:
          items:
            type: string
          type: array
        variants:
          items:
            $ref: '#/components/schemas/CreateVariantBody'
          type: array
      required:
      - name
      - sampleTier
      - stageScope
      - variants
      type: object
    CreateObservationAssetBody:
      additionalProperties: false
      description: 创建观察资产请求体
      properties:
        issueType:
          type: string
        normalizedNote:
          type: string
        projectId:
          format: int32
          type:
          - integer
          - 'null'
        scopeKind:
          type: string
        signalStrength:
          format: int32
          type:
          - integer
          - 'null'
        sourceKind:
          type: string
        sourceRef:
          type:
          - string
          - 'null'
      required:
      - scopeKind
      - issueType
      - sourceKind
      - normalizedNote
      type: object
    CreateProjectBody:
      additionalProperties: false
      description: JSON body for `POST /api/v1/projects` (camelCase from frontend; all fields optional).
      properties:
        artStyle:
          type:
          - string
          - 'null'
        artStylePack:
          description: 画风技能包路径（如 `art_skills/realpeople_ancient_chinese`）
          type:
          - string
          - 'null'
        bgmStrategy:
          description: BGM 策略
          type:
          - string
          - 'null'
        directorManual:
          type:
          - string
          - 'null'
        durationStrategy:
          description: 时长策略（如 short, medium, long）
          example: short
          type:
          - string
          - 'null'
        imageModel:
          type:
          - string
          - 'null'
        imageQuality:
          type:
          - string
          - 'null'
        intro:
          type:
          - string
          - 'null'
        mode:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        projectType:
          type:
          - string
          - 'null'
        storyStylePack:
          description: 故事风格技能包路径（如 `story_skills/Sweet_romance_novel`）
          type:
          - string
          - 'null'
        subtitleStyle:
          description: 字幕样式标识
          type:
          - string
          - 'null'
        targetMarket:
          description: 目标市场（如 domestic, overseas, both）
          example: domestic
          type:
          - string
          - 'null'
        targetPlatforms:
          description: 目标平台数组（如 ["douyin", "bilibili", "tiktok"]）
          example:
          - douyin
          - bilibili
          items:
            type: string
          type:
          - array
          - 'null'
        videoModel:
          type:
          - string
          - 'null'
        videoRatio:
          type:
          - string
          - 'null'
        voiceProfile:
          description: 声线配置标识
          type:
          - string
          - 'null'
      type: object
    CreatePublishDraftBody:
      properties:
        cover_asset_key:
          type:
          - string
          - 'null'
        description:
          type: string
        draft_status:
          type: string
        metadata: {}
        platform_copy: {}
        profile_id:
          format: uuid
          type:
          - string
          - 'null'
        scheduled_at:
          format: date-time
          type:
          - string
          - 'null'
        script_id:
          format: uuid
          type:
          - string
          - 'null'
        tags:
          items:
            type: string
          type: array
        title:
          type: string
        video_asset_key:
          type:
          - string
          - 'null'
      type: object
    CreatePublishJobBody:
      properties:
        payload: {}
      type: object
    CreatePublishProfileBody:
      properties:
        bio_template:
          type:
          - string
          - 'null'
        default_platforms:
          items:
            type: string
          type:
          - array
          - 'null'
        metadata: {}
        name:
          type: string
        schedule_strategy:
          type:
          - string
          - 'null'
        tag_strategy:
          type:
          - string
          - 'null'
        target_market:
          type:
          - string
          - 'null'
        title_style:
          type:
          - string
          - 'null'
      type: object
    CreateVariantBody:
      additionalProperties: false
      description: 创建变体请求体
      properties:
        label:
          type: string
        memoryBudgetSnapshot:
          $ref: '#/components/schemas/MemoryBudgetSnapshot'
        modelRouteSnapshot:
          $ref: '#/components/schemas/ModelRouteSnapshot'
        notes:
          type:
          - string
          - 'null'
        observationPolicySnapshot:
          $ref: '#/components/schemas/ObservationPolicySnapshot'
        promptSnapshot:
          $ref: '#/components/schemas/PromptSnapshot'
        skillSnapshot:
          $ref: '#/components/schemas/SkillSnapshot'
      required:
      - label
      - skillSnapshot
      - promptSnapshot
      - memoryBudgetSnapshot
      - observationPolicySnapshot
      - modelRouteSnapshot
      type: object
    CriticalPath:
      description: Critical user paths that have defined SLIs.
      enum:
      - video_generation
      - publish_workflow
      - quality_review
      - project_overview
      - asset_management
      type: string
    DimensionWeightItem:
      description: 维度权重条目
      properties:
        dimension:
          $ref: '#/components/schemas/QualityDimension'
        displayName:
          type: string
        weight:
          format: double
          type: number
      required:
      - dimension
      - displayName
      - weight
      type: object
    EndpointMetrics:
      description: Aggregated metrics for a specific endpoint.
      properties:
        avgLatencyMs:
          description: Average latency in milliseconds
          format: int64
          minimum: 0
          type: integer
        clientErrorCount:
          description: Client error requests (4xx status)
          format: int64
          minimum: 0
          type: integer
        errorBreakdown:
          additionalProperties:
            format: int64
            minimum: 0
            type: integer
          description: Error breakdown by error code
          propertyNames:
            type: string
          type: object
        p50LatencyMs:
          description: p50 latency in milliseconds
          format: int64
          minimum: 0
          type: integer
        p95LatencyMs:
          description: p95 latency in milliseconds
          format: int64
          minimum: 0
          type: integer
        p99LatencyMs:
          description: p99 latency in milliseconds
          format: int64
          minimum: 0
          type: integer
        path:
          description: Endpoint path pattern
          type: string
        serverErrorCount:
          description: Server error requests (5xx status)
          format: int64
          minimum: 0
          type: integer
        successCount:
          description: Successful requests (2xx status)
          format: int64
          minimum: 0
          type: integer
        successRate:
          description: Success rate (0.0 to 1.0)
          format: double
          type: number
        totalRequests:
          description: Total request count
          format: int64
          minimum: 0
          type: integer
        windowEnd:
          format: date-time
          type: string
        windowStart:
          description: Time window for these metrics
          format: date-time
          type: string
      required:
      - path
      - totalRequests
      - successCount
      - clientErrorCount
      - serverErrorCount
      - successRate
      - p50LatencyMs
      - p95LatencyMs
      - p99LatencyMs
      - avgLatencyMs
      - errorBreakdown
      - windowStart
      - windowEnd
      type: object
    ErrorBody:
      properties:
        code:
          description: Machine-readable error code (e.g., "validation_error", "not_found", "conflict")
          type: string
        details:
          description: Optional additional context (e.g., field-specific validation errors, version conflicts)
        message:
          description: Human-readable error message
          type: string
        request_id:
          description: Request ID for tracing and debugging (injected by middleware)
          type:
          - string
          - 'null'
        retry_after_ms:
          description: Milliseconds until the rate-limit / quota window resets. Present on **429** responses.
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        status:
          description: HTTP status code (e.g., 400, 404, 409, 500)
          format: int32
          minimum: 0
          type: integer
      required:
      - status
      - code
      - message
      type: object
    ExperimentDetail:
      description: 实验运行详情响应
      properties:
        experiment:
          $ref: '#/components/schemas/ExperimentRun'
        variants:
          items:
            $ref: '#/components/schemas/ExperimentVariant'
          type: array
      required:
      - experiment
      - variants
      type: object
    ExperimentRun:
      description: 实验运行记录
      properties:
        baselineVariantId:
          format: uuid
          type:
          - string
          - 'null'
        completedAt:
          format: date-time
          type:
          - string
          - 'null'
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        ownerUserId:
          format: uuid
          type: string
        sampleTier:
          type: string
        stageScope: {}
        startedAt:
          format: date-time
          type:
          - string
          - 'null'
        status:
          type: string
      required:
      - id
      - ownerUserId
      - name
      - status
      - sampleTier
      - stageScope
      - createdAt
      type: object
    ExperimentScoreSummary:
      description: 实验结果评分汇总
      properties:
        confidence:
          $ref: '#/components/schemas/AutoJudgeConfidence'
          description: 自动评测置信度
        dimensionScores:
          description: 各维度评分
          items:
            $ref: '#/components/schemas/RubricDimensionScore'
          type: array
        passed:
          description: 是否通过（基于阈值）
          type: boolean
        recommendBadCase:
          description: 是否建议升为 bad case
          type: boolean
        recommendGoldenCase:
          description: 是否建议升为 golden case
          type: boolean
        recommendPromotion:
          description: 是否建议放行
          type: boolean
        requiresHumanReview:
          description: 是否需要人工复核
          type: boolean
        summary:
          description: 汇总说明
          type: string
        weightedTotalScore:
          description: 加权总分（0-100）
          format: double
          type: number
      required:
      - dimensionScores
      - weightedTotalScore
      - passed
      - recommendPromotion
      - recommendBadCase
      - recommendGoldenCase
      - confidence
      - requiresHumanReview
      - summary
      type: object
    ExperimentVariant:
      description: 实验变体快照
      properties:
        experimentRunId:
          format: uuid
          type: string
        id:
          format: uuid
          type: string
        isBaseline:
          type: boolean
        label:
          type: string
        memoryBudgetSnapshot: {}
        modelRouteSnapshot: {}
        notes:
          type:
          - string
          - 'null'
        observationPolicySnapshot: {}
        promptSnapshot: {}
        skillSnapshot: {}
      required:
      - id
      - experimentRunId
      - label
      - isBaseline
      - skillSnapshot
      - promptSnapshot
      - memoryBudgetSnapshot
      - observationPolicySnapshot
      - modelRouteSnapshot
      type: object
    ExtractArtStylePromptBody:
      additionalProperties: false
      properties:
        images:
          items:
            type: string
          maxItems: 16
          minItems: 1
          type: array
      required:
      - images
      type: object
    ExtractArtStylePromptResponse:
      properties:
        text:
          type: string
      required:
      - text
      type: object
    GateDecisionEnvelope:
      properties:
        assessments:
          items:
            $ref: '#/components/schemas/GateVariantAssessment'
          type: array
        baselineVariantId:
          format: uuid
          type:
          - string
          - 'null'
        experimentRunId:
          format: uuid
          type: string
        latestDecisions:
          items:
            $ref: '#/components/schemas/GateDecisionRecord'
          type: array
      required:
      - experimentRunId
      - assessments
      - latestDecisions
      type: object
    GateDecisionRecord:
      properties:
        decidedAt:
          format: date-time
          type: string
        decidedBy:
          format: uuid
          type:
          - string
          - 'null'
        decision:
          type: string
        experimentRunId:
          format: uuid
          type: string
        id:
          format: uuid
          type: string
        rationale: {}
        variantId:
          format: uuid
          type: string
      required:
      - id
      - experimentRunId
      - variantId
      - decision
      - rationale
      - decidedAt
      type: object
    GateVariantAssessment:
      properties:
        autoDecision:
          type: string
        avgQualityScore:
          format: double
          type: number
        badCaseRecurrenceDelta:
          format: int32
          type: integer
        isBaseline:
          type: boolean
        qualityScoreDelta:
          format: double
          type: number
        rationale: {}
        requiresHumanReviewCount:
          format: int32
          type: integer
        severeGuardFailures:
          format: int32
          type: integer
        tokenDeltaPercent:
          format: double
          type: number
        totalTokens:
          format: int64
          type: integer
        variantId:
          format: uuid
          type: string
        variantLabel:
          type: string
      required:
      - variantId
      - variantLabel
      - isBaseline
      - autoDecision
      - severeGuardFailures
      - requiresHumanReviewCount
      - avgQualityScore
      - qualityScoreDelta
      - totalTokens
      - tokenDeltaPercent
      - badCaseRecurrenceDelta
      - rationale
      type: object
    HarnessToolInfo:
      description: One entry in `GET /api/v1/harness/tools`.
      properties:
        description:
          type: string
        name:
          type: string
      required:
      - name
      - description
      type: object
    HarnessToolsResponse:
      properties:
        tools:
          items:
            $ref: '#/components/schemas/HarnessToolInfo'
          type: array
      required:
      - tools
      type: object
    HealthResponse:
      properties:
        service:
          type: string
        status:
          type: string
      required:
      - status
      - service
      type: object
    IssueSeverity:
      description: 问题严重等级
      enum:
      - critical
      - major
      - moderate
      - minor
      type: string
    ListArtStylesResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ArtStyleRow'
          type: array
        total:
          format: int64
          type: integer
      required:
      - items
      - total
      type: object
    ListAssetsResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AssetRow'
          type: array
        total:
          format: int64
          type: integer
      required:
      - items
      - total
      type: object
    ListPublishAuditQuery:
      properties:
        delivery_mode:
          type:
          - string
          - 'null'
        draft_id:
          format: uuid
          type:
          - string
          - 'null'
        evidence_key:
          type:
          - string
          - 'null'
        job_id:
          format: uuid
          type:
          - string
          - 'null'

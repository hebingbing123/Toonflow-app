  /api/v1/jobs:
    get:
      description: |-
        List jobs with workspace visibility filtering.

        ## Visibility Rules

        Jobs are visible to the authenticated user if:

        1. **Owner visibility**: The user is the job owner (`owner_user_id` matches the authenticated user)
        2. **Workspace member visibility**: The job is associated with a project in a workspace where the user is a member

        ### Project Association

        Jobs are associated with a project when the job payload contains project scope fields:
        - `project_uuid`: Preferred project UUID (`app_project.id`)
        - `project_numeric_id`: Legacy numeric project ID fallback

        ### Personal Jobs

        Jobs without project information (no `project_uuid` or `project_numeric_id` in payload) are **personal jobs** and are only visible to the job owner.

        ### Archived Projects

        Jobs associated with archived projects are excluded from workspace member visibility. Only the job owner can see jobs for archived projects.

        ### Workspace Membership Validation

        When filtering by `project_id`, the endpoint validates that the user is a member of the project's workspace. This filter remains the legacy numeric project selector for task-center compatibility. Non-members receive a 403 Forbidden error.
      operationId: listJobsV1
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Conflict
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Too many requests
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Server error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unavailable
      security:
      - bearerAuth: []
      tags:
      - jobs
    post:
      description: |-
        Create a new job with workspace membership validation for project-associated jobs.

        ## Workspace Membership Validation

        When creating a job with project scope fields in the payload (`project_uuid` preferred, `project_numeric_id` legacy fallback), the endpoint validates:

        1. **Project exists**: The project must exist and not be archived
        2. **Workspace membership**: The user must be a member of the project's workspace
        3. **Payload normalization**: The payload is normalized with correct `project_uuid`, `project_numeric_id`, and `workspace_id`

        ### Personal Jobs

        Jobs without project fields (no `project_uuid` or `project_numeric_id` in payload) are **personal jobs** and do not require workspace membership validation.

        ### Access Denied

        If the user is not a workspace member of the project, the endpoint returns 404 Not Found (not 403 Forbidden) to maintain security by not revealing the existence of projects the user cannot access.

        ### Archived Projects

        Attempting to create a job for an archived project returns 403 Forbidden.

        ## Visibility After Creation

        Once created, the job follows the standard visibility rules:
        - **Owner visibility**: Always visible to the job owner
        - **Workspace member visibility**: Visible to workspace members if associated with a project
      operationId: createJobV1
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: OK
        '400':
          content:
            application/json:
              schema:

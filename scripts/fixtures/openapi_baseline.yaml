  securitySchemes:
    apiKeyAuth:
      in: header
      name: X-API-Key
      type: apiKey
    bearerAuth:
      bearerFormat: JWT
      description: |
        Supabase-issued access token (`Authorization: Bearer <jwt>`).

        Rust validates signature/claims per Supabase project settings (see architecture plan 4.2).
      scheme: bearer
      type: http
info:
  description: 'HTTP under `/api/v1` (use tags below). Typical calls use `Authorization: Bearer <Supabase access_token>`. Settings can also mint user API keys, and authenticated product routes accept `X-API-Key: tfk_...` for server-to-server automation.'
  title: Toonflow API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/agents/memory/append:
    post:
      operationId: appendAgentMemoryV1
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Bad request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unauthorized
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
          description: Unavailable
      security:
      - bearerAuth: []
      tags:
      - agents

        / billing fields from **`app_user_profile`** (defaults to **`plan_tier: free`** when no row).

        Includes `subscription_status` and `subscription_current_period_end_at` when present in profile.

        Also returns **`daily_job_quota`** (effective cap; `null` = unlimited) and **`jobs_today`** (UTC-day count) when the
        database is connected — clients can use these to render quota progress without a separate call.'
